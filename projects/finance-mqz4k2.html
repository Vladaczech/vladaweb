<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Bezpečnost: stránka nesmí navázat žádné síťové spojení (connect-src 'none'),
     nenačítá žádné cizí skripty ani písma. Data nikdy neopustí prohlížeč. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Finance</title>
<style>
:root{
  color-scheme:light;
  --bg:#f4f4f1;--surface:#fcfcfb;--surface2:#f0efec;
  --ink:#0b0b0b;--ink2:#52514e;--muted:#67665f;--axis-ink:#898781;
  --line:#e1e0d9;--base:#c3c2b7;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;
  --pos:#006300;--accent:#2a78d6;--accent-ink:#fff;--accent-wash:rgba(42,120,214,.10);
  --hover:rgba(11,11,11,.045);--ring:rgba(11,11,11,.10);--danger:#c62828;
  --warn-bg:#fff4d6;--warn-ink:#5c4100;
  --r:12px;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d0d0d;--surface:#1a1a19;--surface2:#242422;
    --ink:#f0efec;--ink2:#c3c2b7;--muted:#a3a198;--axis-ink:#898781;
    --line:#2c2c2a;--base:#383835;
    --s1:#3987e5;--s2:#d95926;--s3:#199e70;
    --pos:#0ca30c;--accent:#3987e5;--accent-ink:#fff;--accent-wash:rgba(57,135,229,.16);
    --hover:rgba(255,255,255,.05);--ring:rgba(255,255,255,.10);--danger:#ff6b6b;
    --warn-bg:#352a0e;--warn-ink:#ffd98a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d0d0d;--surface:#1a1a19;--surface2:#242422;
  --ink:#f0efec;--ink2:#c3c2b7;--muted:#a3a198;--axis-ink:#898781;
  --line:#2c2c2a;--base:#383835;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;
  --pos:#0ca30c;--accent:#3987e5;--accent-ink:#fff;--accent-wash:rgba(57,135,229,.16);
  --hover:rgba(255,255,255,.05);--ring:rgba(255,255,255,.10);--danger:#ff6b6b;
  --warn-bg:#352a0e;--warn-ink:#ffd98a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}

.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.brand{font-weight:650;font-size:16px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;color:var(--ink2);padding:7px 12px;border-radius:8px;font-weight:500;cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--hover);color:var(--ink)}
.tab[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--ring)}
.saved{font-size:12px;color:var(--muted);white-space:nowrap}
.main{max-width:1180px;margin:0 auto;padding:20px 16px 96px}
@media (max-width:760px){
  .top-in{flex-wrap:wrap;row-gap:6px}
  .tabs{order:3;flex-basis:100%}
  .hide-sm{display:none!important}
}

.stack{display:grid;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);padding:18px;min-width:0}
.card h2{font-size:15px}
.sub{color:var(--muted);font-size:13px;margin:2px 0 14px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.end{justify-content:flex-end}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.pos{color:var(--pos)}
.nowrap{white-space:nowrap}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);padding:14px 16px;min-width:0}
.tile .l{color:var(--muted);font-size:12.5px}
.tile .v{font-size:22px;font-weight:650;letter-spacing:-.015em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .n{color:var(--muted);font-size:12px;margin-top:2px}

.inp{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:36px;max-width:100%}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
select.inp{padding-right:28px}
.inp.err{border-color:var(--danger)}
.btn{font-weight:500;border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:8px;cursor:pointer;min-height:36px;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{padding:3px 10px;min-height:28px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-size:13px;text-align:left}
.link:hover{text-decoration:underline}
.field{display:grid;gap:4px;font-size:12.5px;color:var(--ink2);min-width:0}
.field .inp{width:100%}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;align-items:end}
.check{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink2);cursor:pointer}
.errtxt{color:var(--danger);font-size:13px}
.notice{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:10px 14px;font-size:13px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.notice .btn{color:var(--ink)}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:20px;background:var(--surface2);color:var(--ink2);white-space:nowrap}

.seg{justify-self:start;display:inline-flex;background:var(--surface2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;cursor:pointer;color:var(--ink2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--ring)}

table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr.rw{cursor:pointer}
.t tr.rw:hover td{background:var(--hover)}
.t tr.open td{background:var(--hover)}
.t th.num,.t td.num{text-align:right}
.cp{font-weight:500;overflow-wrap:anywhere}
.msg{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.t select.inp{min-height:30px;padding:2px 24px 2px 6px;font-size:13px;width:170px}
.detail td{background:var(--surface2)!important;cursor:default}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 18px;font-size:13px;padding:4px 2px}
.kv span{display:block;color:var(--muted);font-size:11.5px}
.scroll{overflow-x:auto}

.chart{position:relative;min-height:60px}
.chart svg{display:block;overflow:visible;touch-action:pan-y}
.grid-l{stroke:var(--line);stroke-width:1}
.base-l{stroke:var(--base);stroke-width:1}
.ax{fill:var(--axis-ink);font-size:11px;font-variant-numeric:tabular-nums}
.dl{fill:var(--ink2);font-size:11.5px;font-weight:500}
.hit{fill:transparent;cursor:pointer;outline:none}
.wash{fill:var(--hover);opacity:0}
.wash.on{opacity:1}
.cross{stroke:var(--base);stroke-width:1}
.tip{position:absolute;display:none;pointer-events:none;background:var(--surface);border:1px solid var(--ring);box-shadow:0 8px 28px rgba(0,0,0,.14);border-radius:9px;padding:8px 10px;font-size:12.5px;min-width:150px;z-index:5}
.tip-t{color:var(--muted);margin-bottom:4px}
.tip-r{display:flex;align-items:center;gap:8px;line-height:1.7}
.tip-r b{font-variant-numeric:tabular-nums;font-weight:650}
.tip-r .n{color:var(--ink2)}
.key{display:inline-block;width:12px;height:3px;border-radius:2px;flex:none}
.key.box{height:10px;width:10px;border-radius:3px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
details.tbl{margin-top:10px;font-size:13px}
details.tbl summary{cursor:pointer;color:var(--accent);font-size:13px;width:max-content}
details.tbl table{margin-top:8px}

.cats{display:grid;gap:1px}
.catrow{display:grid;grid-template-columns:minmax(96px,170px) minmax(40px,1fr) auto;gap:12px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.catrow:hover{background:var(--hover)}
.catrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden}
.fill{height:100%;background:var(--s1);border-radius:0 4px 4px 0;min-width:2px}
.catrow .amt{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;min-width:118px}
.catrow .share{color:var(--muted);font-size:12px;display:inline-block;min-width:40px;text-align:right}

.drop{border:1.5px dashed var(--base);border-radius:var(--r);padding:44px 20px;text-align:center;cursor:pointer;background:var(--surface);transition:background .15s,border-color .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-wash)}
.drop-t{font-size:16px;font-weight:600;margin-bottom:4px}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.req::after{content:" *";color:var(--danger)}
.sample{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps{margin:0;padding-left:18px;color:var(--ink2);font-size:13px;display:grid;gap:6px}

.acc-list{display:grid;gap:8px}
.acc{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:10px}
.acc b{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:3px 4px 3px 10px;font-size:13px;background:var(--surface)}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted);border-radius:12px;padding:0 6px;font-size:13px}
.chip button:hover{background:var(--hover);color:var(--ink)}
.chip .c{color:var(--muted);font-size:12px}

.lock{min-height:100vh;display:grid;place-items:center;padding:16px}
.lock-card{width:min(430px,100%);display:grid;gap:14px;padding:28px}
.lock-card form{display:grid;gap:10px}
.lock-card .inp{width:100%}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.42);display:grid;place-items:center;padding:16px;z-index:50}
.modal{width:min(460px,100%);display:grid;gap:12px}
.modal h3{font-size:16px}
.modal p{margin:0;color:var(--ink2)}
.modal .inp{width:100%}
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:60;width:min(600px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 10px 10px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 32px rgba(0,0,0,.28);font-size:13.5px}
.toast span{flex:1}
.toast .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 45%,transparent)}
.toast .x{background:none;border:0;color:var(--bg);font-size:18px;cursor:pointer;opacity:.7;padding:0 6px}
.empty{text-align:center;padding:48px 20px}
.empty h2{font-size:19px;margin-bottom:4px}
.empty .sub{max-width:520px;margin:6px auto 18px}
.info p{margin:0 0 8px;color:var(--ink2);font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>
<script>
(() => {
'use strict';

/* ================================================================
   Pomocné funkce
   ================================================================ */
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app');

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'hidden') el[k] = v;
    else el.setAttribute(k, v === true ? '' : String(v));
  }
  return el;
}
const SVGNS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs, ...kids) {
  const el = document.createElementNS(SVGNS, tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) if (v != null) el.setAttribute(k, v);
  for (const c of kids.flat()) if (c != null) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return el;
}

const MES = ['led','úno','bře','dub','kvě','čvn','čvc','srp','zář','říj','lis','pro'];
const MES_FULL = ['leden','únor','březen','duben','květen','červen','červenec','srpen','září','říjen','listopad','prosinec'];
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const nf0 = new Intl.NumberFormat('cs-CZ', { maximumFractionDigits: 0 });
const nf2 = new Intl.NumberFormat('cs-CZ', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pl = (n, one, few, many) => `${nf0.format(n)} ${n === 1 ? one : n >= 2 && n <= 4 ? few : many}`;
const kc = (n, dec) => (n < 0 ? '−' : '') + (dec ? nf2 : nf0).format(Math.abs(n)) + ' Kč';
const kcSigned = n => (n > 0 ? '+' : n < 0 ? '−' : '') + nf2.format(Math.abs(n)) + ' Kč';
function compact(n) {
  const a = Math.abs(n), s = n < 0 ? '−' : '';
  if (a >= 1e6) return s + (a / 1e6).toLocaleString('cs-CZ', { maximumFractionDigits: 1 }) + ' mil.';
  if (a >= 1e3) return s + (a / 1e3).toLocaleString('cs-CZ', { maximumFractionDigits: a >= 1e4 ? 0 : 1 }) + ' tis.';
  return s + nf0.format(a);
}
const fmtDate = d => { if (!d) return ''; const [y, m, dd] = d.split('-'); return `${+dd}. ${+m}. ${y}`; };
const monthKey = d => d.slice(0, 7);
const monthLabel = (k, long) => { const [y, m] = k.split('-'); return long ? `${MES_FULL[+m - 1]} ${y}` : `${MES[+m - 1]} ${y.slice(2)}`; };
function addMonths(k, n) { let [y, m] = k.split('-').map(Number); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return `${y}-${pad(m)}`; }
function monthsBetween(a, b) { const out = []; let k = a, g = 0; while (k <= b && g++ < 1200) { out.push(k); k = addMonths(k, 1); } return out; }
function lastDay(k) { const [y, m] = k.split('-').map(Number); return `${k}-${pad(new Date(y, m, 0).getDate())}`; }
const dayNum = d => { const [y, m, dd] = d.split('-').map(Number); return Date.UTC(y, m - 1, dd) / 864e5; };
const minStr = (a, b) => a < b ? a : b;

/* ================================================================
   Šifrované úložiště (AES-256-GCM, klíč z hesla přes PBKDF2)
   ================================================================ */
const ITER = 310000;
const te = new TextEncoder(), td = new TextDecoder();
function b64(buf) { const b = new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
const unb64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
async function deriveKey(pw, salt, iter = ITER) {
  const base = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function seal(obj, key, salt) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, te.encode(JSON.stringify(obj)));
  return { app: 'finance', v: 1, kdf: 'PBKDF2-SHA256', iter: ITER, salt: b64(salt), iv: b64(iv), ct: b64(ct), saved: new Date().toISOString() };
}
async function openVault(vault, pw) {
  if (!vault || vault.app !== 'finance' || !vault.ct) throw new Error('Neplatný soubor.');
  const salt = unb64(vault.salt);
  const key = await deriveKey(pw, salt, vault.iter || ITER);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(vault.iv) }, key, unb64(vault.ct));
  return { key, salt, data: JSON.parse(td.decode(pt)) };
}

const DBN = 'finance-app', ST = 'kv', VK = 'vault';
function idbOpen() {
  return new Promise((res, rej) => {
    let r; try { r = indexedDB.open(DBN, 1); } catch (e) { rej(e); return; }
    r.onupgradeneeded = () => r.result.createObjectStore(ST);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function kvGet(k) {
  try {
    const db = await idbOpen();
    const v = await new Promise((res, rej) => { const q = db.transaction(ST, 'readonly').objectStore(ST).get(k); q.onsuccess = () => res(q.result ?? null); q.onerror = () => rej(q.error); });
    if (v) return v;
  } catch (e) { /* zkusíme localStorage */ }
  try { const v = localStorage.getItem('finance:' + k); return v ? JSON.parse(v) : null; } catch (e) { return null; }
}
async function kvSet(k, v) {
  try {
    const db = await idbOpen();
    await new Promise((res, rej) => { const tx = db.transaction(ST, 'readwrite'); tx.objectStore(ST).put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); });
  } catch (e) {
    localStorage.setItem('finance:' + k, JSON.stringify(v));
  }
}
async function kvDel(k) {
  try { const db = await idbOpen(); await new Promise((res, rej) => { const tx = db.transaction(ST, 'readwrite'); tx.objectStore(ST).delete(k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); } catch (e) {}
  try { localStorage.removeItem('finance:' + k); } catch (e) {}
}

let S = null, KEY = null, SALT = null;
let saveTimer = null, saving = Promise.resolve(), dirty = false;
function markDirty() { dirty = true; setSaved('Ukládám…'); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 300); }
function flush() {
  clearTimeout(saveTimer);
  if (!dirty || !S || !KEY) return saving;
  dirty = false;
  const snap = S, key = KEY, salt = SALT;
  saving = saving.then(async () => {
    try { await kvSet(VK, await seal(snap, key, salt)); setSaved('Uloženo'); }
    catch (e) { dirty = true; setSaved('Neuloženo!'); toast('Data se nepodařilo uložit: ' + (e && e.message || e)); }
  });
  return saving;
}
function setSaved(t) { const el = $('#saved'); if (el) el.textContent = t; }

/* ================================================================
   Kategorie a pravidla

function patMatch(text, p) {
  if (!p) return false;
  let i = text.indexOf(p);
  while (i > -1) {
    const before = i === 0 || !/[a-z0-9]/.test(text[i - 1]);
    const after = p.length > 3 || i + p.length >= text.length || !/[a-z0-9]/.test(text[i + p.length]);
    if (before && after) return true;
    i = text.indexOf(p, i + 1);
  }
  return false;
}

function accCore(s) {
  s = String(s || '').toUpperCase().replace(/\s+/g, '');
  if (!s) return '';
  const m = /^CZ\d{2}\d{4}(\d{6})(\d{10})$/.exec(s);

  s = s.split('/')[0];

  if (s.length > 10) s = s.slice(-10);

}

  if (t.cpAcc) {

    if (own && own !== t.acc) return 'prevod';

  for (const r of S.rules) if (catIdx.has(r.cat) && patMatch(text, r.pat)) return r.cat;
  for (const [cat, pats] of COMPILED_DEFAULTS) {
    if (!catIdx.has(cat)) continue;
    const k = kindOf(cat);
    if (k === 'inc' && t.amt <= 0) continue;

}

function pairTransfers() {
  if (S.accounts.length < 2) return;
  const fb = new Set(['ostatni-prijmy', 'ostatni-vydaje', 'prevod']);
  const groups = new Map();
  for (const t of S.tx) {
    if (t.cs === 'm' || !fb.has(t.cat)) continue;
    const k = Math.round(Math.abs(t.amt) * 100);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(t);
  }
  for (const list of groups.values()) {
    const neg = list.filter(t => t.amt < 0), posL = list.filter(t => t.amt > 0);
    const used = new Set();
    for (const n of neg) {
      const dn = dayNum(n.date);
      const m = posL.find(p => !used.has(p) && p.acc !== n.acc && !(p.cat === 'prevod' && n.cat === 'prevod') && Math.abs(dayNum(p.date) - dn) <= 3)
        || posL.find(p => !used.has(p) && p.acc !== n.acc && Math.abs(dayNum(p.date) - dn) <= 3);
      if (m) { used.add(m); n.cat = 'prevod'; m.cat = 'prevod'; }
    }
  }
}

function ymd(y, mo, d) {

function parseAmount(v) {
  if (typeof v === 'number') return v;

  let s = String(v).trim().replace(/[   ]/g, ' ').replace(/[−–]/g, '-');
  if (!s) return NaN;
  s = s.replace(/czk|kč|kc|eur|usd|€|\$/gi, '').replace(/\s+/g, '');
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (s.endsWith('-')) { neg = true; s = s.slice(0, -1); }
  if (s.startsWith('-')) { neg = !neg; s = s.slice(1); }
  if (s.startsWith('+')) s = s.slice(1);
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');

  if (lc > -1 && ld > -1) s = lc > ld ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');

function parseCsv(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim()).slice(0, 30);
  let d = ';', best = -1;
  for (const c of [';', ',', '\t', '|']) {
    const counts = lines.map(l => l.split(c).length - 1).sort((a, b) => a - b);
    const med = counts.length ? counts[Math.floor(counts.length * 0.6)] : 0;
    if (med > best) { best = med; d = c; }
  }
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += ch;
    } else if (ch === '"' && f.trim() === '') { q = true; f = ''; }
    else if (ch === d) { row.push(f); f = ''; }

// --- XLSX bez knihoven: rozbalení ZIPu přes DecompressionStream a čtení XML
async function unzip(buf) {

  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65558); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error('Soubor není platný Excel (.xlsx).');
  const cnt = dv.getUint16(eocd + 10, true); let off = dv.getUint32(eocd + 16, true);
  const files = new Map();
  for (let i = 0; i < cnt; i++) {
    if (dv.getUint32(off, true) !== 0x02014b50) break;
    const method = dv.getUint16(off + 10, true), csize = dv.getUint32(off + 20, true);
    const nlen = dv.getUint16(off + 28, true), xlen = dv.getUint16(off + 30, true), clen = dv.getUint16(off + 32, true);
    const lho = dv.getUint32(off + 42, true);
    const name = td.decode(u8.subarray(off + 46, off + 46 + nlen));
    files.set(name.toLowerCase(), { method, csize, lho });
    off += 46 + nlen + xlen + clen;
  }
  return {
    names: [...files.keys()],
    async read(name) {
      const f = files.get(name.toLowerCase().replace(/^\//, ''));
      if (!f) return null;
      const start = f.lho + 30 + dv.getUint16(f.lho + 26, true) + dv.getUint16(f.lho + 28, true);
      const data = u8.subarray(start, start + f.csize);
      if (f.method === 0) return td.decode(data);
      if (f.method !== 8) throw new Error('Nepodporovaná komprese v souboru.');
      if (typeof DecompressionStream === 'undefined') throw new Error('Tento prohlížeč neumí otevřít .xlsx. Použijte prosím CSV nebo novější prohlížeč.');
      const out = await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
      return td.decode(out);
    }
  };
}

function simulate(p, m, ratePct, years, tax, comp) {
  const r = ratePct / 100 / 12, months = Math.round(Math.min(Math.max(years, 0), 60) * 12);
  let bal = p, dep = p, intNet = 0, pending = 0;
  const rows = [{ y: 0, bal, dep, int: 0 }];
  for (let i = 1; i <= months; i++) {
    bal += m; dep += m;
    const net = bal * r * (tax ? 0.85 : 1);
    if (comp === 'm') { bal += net; intNet += net; }
    else { pending += net; if (i % 12 === 0 || i === months) { bal += pending; intNet += pending; pending = 0; } }
    if (i % 12 === 0 || i === months) rows.push({ y: Math.round(i / 12 * 10) / 10, bal, dep, int: intNet });
  }
  return rows;
}

  const newName = h('input', { class: 'inp', placeholder: 'Název nové kategorie' });
  const newKind = h('select', { class: 'inp' }, opt('exp', 'Výdaj'), opt('inc', 'Příjem'), opt('save', 'Spoření a investice'), opt('transfer', 'Převod (nezapočítává se)'));
  root.append(h('div', { class: 'card' }, h('h2', null, 'Kategorie'), h('p', { class: 'sub' }, '„Spoření a investice“ a „Převody“ se nezapočítávají do výdajů.'),
    h('div', { class: 'stack', style: 'gap:12px' }, ['exp', 'inc', 'save', 'transfer'].map(k => {
      const cs = S.categories.filter(c => c.kind === k); if (!cs.length) return null;
      return h('div', null, h('div', { class: 'small muted', style: 'margin-bottom:6px' }, KIND_LABEL[k]), h('div', { class: 'chips' }, cs.map(c => h('span', { class: 'chip' }, c.name, h('span', { class: 'c' }, nf0.format(counts.get(c.id) || 0)),
        h('button', { title: 'Přejmenovat', 'aria-label': `Přejmenovat ${c.name}`, onclick: async () => { const v = await ask({ title: 'Přejmenovat kategorii', ok: 'Uložit', input: { value: c.name } }); if (v && v.trim()) { c.name = v.trim(); markDirty(); render(); } } }, '✎'),
        PROTECTED.has(c.id) ? null : h('button', { title: 'Smazat', 'aria-label': `Smazat ${c.name}`, onclick: async () => {
          const n = counts.get(c.id) || 0;
          if (await ask({ title: `Smazat kategorii „${c.name}“?`, text: n ? `${pl(n, 'pohyb', 'pohyby', 'pohybů')} se znovu automaticky zařadí (ručně zařazené půjdou do Ostatních).` : 'Kategorie je prázdná.', ok: 'Smazat', danger: true })) {
            S.categories = S.categories.filter(x => x !== c); S.rules = S.rules.filter(r => r.cat !== c.id);
            for (const t of S.tx) if (t.cat === c.id) { t.cs = 'a'; }
            applyCategories(); markDirty(); render();
          } } }, '×')))));
    })),
    h('div', { class: 'row', style: 'margin-top:14px' }, newName, newKind, h('button', { class: 'btn', onclick: () => {
      const nm = newName.value.trim(); if (!nm) { newName.focus(); return; }
      S.categories.push({ id: 'c-' + uid(), name: nm, kind: newKind.value }); markDirty(); render(); toast(`Kategorie „${nm}“ přidána.`);
    } }, 'Přidat kategorii'))));

  // Pravidla
  const rPat = h('input', { class: 'inp', placeholder: 'Text v popisu, např. benzina', style: 'flex:1;min-width:180px' });
  const rCat = h('select', { class: 'inp' }, catOptions());
  root.append(h('div', { class: 'card' }, h('h2', null, 'Pravidla pro kategorie'),
    h('p', { class: 'sub' }, `Vestavěná pravidla poznají ${COMPILED_DEFAULTS.reduce((s, [, p]) => s + p.length, 0)} běžných obchodů a služeb (Albert, Lidl, Shell, Netflix…). Vaše pravidla mají přednost a ručně zařazené platby se nemění.`),
    S.rules.length ? h('table', { class: 't' }, h('tbody', null, S.rules.map(r => {
      const sel = h('select', { class: 'inp', onchange: e => { r.cat = e.target.value; applyCategories(); markDirty(); } }, catOptions()); sel.value = r.cat;
      return h('tr', null, h('td', null, 'obsahuje ', h('b', null, `„${r.pat}“`)), h('td', null, sel), h('td', { class: 'num' }, h('button', { class: 'btn sm danger', onclick: async () => {
        if (await ask({ title: 'Smazat pravidlo?', text: `„${r.pat}“ → ${catName(r.cat)}. Automaticky zařazené platby se přepočítají.`, ok: 'Smazat', danger: true })) { S.rules = S.rules.filter(x => x !== r); applyCategories(); markDirty(); render(); }
      } }, 'Smazat')));
    }))) : h('p', { class: 'muted small' }, 'Zatím nemáte vlastní pravidla. Vznikají i samy, když v transakcích změníte kategorii.'),
    h('div', { class: 'row', style: 'margin-top:12px' }, rPat, rCat, h('button', { class: 'btn', onclick: () => {
      const p = norm(rPat.value); if (p.length < 2) { rPat.focus(); return; }
      S.rules.unshift({ id: uid(), pat: p, cat: rCat.value }); applyCategories(); markDirty(); render(); toast('Pravidlo přidáno a použito na existující platby.');
    } }, 'Přidat pravidlo'),
      h('button', { class: 'btn', onclick: () => { applyCategories(); markDirty(); render(); toast('Automaticky zařazené platby jsou přepočítané.'); } }, 'Znovu zařadit vše'))));

  // Záloha a bezpečnost
  const lockSel = h('select', { class: 'inp', onchange: e => { S.settings.lockMin = +e.target.value; markDirty(); } }, [5, 15, 30, 60].map(m => opt(String(m), `po ${m} minutách nečinnosti`)));
  lockSel.value = String(S.settings.lockMin || 15);
  root.append(h('div', { class: 'grid2' },
    h('div', { class: 'card' }, h('h2', null, 'Záloha'), h('p', { class: 'sub' }, S.lastBackup ? `Poslední záloha ${fmtDate(S.lastBackup.slice(0, 10))}.` : 'Zatím žádná záloha.'),
      h('div', { class: 'info' }, h('p', null, 'Data jsou jen v tomto prohlížeči. Záloha je soubor zašifrovaný vaším heslem. Uložte si ho třeba na OneDrive. Přes zálohu také přenesete data do jiného zařízení.')),
      h('div', { class: 'row' }, h('button', { class: 'btn primary', onclick: downloadBackup }, 'Stáhnout zálohu'), h('button', { class: 'btn', onclick: () => restoreBackup(false) }, 'Obnovit ze zálohy…'))),
    h('div', { class: 'card' }, h('h2', null, 'Zabezpečení'), h('p', { class: 'sub' }, 'Aplikace se sama zamkne:'),
      h('div', { class: 'row' }, lockSel),
      h('div', { class: 'row', style: 'margin-top:12px' }, h('button', { class: 'btn', onclick: async () => {
        const pw = await ask({ title: 'Změnit heslo', text: 'Nové heslo, alespoň 8 znaků. Starší zálohy zůstanou na starém hesle.', ok: 'Změnit heslo', input: { type: 'password', placeholder: 'Nové heslo', min: 8, confirm: true } });
        if (!pw) return;
        SALT = crypto.getRandomValues(new Uint8Array(16)); KEY = await deriveKey(pw, SALT); dirty = true; await flush(); toast('Heslo změněno.');
      } }, 'Změnit heslo'), h('button', { class: 'btn', onclick: lock }, 'Zamknout nyní')))));

  root.append(h('div', { class: 'card info' }, h('h2', null, 'Jak je aplikace zabezpečená'), h('div', { style: 'height:8px' }),
    h('p', null, 'Do banky nemá žádný přístup. Nezná přihlašovací údaje a nemůže zadat platbu. Pracuje jen s výpisy, které sem sami nahrajete.'),
    h('p', null, 'Nemá povolené žádné síťové spojení (Content-Security-Policy connect-src \'none\'), takže data nemůže nikam odeslat. Nenačítá žádné cizí skripty.'),
    h('p', null, 'Data jsou uložená jen v tomto prohlížeči a zašifrovaná algoritmem AES-256-GCM. Klíč se odvozuje z hesla (PBKDF2-SHA256, 310 000 iterací) a nikde se neukládá.'),
    h('p', null, 'Smazáním dat prohlížeče (cookies a dat webů) o data přijdete. Proto si stahujte zálohu.')));

  root.append(h('div', { class: 'card' }, h('h2', null, 'Smazat všechna data'), h('p', { class: 'sub' }, 'Odstraní z tohoto prohlížeče všechny účty, transakce a nastavení. V bance se nic nemění.'),
    h('button', { class: 'btn danger', onclick: async () => {
      if (await ask({ title: 'Smazat všechna data?', text: `Z tohoto prohlížeče se odstraní ${pl(S.accounts.length, 'účet', 'účty', 'účtů')} a ${pl(S.tx.length, 'transakce', 'transakce', 'transakcí')}. Bez zálohy je nepůjde obnovit.`, ok: 'Smazat vše', danger: true, typed: 'SMAZAT' })) {
        clearTimeout(saveTimer); dirty = false; await saving; await kvDel(VK); renderLock(false); toast('Data smazána.');
      } } }, 'Smazat všechna data…')));
  return root;
}

/* ================================================================
   Start
   ================================================================ */
async function boot() {
  if (!window.crypto || !crypto.subtle) {
    app.replaceChildren(h('div', { class: 'lock' }, h('div', { class: 'card lock-card' }, h('h2', null, 'Prohlížeč nepodporuje šifrování'), h('p', { class: 'sub' }, 'Otevřete stránku přes https (např. GitHub Pages) v aktuálním prohlížeči.'))));
    return;
  }
  renderLock(!!(await kvGet(VK)));
}
boot();
})();
</script>
</body>
</html>
