<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Finanční řízení podnikových inovací</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Layout: záložky podle tématu, nad nimi výběr příkladu; vlevo zadání a čísla k úpravě, vpravo výsledek, tabulky a vyplněné vzorce */
:root {
  --bg: #f3f5f9;
  --surface: #ffffff;
  --surface-2: #eaeef6;
  --fg: #14213d;
  --muted: #5a6788;
  --line: #d5dbe8;
  --accent: #1b3f8f;
  --accent-fg: #ffffff;
  --interest: #c0701a;
  --good: #1f7a4d;
  --bad: #b3261e;
  --c-pv: #1b3f8f;
  --c-i: #b0306a;
  --c-n: #0f7a74;
  --c-a: #7a4bb8;
  --c-u: #c0701a;
  --font-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1424; --surface: #151d33; --surface-2: #1d2744; --fg: #e6ebf7; --muted: #9aa7c7;
    --line: #2a3556; --accent: #7fa2f0; --accent-fg: #0e1424; --interest: #e0963f; --good: #5fcf98; --bad: #f08a83;
    --c-pv: #7fa2f0; --c-i: #f08ab5; --c-n: #4fd1c5; --c-a: #b79af0; --c-u: #e0963f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1424; --surface: #151d33; --surface-2: #1d2744; --fg: #e6ebf7; --muted: #9aa7c7;
  --line: #2a3556; --accent: #7fa2f0; --accent-fg: #0e1424; --interest: #e0963f; --good: #5fcf98; --bad: #f08a83;
  --c-pv: #7fa2f0; --c-i: #f08ab5; --c-n: #4fd1c5; --c-a: #b79af0; --c-u: #e0963f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; padding-inline: 16px; padding-block: 24px 40px; }
.wrap { max-width: 1160px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }
header h1 { font-size: 1.7rem; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.01em; text-wrap: balance; }
header p { margin: 0; color: var(--muted); max-width: 70ch; }

/* záložky témat */
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
.tabs button { flex: none; background: transparent; color: var(--muted); border: 0; border-bottom: 3px solid transparent; border-radius: 0; padding: 10px 14px 9px; font-weight: 600; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tabs button:hover { filter: none; color: var(--fg); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 99px; padding: 5px 13px; font-weight: 500; font-size: 0.88rem; }
.chips button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

.grid { display: grid; grid-template-columns: minmax(0, 330px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel h2 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 600; margin: 0; }
@media (min-width: 861px) { #side { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto; } }
.src { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.extitle { margin: 2px 0 0; font-size: 1.2rem; line-height: 1.25; text-wrap: balance; }
.assign { margin: 0; font-size: 0.92rem; color: var(--muted); }
.note { margin: 0; font-size: 0.82rem; color: var(--interest); }
#form { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-weight: 600; font-size: 0.88rem; }
.input-row { display: flex; align-items: stretch; }
.input-row input { flex: 1; min-width: 0; border-radius: 4px 0 0 4px; }
.input-row .unit { background: var(--surface-2); border: 1px solid var(--line); border-left: 0; border-radius: 0 4px 4px 0; padding: 0 10px; display: flex; align-items: center; color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
input[type="number"], select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; width: 100%; font-variant-numeric: tabular-nums; }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 0.9rem; }
.check input { margin-top: 3px; accent-color: var(--accent); }
button { font: inherit; font-weight: 600; cursor: pointer; border-radius: 4px; padding: 8px 12px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); }
button.ghost { background: transparent; color: var(--accent); }
button:hover { filter: brightness(1.08); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.results { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.heads { display: flex; flex-wrap: wrap; gap: 10px 36px; }
.head { display: flex; flex-direction: column; min-width: 0; }
.head .big { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; color: var(--accent); line-height: 1.15; overflow-wrap: anywhere; }
.head .lbl { color: var(--muted); font-size: 0.88rem; }
.verdict { margin: 0; font-weight: 600; max-width: 70ch; }
dl.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px 20px; margin: 0; }
dl.facts div { border-top: 1px solid var(--line); padding-top: 8px; min-width: 0; }
dl.facts dt { font-size: 0.78rem; color: var(--muted); }
dl.facts dd { margin: 2px 0 0; font-weight: 600; font-size: 1.05rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.status { display: inline-block; font-size: 0.8rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; border: 1px solid currentColor; }
.status.ok { color: var(--good); }
.status.warn { color: var(--bad); }
.chart-wrap { overflow-x: auto; }
svg.chart { width: 100%; height: auto; display: block; min-width: 420px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.85rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; }
.table-wrap.tall { max-height: 460px; overflow-y: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 0.9rem; }
th, td { padding: 8px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; }
thead th { position: sticky; top: 0; background: var(--surface-2); font-size: 0.78rem; font-weight: 600; color: var(--muted); z-index: 1; }
tfoot td { font-weight: 700; background: var(--surface-2); border-bottom: 0; }
tr.adjusted td.pay { color: var(--interest); font-weight: 600; }
table.amort tbody tr { cursor: pointer; }
tbody tr.sel td { background: var(--surface-2); }
.hint { color: var(--muted); font-size: 0.8rem; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.prow { display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--line); padding-top: 10px; min-width: 0; }
.prow .lbl { font-size: 0.8rem; color: var(--muted); }
#periodMath { display: flex; flex-direction: column; gap: 10px; }
.formulas { display: flex; flex-direction: column; gap: 10px; }
.formulas .row { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.formulas .row span { font-size: 0.8rem; color: var(--muted); }
code { font-family: var(--font-mono); font-size: 0.85rem; background: var(--surface-2); padding: 6px 8px; border-radius: 4px; display: block; overflow-x: auto; white-space: nowrap; }
.err { color: var(--bad); font-weight: 600; }

/* vyplněné vzorce */
.v-pv { color: var(--c-pv); } .v-i { color: var(--c-i); } .v-n { color: var(--c-n); } .v-a { color: var(--c-a); } .v-u { color: var(--c-u); }
math { font-family: "Latin Modern Math", "STIX Two Math", "Cambria Math", "Noto Sans Math", math, serif; font-size: 1.2rem; math-style: normal; }
.eq { overflow-x: auto; overflow-y: hidden; padding-block: 3px; }
.eq.res math { font-size: 1.3rem; }
.step { display: grid; grid-template-columns: minmax(0, 210px) minmax(0, 1fr); gap: 6px 24px; padding-top: 16px; border-top: 1px solid var(--line); }
@media (max-width: 860px) { .step { grid-template-columns: minmax(0, 1fr); } }
.step h3 { margin: 0; font-size: 0.95rem; }
.step .no { display: block; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 2px; font-weight: 600; }
.step p { margin: 4px 0 0; color: var(--muted); font-size: 0.85rem; }
.step .eqs { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.steps { display: flex; flex-direction: column; gap: 16px; }
.symbols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px 20px; }
.sym-item { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.sym { font-family: "Latin Modern Math", "STIX Two Text", "Cambria Math", Georgia, serif; font-style: italic; font-size: 1.15rem; min-width: 2.6rem; font-weight: 600; }
.sym-item .what { color: var(--muted); font-size: 0.85rem; }
/* přehled vzorců */
.guide { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 8px 16px; }
.guide button { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; font-weight: 500; }
.guide button b { color: var(--accent); font-size: 0.88rem; }
.fhead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.badge { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.fform { display: flex; flex-direction: column; gap: 2px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.fform .flbl { font-size: 0.78rem; color: var(--muted); margin-top: 6px; }
.fform math { font-size: 1.45rem; }
.fcols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .fcols { grid-template-columns: minmax(0, 1fr); } }
.fexp { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.fexp p { margin: 0; max-width: 65ch; }
.used { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.82rem; color: var(--muted); }
.used button { background: var(--bg); color: var(--accent); border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; font-weight: 600; font-size: 0.8rem; }
.fcalc { display: flex; flex-direction: column; gap: 12px; min-width: 0; border: 1px solid var(--line); border-radius: 6px; padding: 14px; background: var(--bg); }
.fcalc h4 { margin: 0; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 600; }
.fin { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.fres { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.fres .head .big { font-size: 1.6rem; }
svg.spark { width: 100%; max-width: 440px; height: auto; display: block; }
@media (prefers-reduced-motion: no-preference) { button { transition: filter .15s, color .15s; } }
</style>

<div class="wrap">
  <header>
    <h1>Finanční řízení podnikových inovací</h1>
    <p>Časová hodnota peněz: všechny příklady z cvičení 1 a z přednášky a přehled vzorců. U každého příkladu můžete měnit čísla a sledovat vyplněné vzorce.</p>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Témata"></nav>
  <div class="chips" id="chips" aria-label="Příklady"></div>

  <div class="grid" id="mainGrid">
    <div class="panel" id="side"></div>
    <div class="results" id="out" aria-live="polite"></div>
  </div>
  <div class="results" id="ref" hidden></div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- formátování ---------- */
  function nf(x, d) { return new Intl.NumberFormat('cs-CZ', { minimumFractionDigits: 0, maximumFractionDigits: d == null ? 2 : d }).format(x); }
  function fmt(x, cents) { return new Intl.NumberFormat('cs-CZ', { minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0 }).format(x); }
  function kc(x, cents) { return fmt(x, cents) + ' Kč'; }
  function mv(x) { return Math.abs(x - Math.round(x)) < 0.005 ? fmt(x, false) : fmt(x, true); }
  function pcs(x, d) { return nf(x * 100, d == null ? 4 : d) + ' %'; }
  function xl(x) { return String(+Number(x).toPrecision(12)).replace('.', ','); }

  /* ---------- MathML ---------- */
  var M = {
    i: function (t, c) { return '<mi' + (c ? ' class="' + c + '"' : '') + '>' + t + '</mi>'; },
    n: function (t, c) { return '<mn' + (c ? ' class="' + c + '"' : '') + '>' + t + '</mn>'; },
    o: function (t) { return '<mo>' + t + '</mo>'; },
    t: function (t) { return '<mtext>' + t + '</mtext>'; },
    r: function () { return '<mrow>' + Array.prototype.join.call(arguments, '') + '</mrow>'; },
    sub: function (a, b) { return '<msub>' + a + '<mrow>' + b + '</mrow></msub>'; },
    sup: function (a, b) { return '<msup>' + a + '<mrow>' + b + '</mrow></msup>'; },
    frac: function (a, b) { return '<mfrac><mrow>' + a + '</mrow><mrow>' + b + '</mrow></mfrac>'; },
    par: function (x) { return '<mrow><mo>(</mo>' + x + '<mo>)</mo></mrow>'; },
    sum: function (lo, hi) { return '<munderover><mo>∑</mo><mrow>' + lo + '</mrow><mrow>' + hi + '</mrow></munderover>'; },
    line: function (x, cls) { return '<div class="eq ' + (cls || '') + '"><math>' + x + '</math></div>'; }
  };
  var E = M.line, mr = M.r;
  var EQ = M.o('='), DOT = M.o('⋅'), PLUS = M.o('+'), MINUS = M.o('−'), KC = M.t(' Kč'), ONE = M.n(1);
  var sPV = M.i('PV', 'v-pv'), sFV = M.i('FV', 'v-pv'), sI = M.i('i', 'v-i'), sNn = M.i('n', 'v-n'), sM = M.i('M', 'v-n'), sA = M.i('A', 'v-a'), sT = M.i('t');
  function R(name) { return M.i(name, 'v-i'); }
  function mnr(x, c, d) { return M.n(nf(x, d == null ? 8 : d), c); }
  function mnv(x, c) { return M.n(mv(x), c); }
  function mn2(x, c) { return M.n(fmt(x, true), c); }
  function mnp(x, c, d) { return M.n(pcs(x, d), c); }
  function onePlus(x) { return M.par(mr(ONE, PLUS, x)); }

  /* ---------- pomocné stavební prvky ---------- */
  function Steps() {
    var no = 0, h = '';
    return {
      add: function (title, note, lines) {
        h += '<div class="step"><div><span class="no">Krok ' + (++no) + '</span><h3>' + title + '</h3>' + (note ? '<p>' + note + '</p>' : '') + '</div><div class="eqs">' + lines.join('') + '</div></div>';
      },
      html: function () { return h; }
    };
  }
  function panel(title, body) { return '<section class="panel"><h2>' + title + '</h2>' + body + '</section>'; }
  function table(cols, rows, foot) {
    return '<div class="table-wrap"><table><thead><tr>' + cols.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody>' +
      (foot ? '<tfoot><tr>' + foot.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr></tfoot>' : '') + '</table></div>';
  }
  function eff(nom, m) { return Math.pow(1 + nom / m, m) - 1; }

  function taxStep(st, hum, t) {
    var cum = hum * (1 - t);
    st.add('Čistá úroková míra po zdanění', 'Je zadaná sazba daně, proto se počítá s čistou úrokovou mírou.', [
      E(mr(R('ČÚM'), EQ, R('HÚM'), DOT, M.par(mr(ONE, MINUS, sT)))),
      E(mr(EQ, mnr(hum, 'v-i'), DOT, M.par(mr(ONE, MINUS, mnr(t))))),
      E(mr(EQ, mnp(cum, 'v-i', 4)), 'res')
    ]);
    return cum;
  }
  function growthTable(pv, i, n) {
    var rows = [], open = pv;
    for (var k = 1; k <= n; k++) {
      var u = open * i, close = open + u;
      rows.push([k, fmt(open, true), fmt(u, true), fmt(close, true)]);
      open = close;
    }
    return table(['Rok', 'Počátek roku', 'Čistý úrok', 'Konec roku'], rows);
  }

  /* ---------- amortizační schéma ---------- */
  function amortCompute(p) {
    var i = p.rate / 100 / p.m;
    var N = Math.round(p.years * p.m);
    var A = i === 0 ? p.pv / N : p.pv * i / (1 - Math.pow(1 + i, -N));
    var pay = A;
    if (p.step > 0) {
      var q = A / p.step;
      var k = p.mode === 'up' ? Math.ceil(q - 1e-9) : p.mode === 'down' ? Math.floor(q + 1e-9) : Math.round(q);
      pay = k * p.step;
    }
    var rows = [], open = p.pv, totalPay = 0, totalInt = 0;
    for (var t = 1; t <= N; t++) {
      var interest = open * i;
      var due = open + interest;
      var payment = Math.min(pay, due);
      if (t === N && p.adjust) { payment = due; }
      var adjusted = Math.abs(payment - pay) > 1e-9;
      var principal = payment - interest;
      var close = open - principal;
      if (Math.abs(close) < 1e-6) close = 0;
      rows.push({ t: t, open: open, interest: interest, payment: payment, principal: principal, close: close, adjusted: adjusted });
      totalPay += payment; totalInt += interest;
      open = close;
    }
    return { i: i, N: N, A: A, pay: pay, rows: rows, totalPay: totalPay, totalInt: totalInt, end: open };
  }
  function niceMax(v) {
    if (v <= 0) return 1;
    var e = Math.pow(10, Math.floor(Math.log10(v))), f = v / e;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e;
  }
  function shortNum(v) {
    if (v >= 1e6) return nf(+(v / 1e6).toFixed(2), 2) + ' mil.';
    if (v >= 1e3) return nf(+(v / 1e3).toFixed(1), 1) + ' tis.';
    return String(v);
  }
  function chartSvg(r) {
    var W = 720, H = 300, L = 66, Rr = 10, T = 12, B = 34, pw = W - L - Rr, ph = H - T - B, maxV = 0, out = '';
    r.rows.forEach(function (x) { maxV = Math.max(maxV, x.payment); });
    var top = niceMax(maxV * 1.02);
    for (var k = 0; k <= 4; k++) {
      var v = top * k / 4, y = T + ph - ph * k / 4;
      out += '<line x1="' + L + '" x2="' + (W - Rr) + '" y1="' + y + '" y2="' + y + '" stroke="var(--line)" stroke-width="1"/>';
      out += '<text x="' + (L - 8) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--font-body)">' + shortNum(v) + '</text>';
    }
    var n = r.rows.length, slot = pw / n, bw = Math.max(1, Math.min(56, slot * 0.62)), every = Math.max(1, Math.ceil(n / 12));
    r.rows.forEach(function (x, idx) {
      var cx = L + slot * idx + slot / 2, x0 = cx - bw / 2;
      var hp = Math.max(0, x.principal) / top * ph, hi = Math.max(0, x.interest) / top * ph, yp = T + ph - hp, yi = yp - hi;

    $('chips').innerHTML = list.length > 1 ? list.map(function (e) {
      return '<button type="button" data-ex="' + e.id + '" aria-pressed="' + (state.ex[state.tab] === e.id) + '">' + e.short + '</button>';
    }).join('') : '';
  }

  function fieldHtml(p, val) {
    var id = 'p_' + p.k;
    if (p.type === 'check') return '<label class="check"><input type="checkbox" id="' + id + '"' + (val ? ' checked' : '') + '><span>' + p.label + '</span></label>';
    if (p.type === 'select') {
      return '<div class="field"><label for="' + id + '">' + p.label + '</label><select id="' + id + '">' + p.opts.map(function (o) {
        return '<option value="' + o[0] + '"' + (String(o[0]) === String(val) ? ' selected' : '') + '>' + o[1] + '</option>';
      }).join('') + '</select></div>';
    }
    return '<div class="field"><label for="' + id + '">' + p.label + '</label><div class="input-row"><input type="number" id="' + id + '" value="' + val + '" step="' + (p.step || 'any') + '" inputmode="decimal">' + (p.unit ? '<span class="unit">' + p.unit + '</span>' : '') + '</div></div>';
  }

  function renderSide() {
    var ex = cur;
    var vals = state.vals[ex.id] || (state.vals[ex.id] = defaults(ex));
    $('side').innerHTML = '<div><span class="src">' + ex.src + '</span><h3 class="extitle">' + ex.title + '</h3></div>' +
      '<p class="assign">' + ex.text + '</p>' + (ex.note ? '<p class="note">' + ex.note + '</p>' : '') +
      '<form id="form" autocomplete="off">' + ex.params.map(function (p) { return fieldHtml(p, vals[p.k]); }).join('') + '</form>' +
      '<div class="btns"><button type="button" id="reset" class="ghost">Vrátit zadání z příkladu</button></div>';
  }

  function readVals() {
    var v = {};
    cur.params.forEach(function (p) {
      var el = $('p_' + p.k);
      if (!el) { v[p.k] = p.def; return; }
      if (p.type === 'check') v[p.k] = el.checked;
      else if (p.type === 'select' && p.str) v[p.k] = el.value;
      else v[p.k] = parseFloat(el.value);
    });
    return v;
  }
  function validate(params, v) {
    for (var k = 0; k < params.length; k++) {
      var p = params[k];
      if (p.type === 'check' || (p.type === 'select' && p.str)) continue;
      var x = v[p.k];
      if (!isFinite(x)) return 'Vyplňte pole „' + p.label + '“ číslem.';
      if (p.pos && !(x > 0)) return 'Pole „' + p.label + '“ musí být větší než nula.';
      if (p.min != null && x < p.min) return 'Pole „' + p.label + '“ nesmí být menší než ' + nf(p.min, 2) + '.';
      if (p.max != null && x > p.max) return 'Pole „' + p.label + '“ nesmí být větší než ' + nf(p.max, 2) + '.';
    }
    return null;
  }

  function update() {
    var v = readVals();
    var err = validate(cur.params, v), res = null;
    if (!err) state.vals[cur.id] = v;
    if (!err) { try { res = cur.run(v); } catch (e) { err = 'Výpočet se nepodařil. Zkontrolujte zadané hodnoty.'; } }
    if (!err && cur.amortic && res.amort && res.amort.r.N > 600) err = 'Pro přehlednost je nejvyšší počet plateb 600.';
    if (err) { $('out').innerHTML = panel('Výsledek', '<div class="err">' + err + '</div>'); cur.res = null; return; }
    if (cur.amortic) tSel = Math.min(Math.max(1, tSel), res.amort.r.N);
    cur.res = res;
    var h = '<section class="panel"><h2>Výsledek</h2><div class="heads">' + res.heads.map(function (x) { return '<div class="head"><span class="big">' + x.v + '</span><span class="lbl">' + x.l + '</span></div>'; }).join('') + '</div>' +
      (res.verdict ? '<p class="verdict">' + res.verdict + '</p>' : '') +
      '<dl class="facts">' + res.facts.map(function (f) { return '<div><dt>' + f[0] + '</dt><dd>' + f[1] + '</dd></div>'; }).join('') + '</dl></section>';
    if (cur.amortic) {
      // amortizační příklady mají vlastní pořadí: graf, tabulka, rozbor období
      h += res.extra;
    } else if (res.extra) { h += res.extra; }
    var leg = (res.legend || cur.legend || []).map(function (x) { return '<div class="sym-item"><span class="sym ' + x[0] + '">' + x[1] + '</span><span class="what">' + x[2] + '</span></div>'; }).join('');
    h += panel('Vyplněné vzorce', '<div class="symbols">' + leg + '</div><div class="steps">' + res.steps + '</div>');
    h += panel('Vzorce pro Excel', '<div class="formulas">' + res.excel.map(function (f) { return '<div class="row"><span>' + f[0] + '</span><code>' + f[1] + '</code></div>'; }).join('') + '</div><span class="hint">Zápis pro český Excel (desetinná čárka, středník).</span>');
    $('out').innerHTML = h;
  }

  function setPeriod(t) {
    if (!cur || !cur.res || !cur.res.amort) return;
    var r = cur.res.amort.r;
    tSel = Math.min(Math.max(1, t), r.N);
    var pm = $('periodMath'); if (pm) pm.innerHTML = periodHtml(r, tSel);
    var tv = $('tval'); if (tv) tv.textContent = tSel + ' z ' + r.N;
    var s = $('tsel'); if (s) s.value = tSel;
    var rows = $('out').querySelectorAll('tr[data-t]');
    for (var k = 0; k < rows.length; k++) rows[k].classList.toggle('sel', parseInt(rows[k].getAttribute('data-t'), 10) === tSel);
  }

  function select(tab, id) {
    state.tab = tab;
    if (tab === 'ref') { showView(true); renderTabs(); renderRef(); return; }
    showView(false);
    state.ex[tab] = id; cur = exById(id); tSel = 1;
    renderTabs(); renderSide(); update();
  }

  $('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]');
    if (b) select(b.getAttribute('data-tab'), state.ex[b.getAttribute('data-tab')]);
  });
  $('chips').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-ex]');
    if (b) select(state.tab, b.getAttribute('data-ex'));
  });
  $('side').addEventListener('input', function (e) { if (e.target.closest('#form')) update(); });
  $('side').addEventListener('change', function (e) { if (e.target.closest('#form')) update(); });
  $('side').addEventListener('submit', function (e) { e.preventDefault(); });
  $('side').addEventListener('click', function (e) {
    if (e.target.id === 'reset') { delete state.vals[cur.id]; renderSide(); update(); }
  });
  $('out').addEventListener('input', function (e) { if (e.target.id === 'tsel') setPeriod(parseInt(e.target.value, 10)); });
  $('out').addEventListener('click', function (e) {
    var tr = e.target.closest('tr[data-t]');
    if (tr) setPeriod(parseInt(tr.getAttribute('data-t'), 10));
  });

  $('ref').addEventListener('input', function (e) {
    var card = e.target.closest('.fcard');
    if (!card) return;
    var f = fById(card.getAttribute('data-f')), v = readCard(f, card);
    if (validate(f.params, v) === null) state.fvals[f.id] = v;
    card.querySelector('.fres').innerHTML = fresHtml(f, v);
  });
  $('ref').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.hasAttribute('data-goto')) {
      var id = b.getAttribute('data-goto');
      select(exById(id).tab, id);
      $('tabs').scrollIntoView();
    } else if (b.hasAttribute('data-scroll')) {
      var f = fById(b.getAttribute('data-scroll'));
      if (state.rg !== 'all' && state.rg !== f.group) { state.rg = 'all'; renderRef(); }
      var el = $('fc_' + f.id);
      if (el) el.scrollIntoView();
    } else if (b.hasAttribute('data-rg')) {
      state.rg = b.getAttribute('data-rg'); renderRef();
    }
  });

  window.__EX = EX; window.__FS = FS; window.__api = { exById: exById, defaults: defaults, fresHtml: fresHtml, renderRef: renderRef, select: select };
  select('miry', 'a1');
})();
</script>

</body></html>
