<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1e1d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="./zpevnik-icons/zpevnik-180.png">

<style>
:root{
  --bg:#faf9f5;--card:#fff;--card2:#f0eee6;--line:#e8e6dc;--line2:#d1cfc5;
  --ink:#141413;--ink2:#3d3d3a;--mute:#87867f;
  --acc:#c6613f;--acc2:#d97757;--acc-ink:#fff;--acc-soft:rgba(217,119,87,.13);--bad:#b53333;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;--sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);--fs:17px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1f1e1d;--card:#262624;--card2:#30302e;--line:#35342f;--line2:#4a4945;
  --ink:#faf9f5;--ink2:#c2c0b6;--mute:#9c9a92;
  --acc:#e08a6b;--acc2:#d97757;--acc-ink:#1f1e1d;--acc-soft:rgba(217,119,87,.16);--bad:#e87b7b;
}}
:root[data-theme="dark"]{
  --bg:#1f1e1d;--card:#262624;--card2:#30302e;--line:#35342f;--line2:#4a4945;
  --ink:#faf9f5;--ink2:#c2c0b6;--mute:#9c9a92;
  --acc:#e08a6b;--acc2:#d97757;--acc-ink:#1f1e1d;--acc-soft:rgba(217,119,87,.16);--bad:#e87b7b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;min-height:100dvh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
input,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;outline:none;width:100%;min-width:0}
input:focus,textarea:focus{border-color:var(--acc2);box-shadow:0 0 0 3px var(--acc-soft)}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
a{color:var(--acc);text-decoration:none}
.i{flex:none;display:block}
[hidden]{display:none!important}

.app{max-width:680px;margin:0 auto;padding:0 18px calc(env(safe-area-inset-bottom) + 110px)}
header.top{display:flex;align-items:center;gap:2px;padding:calc(env(safe-area-inset-top) + 10px) 0 6px;margin:0 -9px;min-height:54px}
header.top .sp{flex:1}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--ink2);position:relative}
.ib:hover{background:var(--card2)}
.ib.on{color:var(--acc)}
.ib .dot{position:absolute;top:8px;right:7px;width:7px;height:7px;border-radius:50%;border:1.5px solid var(--bg);background:var(--mute)}
.dot.ok{background:#5a9a6a}.dot.pend{background:#d9a441}.dot.err{background:var(--bad)}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,8.5vw,40px);line-height:1.08;letter-spacing:-.015em;text-wrap:balance}
.sub{color:var(--mute);font-size:14px;margin-top:6px}
.sub a{color:inherit;border-bottom:1px solid var(--line2)}

.search{position:relative;margin:18px 0 14px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
.search input{padding-left:40px;height:46px;border-radius:12px;background:var(--card)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:4px}
.tabs a{padding:10px 0 9px;color:var(--mute);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--ink);border-color:var(--acc2)}
.tabs .sp{flex:1}
.chip{align-self:center;font-size:12.5px;color:var(--mute);border:1px solid var(--line2);border-radius:99px;padding:4px 11px}
.chip.on{color:var(--acc);border-color:var(--acc2);background:var(--acc-soft)}

.row{display:flex;align-items:baseline;gap:10px;padding:13px 2px;border-bottom:1px solid var(--line);color:var(--ink);min-height:48px}
.row .rt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rs{color:var(--mute);font-size:13px;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .cnt{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.row.big .rt{font-family:var(--serif);font-size:20px}
.row.no .rt{color:var(--mute)}
.row.no .rt::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;border:1.3px solid var(--line2);margin-left:8px;vertical-align:middle}
.row:hover .rt{color:var(--acc)}
.letter{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600;padding:22px 2px 6px}
.empty{color:var(--mute);padding:26px 2px;font-size:14.5px;line-height:1.55}
.intro{background:var(--card2);border-radius:14px;padding:14px 16px;font-size:14px;color:var(--ink2);margin:6px 0 10px;display:flex;gap:10px;align-items:flex-start;line-height:1.5}
.intro p{flex:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--line2);font-weight:500;font-size:14.5px;white-space:nowrap;color:var(--ink);background:var(--card);transition:transform .12s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.p{background:var(--acc2);border-color:var(--acc2);color:#fff;font-weight:600}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:9px}
.btn.wide{width:100%}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:none;color:var(--mute)}
.fab{position:fixed;right:max(18px,calc(50vw - 322px));bottom:calc(env(safe-area-inset-bottom) + 20px);height:52px;padding:0 20px 0 16px;border-radius:99px;background:var(--acc2);color:#fff;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(120,60,30,.28);z-index:5}
.fab:active{transform:scale(.96)}

/* píseň */
.song-h{margin:6px 0 18px}
.song-h h1{font-size:clamp(28px,8vw,38px)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips a{font-size:12.5px;color:var(--ink2);background:var(--card2);border-radius:99px;padding:3px 10px}
.notec{display:block;width:100%;text-align:left;background:var(--acc-soft);border-left:3px solid var(--acc2);border-radius:0 10px 10px 0;padding:10px 14px;margin:0 0 18px;font-size:14.5px;color:var(--ink2);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.song{font-size:var(--fs);line-height:1.38;padding-bottom:20px}
.ln{white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.38em}
.ln.cl{display:flex;flex-wrap:wrap;align-items:flex-end;padding-top:.22em}
.wd{display:inline-flex;align-items:flex-end;max-width:100%}
.sg{display:inline-flex;flex-direction:column;justify-content:flex-end;max-width:100%;min-width:0}
.sg b{color:var(--acc);font-weight:650;font-size:.9em;line-height:1.2;padding-right:.42em;white-space:pre}
.sg span{white-space:pre-wrap}
.lb{font-style:normal;font-weight:650;color:var(--ink)}
.gap{height:.85em}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;gap:8px;z-index:5;max-width:calc(100vw - 20px)}
.grp{display:flex;align-items:center;background:var(--card);border:1px solid var(--line2);border-radius:99px;box-shadow:0 6px 22px rgba(20,20,19,.12);padding:3px}
.grp button{min-width:44px;height:42px;border-radius:99px;font-weight:600;font-size:16px;display:grid;place-items:center;color:var(--ink)}
.grp button:active{background:var(--card2)}
.grp .val{min-width:58px;font-size:13px;color:var(--mute);font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.grp .val b{display:block;font-size:15px;color:var(--ink);font-weight:600}
.grp .val.set b{color:var(--acc)}
.nosong{border:1px dashed var(--line2);border-radius:16px;padding:22px 18px;margin-top:8px}
.web{margin-top:28px;border-top:1px solid var(--line)}
.web summary{list-style:none;cursor:pointer;color:var(--mute);font-size:13.5px;padding:14px 2px;display:flex;align-items:center;gap:8px}
.web summary::-webkit-details-marker{display:none}
.web[open] summary{color:var(--ink2)}
.pv{flex:1;min-height:200px;overflow:auto;border:1px solid var(--line2);border-radius:10px;padding:12px 14px;background:var(--card);--fs:15px}
.nosong p{color:var(--ink2);line-height:1.55}
.nosong h2,.sheet h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600;margin:22px 0 8px}
.nosong .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.links{display:grid;gap:0}
.links a{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line);color:var(--ink)}
.links a:last-child{border-bottom:0}
.links a span{flex:1}
.links a svg{color:var(--mute)}

/* okna */
.shade{position:fixed;inset:0;background:rgba(20,20,19,.42);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 20px);animation:up .28s var(--ease)}
.sheet.full{height:96dvh;max-height:96dvh;display:flex;flex-direction:column}
.sheet-h{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.sheet-h b{flex:1;font-family:var(--serif);font-weight:400;font-size:24px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet form{display:grid;gap:12px}
.sheet.full form{flex:1;min-height:0;display:flex;flex-direction:column}
.sheet label.f{display:grid;gap:5px;font-size:12px;color:var(--mute);font-weight:500;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet textarea{min-height:120px;line-height:1.5;resize:none}
.sheet textarea.code{font-family:var(--mono);font-size:16px;white-space:pre;overflow:auto;min-height:200px;flex:1;line-height:1.4;tab-size:4}
@media (hover:hover){.sheet textarea.code{font-size:14px}}
.hint{font-size:12.5px;color:var(--mute);line-height:1.5}
.ferr{color:var(--bad);font-size:13.5px;min-height:0}.ferr:empty{display:none}
.sheet-b{display:flex;gap:8px;margin-top:4px}.sheet-b .p{flex:1}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--acc2);flex:none}
.inl{display:flex;gap:8px;margin-top:14px}.inl input{flex:1}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card2);border-radius:11px;padding:3px}
.seg button{height:38px;border-radius:9px;font-size:14px;color:var(--mute);font-weight:500}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(20,20,19,.12)}
.kv{font-size:14px;color:var(--ink2);line-height:1.55;margin-bottom:10px}
.prog{font-size:13px;color:var(--acc);display:flex;align-items:center;gap:10px}
.prog i{flex:1;height:4px;border-radius:9px;background:var(--line);overflow:hidden;display:block}
.prog i::after{content:"";display:block;height:100%;width:calc(var(--p,0)*100%);background:var(--acc2);transition:width .3s}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13.5px;z-index:60;animation:fade .25s;max-width:calc(100vw - 32px);text-align:center}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{header.top,.bar,.fab,.notec,.web{display:none!important}.app{max-width:none;padding:0}body{background:#fff}}
</style>
</head>
