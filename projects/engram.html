/* ---------- knihovna balíčků (soubory v repu na GitHubu) ---------- */
// Obsah karet je v projects/engram-decks/ (index.json + jeden soubor na balíček), průběh učení zůstává v zařízení.
// Balíček přidaný z knihovny má d.lib = {id, ver, seen, synced}; jeho poznámky n.lib (id karty) a n.libH (otisk obsahu).
const LIB_SRC=['https://raw.githubusercontent.com/Vladaczech/vladaweb/main/projects/engram-decks/','./engram-decks/'];
async function libGet(file){
  for(const base of LIB_SRC){try{const r=await fetch(base+file+'?_='+Date.now(),{cache:'no-store'});if(r.ok)return await r.json()}catch(e){}}
  throw new Error('Knihovna není dostupná');
}
function libHash(c){const s=JSON.stringify([c.t,c.f,c.b||'',c.x||'',c.g||[]]);let h=5381;for(let i=0;i<s.length;i++)h=(h*33^s.charCodeAt(i))>>>0;return h.toString(36)}
function libDeckOf(libId){return Object.values(S.decks).find(d=>d.lib?.id===libId)}
// Sloučí stažený balíček do lokálního: nové karty přidá, změněné v knihovně přepíše (stav učení zůstává),
// odebrané z knihovny smaže. Karta, kterou uživatel smazal sám, se znovu nepřidá (je v seen).
function libApply(deckId,data){
  const d=S.decks[deckId],L=d.lib,seen=new Set(L.seen||[]),have={},up=new Set();let add=0,upd=0,del=0;const base=Date.now();
  for(const n of Object.values(S.notes))if(n.deck===deckId&&n.lib)have[n.lib]=n;
  (data.cards||[]).forEach((c,i)=>{
    if(!c||!c.id||!c.f||!['basic','reverse','cloze'].includes(c.t))return;
    up.add(c.id);const h=libHash(c),n=have[c.id],cz=c.t==='cloze';
    const fields={front:c.f,back:cz?'':(c.b||''),extra:c.x||''};
    if(n){if(n.libH!==h){Object.assign(n,{type:c.t,fields,tags:[...(c.g||[])],libH:h});saveNote(n);upd++}}
    else if(!seen.has(c.id)){saveNote({id:'lib-'+c.id,deck:deckId,type:c.t,fields,tags:[...(c.g||[])],typein:false,marked:false,created:base+i,lib:c.id,libH:h});add++}
    seen.add(c.id);
  });
  for(const [k,n] of Object.entries(have))if(!up.has(k)){deleteNote(n.id);del++}
  if(data.group)d.group=data.group;L.seen=[...seen].filter(k=>up.has(k));L.ver=data.updated||'';L.synced=Date.now();save();
  return {add,upd,del};
}
function libMsg(r){const p=[];if(r.add)p.push(`+${r.add} ${pl(r.add,'nová karta','nové karty','nových karet')}`);if(r.upd)p.push(`${r.upd} ${pl(r.upd,'upravená','upravené','upravených')}`);if(r.del)p.push(`${r.del} ${pl(r.del,'odebraná','odebrané','odebraných')}`);return p.join(' · ')}
async function libSync(deckId){const d=S.decks[deckId];const idx=await libGet('index.json');const e=(idx.decks||[]).find(x=>x.id===d.lib.id);if(!e)throw new Error('Balíček už v knihovně není');return libApply(deckId,await libGet(e.file))}
// Při spuštění tiše doplní odebírané balíčky (nejvýš jednou za 10 minut).
async function libSyncAll(){
  const subs=Object.values(S.decks).filter(d=>d.lib&&Date.now()-(d.lib.synced||0)>6e5);if(!subs.length)return;
  let idx;try{idx=await libGet('index.json')}catch(e){return}
  const msgs=[];
  for(const d of subs){const e=(idx.decks||[]).find(x=>x.id===d.lib.id);if(!e)continue;if(e.group)d.group=e.group;
    if(e.updated&&e.updated===d.lib.ver){d.lib.synced=Date.now();continue}
    try{const m=libMsg(libApply(d.id,await libGet(e.file)));if(m)msgs.push(`${d.name}: ${m}`)}catch(err){}}
  save();if(msgs.length){if(!Study.open&&!Layers.stack.length)render();toast(msgs.join(' · '))}
}

          const r=libApply(id,data);S.meta.lastDeck=id;persistStorage();toast(`Balíček přidán · ${r.add} ${pl(r.add,'karta','karty','karet')}`)}
      }else{const d=libDeckOf(e.id);const m=libMsg(await libSync(d.id));toast(m||'Balíček je aktuální')}

/* ---------- testy (soubory v knihovně, index.json → tests) ---------- */
// Test: {id, name, group, desc, deck, questions: [{id, t: 'abcd', q, o: [možnosti], a: index správné, x} | {id, t: 'open', q, a: vzorová odpověď, k: [[klíčový bod, [kmeny slov]]], x}]}
// Výsledky jsou v S.testRuns (synchronizují se jako r:<id>).
let TIDX=null,TIDX_ERR=false;
async function testsLoad(){
  try{const idx=await libGet('index.json');TIDX=idx.tests||[];Store.set('tests:index',TIDX)}
  catch(e){TIDX=(await Store.get('tests:index'))||null;TIDX_ERR=!TIDX}

async function testGet(e){try{const d=await libGet(e.file);Store.set('test:'+e.id,d);return d}catch(err){const d=await Store.get('test:'+e.id);if(d)return d;throw err}}
function testRuns(id){return Object.values(S.testRuns||{}).filter(r=>!id||r.test===id).sort((a,b)=>b.at-a.at)}
const runPct=r=>r.max?Math.round(r.score/r.max*100):0;
// Kolik různých otázek testu už bylo zodpovězeno (r.ids; u starších výsledků jsou známé jen chybné) a kolik naposledy správně
function testProgress(e){
  const last={};for(const r of testRuns(e.id).reverse()){const w=new Set(r.wrong||[]);for(const q of r.ids||r.wrong||[])last[q]=w.has(q)?0:1}
  const ids=Object.keys(last),tot=e.count||((e.abcd||0)+(e.open||0));
  return {ids,done:Math.min(ids.length,tot),ok:Math.min(ids.filter(q=>last[q]).length,tot),tot};
}

    const recs=[];q.docChanges().forEach(c=>{if(c.type==='removed')return;const r=c.doc.data().r||{};for(const k in r)recs.push([k,r[k]])});
    if(recs.length&&syApply(recs)){syPersist();applyTheme();if(!Study.open&&!Layers.stack.length)render()}
    if(!SY.pushing&&!Object.keys(SY.dirty).length)sySet(q.metadata.fromCache?'pend':'ok',q.metadata.fromCache?'Čekám na připojení.':'');
    syPush();
  },e=>{sySet('err',syErr(e));SY.unsub=null});
}
function sySchedule(){if(!SY.unsub)return;clearTimeout(SY.t);SY.t=setTimeout(syPush,1500)}
async function syPush(){
  if(!SY.user||!SY.unsub||SY.pushing)return;const keys=Object.keys(SY.dirty);if(!keys.length)return;
  SY.pushing=true;sySet('pend','Odesílám změny…');
  try{
    const by={};for(const k of keys)(by[syBucket(k)]??=[]).push(k);
    const lm=keys.some(k=>k[0]==='l')?new Map(LOGS.map(l=>[syLogKey(l),l])):null;
    for(const [b,ks] of Object.entries(by))for(let i=0;i<ks.length;i+=400){
      const part=ks.slice(i,i+400),data={r:{}},sent=[];
      for(const k of part){const u=SY.u[k]||0;if(SY.h[k]==='x')data.r[k]={x:1,u};else{const v=syVal(k,lm);if(v===undefined){delete SY.dirty[k];continue}data.r[k]={v:JSON.parse(JSON.stringify(v)),u}}sent.push([k,u])}
      if(!sent.length)continue;
      await syColl().doc(b).set(data,{mergeFields:sent.map(([k])=>new firebase.firestore.FieldPath('r',k))});
      for(const [k,u] of sent)if(SY.u[k]===u)delete SY.dirty[k];
    }
    syPersist();sySet('ok');
  }catch(e){sySet('err',syErr(e))}
  SY.pushing=false;if(Object.keys(SY.dirty).length&&SY.st!=='err')sySchedule();
}
function syBoot(){if(SY.on&&!SY.auth){sySet('pend','Připojuji se…');syLoadFb().then(syBindAuth).catch(e=>sySet('err',syErr(e)))}}
async function syOn(){
  try{localStorage.removeItem('engram:syncOff')}catch(e){}
  try{toast('Připojuji…');await syLoadFb();await syBindAuth();
    if(firebase.auth().currentUser){SY.user=firebase.auth().currentUser;syStart();}else syLogin();
  }catch(e){toast(syErr(e))}
}
function syStart(){SY.on=true;syPersist();syAttach();render();toast('Synchronizace zapnuta')}
function syLogin(){
  const w=sheet(`<h3 class="t">Přihlášení</h3><p class="d">Stejný účet jako v <a href="./posilovna.html" style="color:var(--accent)">Posilovně</a> – tam si ho taky založíte nebo obnovíte heslo.</p>
    <form class="form" id="syF" style="margin-top:16px" autocomplete="on">
      <label class="field"><span>Jméno nebo e-mail</span><input name="login" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></label>
      <label class="field"><span>Heslo</span><input name="pw" type="password" autocomplete="current-password" required></label>
      <div class="hint warn" id="syE"></div>
      <button class="btn primary lg block">Přihlásit a synchronizovat</button></form>`);
  const f=$('#syF',w);setTimeout(()=>f.login.focus(),300);
  f.onsubmit=async e=>{e.preventDefault();const bt=f.querySelector('button'),er=$('#syE',w);bt.disabled=true;er.textContent='';
    try{await syLoadFb();let email=f.login.value.trim();
      if(!email.includes('@')){const d=await firebase.firestore().collection('usernames').doc(email.toLowerCase()).get();if(!d.exists)throw new Error('Uživatel s tímto jménem neexistuje.');email=d.data().email}
      const cred=await firebase.auth().signInWithEmailAndPassword(email,f.pw.value);SY.user=cred.user;syBindAuth();w.close();syStart();
    }catch(err){er.textContent=syErr(err);bt.disabled=false}};
}
async function syOff(silent){
  try{firebase.auth().signOut()}catch(e){}
  syDetach();clearTimeout(SY.t);Object.assign(SY,{on:false,uid:null,email:'',user:null,auth:null,h:{},u:{},dirty:{}});sySet('local');syPersist();render();
  if(!silent){try{localStorage.setItem('engram:syncOff','1')}catch(e){}toast('Synchronizace vypnuta – data zůstávají v zařízení')}
}
// Je v tomto prohlížeči přihlášený účet Firebase (Posilovna, Daily, Zpěvník)? Zjistí se bez stahování knihovny Firebase.
function fbHasUser(){return new Promise(res=>{try{const r=indexedDB.open('firebaseLocalStorageDb');
  r.onupgradeneeded=()=>{try{r.transaction.abort()}catch(e){}res(false)};r.onerror=()=>res(false);r.onblocked=()=>res(false);
  r.onsuccess=()=>{const db=r.result;try{if(!db.objectStoreNames.contains('firebaseLocalStorage')){db.close();return res(false)}
    const q=db.transaction('firebaseLocalStorage','readonly').objectStore('firebaseLocalStorage').getAllKeys();
    q.onsuccess=()=>{db.close();res((q.result||[]).some(k=>String(k).startsWith('firebase:authUser:')))};q.onerror=()=>{db.close();res(false)}}catch(e){db.close();res(false)}}}catch(e){res(false)}})}
// Synchronizace se zapne sama, pokud ji uživatel v tomto zařízení výslovně nevypnul a je přihlášený účtem z Posilovny
async function syAuto(){
  if(SY.on)return;try{if(localStorage.getItem('engram:syncOff'))return}catch(e){}
  if(!await fbHasUser())return;
  try{await syLoadFb();await syBindAuth();const u=firebase.auth().currentUser;if(u&&!SY.on){SY.user=u;syStart()}}catch(e){}
}
addEventListener('online',()=>{syBoot();if(SY.user&&!SY.unsub&&SY.on)syAttach();syPush()});

// Balíčky z knihovny dostanou stálá id (lib-<balíček>, lib-<karta>, <poznámka>_<pořadí>), aby se při synchronizaci
// stejný balíček přidaný ve dvou zařízeních spojil a nezdvojil. Převádí starší balíčky přidané s náhodnými id.
function migrateLibIds(){
  const cmap={};let ch=false;
  for(const d of Object.values(S.decks)){if(!d.lib)continue;const nd='lib-'+d.lib.id;
    if(d.id!==nd){if(S.decks[nd])continue;delete S.decks[d.id];if(S.meta.lastDeck===d.id)S.meta.lastDeck=nd;
      for(const n of Object.values(S.notes))if(n.deck===d.id)n.deck=nd;d.id=nd;S.decks[nd]=d;ch=true}
    for(const n of Object.values(S.notes)){if(n.deck!==nd||!n.lib||n.id==='lib-'+n.lib||S.notes['lib-'+n.lib])continue;
      const nn='lib-'+n.lib;delete S.notes[n.id];
      for(const c of Object.values(S.cards))if(c.nid===n.id){const nc=nn+'_'+c.ord;delete S.cards[c.id];cmap[c.id]=nc;c.id=nc;c.nid=nn;S.cards[nc]=c}
      n.id=nn;S.notes[nn]=n;ch=true}
  }
  if(Object.keys(cmap).length){for(const l of LOGS)if(cmap[l[1]])l[1]=cmap[l[1]];save('logs')}
  if(ch)save();
}

/* ---------- sample decks ---------- */
function createSamples(){

  const t=Date.now();
  caps.forEach(([c,m],i)=>saveNote({id:uid(),deck:a,type:'basic',fields:{front:`Hlavní město: **${c}**`,back:m,extra:''},tags:['zeměpis'],typein:i%6===5,marked:false,created:t+i}));
  const b=newDeck('Jak funguje Engram',{desc:'Krátký průvodce aplikací',color:COLORS[1],newPerDay:10});
  const g=[
    ['basic','Jak hodnotit odpověď?','- **Znovu** – nevybavím si ji\n- **Těžké** – vybavím, ale s velkým úsilím\n- **Dobře** – vybavím po chvilce\n- **Snadné** – vybavím okamžitě','Nejčastěji byste měli mačkat „Dobře“.'],
    ['cloze','Engram plánuje opakování algoritmem {{c1::FSRS}}, který pro každou kartu odhaduje {{c2::stabilitu}} a {{c3::obtížnost}}.','',''],
    ['basic','Jaká gesta fungují po odkrytí odpovědi?','Potažení **doprava** = Dobře\nPotažení **doleva** = Znovu','Gesta lze vypnout v Nastavení.'],
    ['cloze','Cílová retence 90 % znamená, že při opakování si vybavíte zhruba {{c1::9 z 10::kolik}} karet.','','Vyšší retence = víc opakování.'],
    ['basic','Co je „pijavice“?','Karta, kterou opakovaně zapomínáte. Obvykle pomůže ji přeformulovat nebo rozdělit na menší.',''],
    ['reverse','pes','dog','Oboustranná karta – vytvoří dvě karty.']
  ];
  g.forEach(([type,f,bk,x],i)=>saveNote({id:uid(),deck:b,type,fields:{front:f,back:bk,extra:x},tags:['průvodce'],typein:false,marked:false,created:t-100+i}));
  S.meta.lastDeck=b;save();render();toast('Ukázkové balíčky vytvořeny');
}

/* ---------- actions ---------- */
const ACT={
  tab:el=>go(el.dataset.v),
  add:()=>openEditor(null),
  study:()=>{const ids=Object.keys(S.decks);Study.start(ids)},
  deck:el=>openDeck(el.dataset.id),
  'deck-new':()=>editDeck(null),
  'folder-new':()=>editFolder(null),
  fold:el=>foldToggle(el.dataset.k),
  'fold-menu':el=>openFolder(el.dataset.id),
  sample:createSamples,
  library:openLibrary,
  test:el=>openTestSheet(el.dataset.id),
  'tests-reload':()=>{TIDX_ERR=false;TIDX=null;render()},
  'test-close':()=>Test.close(),
  'test-pick':el=>Test.pick(el.dataset.o),
  'test-eval':()=>Test.evalOpen(),
  'test-self':el=>Test.self(el.dataset.s),
  'test-next':()=>Test.next(),
  'test-retry':()=>Test.retry(),
  'sync-on':()=>syOn(),
  'sync-fix':async()=>{try{await syLoadFb();await syBindAuth()}catch(e){toast(syErr(e));return}if(firebase.auth().currentUser){SY.user=firebase.auth().currentUser;syDetach();syAttach()}else syLogin()},
  'sync-off':()=>syOff(),
  'sync-now':async()=>{await flush();if(!SY.unsub)syAttach();else syPush();toast('Synchronizuji…')},
  import:openImport,
  backup:doBackup,
  restore:doRestore,
  ics:downloadICS,
  note:el=>openEditor(el.dataset.id),
  more:()=>{BR.limit+=100;browseList()},
  wipe:async()=>{if(!await confirmDlg('Smazat všechna data?',`Všechny balíčky, karty a historie budou nenávratně odstraněny${SY.on?' – i ve všech synchronizovaných zařízeních':''}. Doporučujeme nejdřív zálohovat.`,'Smazat vše',true))return;
    S=freshCore();LOGS=[];MEDIA={};save('core','logs','media');await flush();applyTheme();go('home');toast('Data smazána')},
  reveal:()=>Study.reveal(),
  rate:el=>Study.answer(+el.dataset.g),
  'study-close':()=>Study.close(),
  'study-round':()=>{Study.queue=Study.buildRound();Study.next()},
  'study-undo':()=>Study.doUndo(),
  'study-menu':()=>Study.menu(),
  'study-edit':()=>{if(Study.cur)openEditor(S.cards[Study.cur].nid)},
  'study-mark':()=>{const c=S.cards[Study.cur];if(!c)return;const n=S.notes[c.nid];n.marked=!n.marked;save();Study.renderCard(false);toast(n.marked?'Označeno hvězdičkou':'Označení zrušeno')},
  'study-wait':()=>{Study.queue=Study.queue.filter(id=>Study.valid(id));const L=Study.learnCards();if(L.length){const now=Date.now();Study.cur=L[0].id;Study.revealed=false;Study.shownAt=now;Study.renderCard(true)}else Study.next()},
  'study-more':()=>{addExtraNew(Study.decks,10);const q=Study.build();Study.queue=q.filter(id=>!Study.queue.includes(id)&&S.cards[id].state===0).concat(Study.queue);Study.next()},
  speak:()=>{const c=S.cards[Study.cur];if(!c)return;const f=faces(c);if(Study.revealed&&f.la)speak(f.aT,f.la);else if(f.lq)speak(f.qT,f.lq);else toast('Nastavte jazyk čtení v nastavení balíčku')}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el,e)}});

/* ---------- init ---------- */
(async function init(){
  $('#backLink').innerHTML=icon('back',22);$('#addBtn').innerHTML=icon('plus',22,2.2);$('#logo').innerHTML=icon('logo',16,2.6);
  $('#stClose').innerHTML=icon('x',22);$('#tsClose').innerHTML=icon('x',22);$('#stUndo').innerHTML=icon('undo',21);$('#stMenu').innerHTML=icon('more',22,2.4);
  await Store.open();
  let core=await Store.get('core');
  S=core&&core.v?core:freshCore();
  S.settings={...DEF_SET,...S.settings};S.meta={...freshCore().meta,...S.meta};S.testRuns||={};S.folders||={};S.testFolders||={};
  LOGS=(await Store.get('logs'))||[];MEDIA=(await Store.get('media'))||{};
  migrateLibIds();
  const sy=await Store.get('sync');if(sy&&sy.on)Object.assign(SY,{on:true,uid:sy.uid||null,email:sy.email||'',h:sy.h||{},u:sy.u||{},dirty:sy.dirty||{}});
  applyTheme();render();libSyncAll();syBoot();syAuto();testsLoad();
  if('speechSynthesis' in window)speechSynthesis.getVoices();
  let lastDay=dayIdx();setInterval(()=>{const d=dayIdx();if(d!==lastDay){lastDay=d;if(!Study.open&&!Layers.stack.length)render()}},60000);
})();
