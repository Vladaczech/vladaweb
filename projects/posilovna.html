<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Posilovna">
<title>Posilovna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050505;--panel:#0b0b0b;--panel2:#111;--line:#1b1b1b;--line2:#292929;
  --text:#ececec;--muted:#8d8d8d;--muted2:#5c5c5c;
  --neon:#39ff88;--neon-d:#1d7d46;--neon-g:rgba(57,255,136,.12);
  --warn:#ffa630;--bad:#ff4d6d;--cyan:#3ee6ff;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;--sans:'Inter',system-ui,sans-serif;--display:'Space Grotesk','Inter',sans-serif;
  --nav:62px;--r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45;min-height:100dvh;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(700px 420px at 90% -10%,rgba(57,255,136,.08),transparent 65%);z-index:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:16px;outline:none;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--neon);box-shadow:0 0 0 3px var(--neon-g)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
a{color:var(--neon)}
.hidden{display:none!important}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 16px calc(var(--nav) + env(safe-area-inset-bottom) + 96px)}
header.top{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 0 12px;background:linear-gradient(var(--bg) 70%,rgba(5,5,5,0))}
.brand{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);flex:1}
.brand b{color:var(--neon);text-shadow:0 0 10px rgba(57,255,136,.7);font-weight:700}
.cursor{color:var(--neon);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sync{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;color:var(--muted2);letter-spacing:.06em}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted2);flex:none}
.dot.ok{background:var(--neon);box-shadow:0 0 8px var(--neon)}
.dot.pend{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.dot.err{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted)}
.icon-btn:active{border-color:var(--neon);color:var(--neon)}
.icon-btn.on{color:var(--neon);border-color:var(--neon-d)}
.kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--neon)}
h1.title{font-family:var(--display);font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1.02;margin:6px 0 18px}
h1.title .d{color:var(--neon);text-shadow:0 0 16px var(--neon)}
h2.sec{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;display:flex;align-items:center;gap:10px}
h2.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:grid;gap:10px}
.row{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);font-family:var(--mono);font-size:12.5px;letter-spacing:.04em;color:var(--text);white-space:nowrap}
.btn:active{border-color:var(--neon);color:var(--neon)}
.btn.p{background:var(--neon);border-color:var(--neon);color:#03170a;font-weight:700;box-shadow:0 0 22px rgba(57,255,136,.25)}
.btn.p:active{color:#03170a;filter:brightness(1.1)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad);border-color:rgba(255,77,109,.35)}
.btn.wide{width:100%}
.btn.big{min-height:58px;font-size:14px;border-radius:16px}
.btn.sm{min-height:34px;padding:0 12px;font-size:11.5px;border-radius:10px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 -16px;padding:0 16px 2px}
.chips::-webkit-scrollbar{display:none}
.chips.wrapc{flex-wrap:wrap;margin:0;padding:0;overflow:visible}
.chip{flex:none;padding:7px 12px;border-radius:999px;border:1px solid var(--line2);font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.chip.on{color:#03170a;background:var(--neon);border-color:var(--neon);font-weight:700}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.seg button.on{background:#1a1a1a;color:var(--neon);box-shadow:inset 0 0 0 1px var(--neon-d)}

/* nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(5,5,5,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav)}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2)}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--neon)}
nav button.on svg{filter:drop-shadow(0 0 6px rgba(57,255,136,.8))}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .v{font-family:var(--display);font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.stat .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);margin-top:4px}
.recency{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rec{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.rec b{font-weight:500;font-size:13.5px}
.rec span{font-family:var(--mono);font-size:11px;color:var(--muted2)}
.rec.due{border-color:var(--neon-d)}
.rec.due span{color:var(--neon)}

/* workout */
.wo-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px}
.wo-head .timer{font-family:var(--display);font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1;color:var(--neon);text-shadow:0 0 18px rgba(57,255,136,.45)}
.wo-head input{width:auto;flex:1;font-size:13px;padding:8px 10px;font-family:var(--mono);color:var(--muted)}
.exc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.exc-h{display:flex;align-items:center;gap:10px}
.exc-h .fig-mini{width:54px;height:48px;flex:none;border-radius:10px;background:#080808;border:1px solid var(--line)}
.exc-h .nm{flex:1;min-width:0}
.exc-h .nm b{display:block;font-family:var(--display);font-weight:500;font-size:17px;line-height:1.2}
.exc-h .nm span{font-family:var(--mono);font-size:10.5px;color:var(--muted2);letter-spacing:.06em}
.reco{margin-top:10px;border-radius:12px;padding:10px 12px;background:rgba(57,255,136,.05);border:1px solid rgba(57,255,136,.18)}
.reco .rt{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.reco .rt .k{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--neon)}
.reco .rt b{font-family:var(--display);font-size:18px;font-weight:600}
.reco p{font-size:12.5px;color:var(--muted);margin-top:3px}
.reco.down{background:rgba(255,166,48,.06);border-color:rgba(255,166,48,.25)}
.reco.down .rt .k{color:var(--warn)}
.reco.new{background:var(--panel2);border-color:var(--line2)}
.reco.new .rt .k{color:var(--muted)}
.last{font-family:var(--mono);font-size:11px;color:var(--muted2);margin-top:8px}
.sets{margin-top:10px;display:grid;gap:6px}
.set-h,.set{display:grid;grid-template-columns:20px minmax(54px,1fr) minmax(46px,.8fr) auto 42px;gap:6px;align-items:center}
.set-h{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2)}
.set .n{font-family:var(--mono);font-size:12px;color:var(--muted2);text-align:center}
.set input{padding:9px 6px;text-align:center;font-family:var(--mono);font-size:16px;border-radius:9px}
.set:not(.ok) input{color:var(--muted)}
.chk{width:42px;height:38px;border-radius:9px;border:1px solid var(--line2);display:grid;place-items:center;color:var(--muted2)}
.set.ok .chk{background:var(--neon);border-color:var(--neon);color:#03170a;box-shadow:0 0 14px rgba(57,255,136,.35)}
.set.ok .n{color:var(--neon)}
.set-actions{display:flex;gap:6px;margin-top:8px}
.set-actions .btn{flex:1}
.chg{font-size:12.5px;color:var(--muted);margin-top:4px;font-family:var(--mono)}
.chg span{color:var(--muted2)}
.chg b{color:var(--neon);font-weight:500}
.reco.down .chg b{color:var(--warn)}
.xnote{margin-top:8px;font-size:13px;color:#d9d9d9;padding:8px 10px;border-left:2px solid var(--neon-d);background:var(--panel2);border-radius:0 8px 8px 0}
.xnote span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2)}
.ctabs{display:flex;gap:6px;margin-top:8px}
.ctabs button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--muted)}
.ctabs button.on{color:var(--neon);border-color:var(--neon-d);background:rgba(57,255,136,.05)}
.cpanel{margin-top:8px;padding:10px;border-radius:12px;background:#080808;border:1px solid var(--line)}
.exc textarea,.cpanel textarea{min-height:56px;font-family:var(--sans);font-size:15px}
.xh-list{display:grid}
.xh{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.xh:last-child{border-bottom:0}
.xh-d{width:46px;flex:none;font-family:var(--mono);font-size:12px;color:var(--text)}
.xh-d span{display:block;font-size:10px;color:var(--muted2)}
.xh-b{flex:1;min-width:0}
.xh-s{font-family:var(--mono);font-size:13px;line-height:1.5;word-break:break-word}
.xh-m{font-family:var(--mono);font-size:10.5px;color:var(--muted2);margin-top:2px}
.xh-m .up{color:var(--neon)}.xh-m .dn{color:var(--warn)}.xh-m .eqm{color:var(--muted)}
.xh-n{font-size:12.5px;color:var(--muted);font-style:italic;margin-top:3px}
.legend-rir{font-size:11px;color:var(--muted2);margin-top:8px;font-family:var(--mono)}

/* náročnost série */
.set-h,.set{grid-template-columns:22px minmax(48px,1fr) minmax(42px,.8fr) 76px 42px}
.diff{height:38px;border-radius:9px;border:1px dashed var(--line2);font-family:var(--mono);font-size:10px;letter-spacing:.02em;color:var(--muted2);padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .15s}
.diff.on{border:1px solid var(--dc);color:var(--dc);background:color-mix(in srgb,var(--dc) 11%,transparent);font-weight:700}
.diff.open{border-style:solid;border-color:var(--text);color:var(--text)}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:0 0 4px;animation:pop .18s ease-out}
.rate button{position:relative;overflow:hidden;border:1px solid var(--line2);border-radius:10px;padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;background:#0d0d0d}
.rate button::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--dc);box-shadow:0 0 8px var(--dc)}
.rate button b{font-size:11.5px;font-weight:600;color:var(--text);white-space:nowrap}
.rate button span{font-family:var(--mono);font-size:8.5px;color:var(--muted2);line-height:1.2;text-align:center}
.rate button.on{border-color:var(--dc);background:color-mix(in srgb,var(--dc) 14%,transparent)}
.rate button:active{transform:scale(.96)}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}}
.prb{display:inline-block;font-size:8.5px;color:#03170a;background:var(--neon);padding:2px 3px;border-radius:4px;font-family:var(--mono);box-shadow:0 0 10px rgba(57,255,136,.7);animation:pop .3s ease-out}
.qd{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--dc);margin-left:3px;vertical-align:middle;box-shadow:0 0 5px var(--dc)}
.dq{font-family:var(--mono);font-size:11px;color:var(--dc)}
/* kotouče, rozcvičení */
.plates{display:flex;align-items:center;gap:3px;flex-wrap:wrap;margin-top:8px;font-family:var(--mono);font-size:10.5px;color:var(--muted2)}
.plates>span{margin-right:4px}
.plates em{font-style:normal;margin-left:6px}
.pl{display:inline-grid;place-items:center;width:20px;border-radius:3px;font-size:8px;font-weight:700;color:#0a0a0a;font-style:normal}
.p25{height:34px;background:#e2463b}.p20{height:30px;background:#3d8bff}.p15{height:26px;background:#f2d23a}.p10{height:22px;background:#37c871}.p5{height:18px;background:#e8e8e8}.p2_5{height:15px;background:#8a8a8a}.p1_25{height:12px;background:#5d5d5d;color:#ddd}
.plates .bar{width:26px;height:4px;background:#9a9a9a;border-radius:2px}
.warm{margin-top:10px;font-size:12px;color:var(--muted2)}
.warm summary{cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);list-style:none}
.warm summary::-webkit-details-marker{display:none}
.warm summary::before{content:"▸ ";color:var(--neon)}
.warm[open] summary::before{content:"▾ "}
.warm div{font-family:var(--mono);font-size:12.5px;color:var(--text);margin:6px 0 2px}
/* menu, toast */
.menu{display:grid;gap:6px;margin-top:14px}
.menu button{text-align:left;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.menu button:active{border-color:var(--neon-d)}
.menu b{display:block;font-weight:500;font-size:15px}
.menu span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.menu .danger b{color:var(--bad)}
.t-undo{margin-left:14px;color:var(--neon);font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;padding:4px 2px;font-weight:700}
/* týdenní cíl */
.goal{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.ringw{position:relative;width:84px;height:84px;flex:none}
.ring{width:84px;height:84px;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:#191919;stroke-width:7}
.ring .prg{fill:none;stroke:var(--neon);stroke-width:7;stroke-linecap:round;filter:drop-shadow(0 0 5px rgba(57,255,136,.6));transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring-t{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring-t b{display:block;font-family:var(--display);font-size:27px;font-weight:600;line-height:1}
.ring-t span{font-family:var(--mono);font-size:10px;color:var(--muted2)}
.goal-r{flex:1;min-width:0}
.goal-r>b{display:block;font-family:var(--display);font-size:19px;font-weight:600;margin:3px 0 8px}
.days{display:flex;gap:4px;margin-bottom:7px}
.days i{flex:1;text-align:center;font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--muted2);padding:4px 0;border-radius:6px;background:#121212}
.days i.on{background:var(--neon);color:#03170a;font-weight:700;box-shadow:0 0 8px rgba(57,255,136,.35)}
.days i.today{outline:1px solid var(--muted2);outline-offset:1px}
/* shrnutí */
.sum-hero{position:relative}
.sum-hero h3 .d{color:var(--neon);text-shadow:0 0 16px var(--neon)}
.burst{position:absolute;right:60px;top:26px;width:0;height:0;pointer-events:none}
.burst i{position:absolute;width:5px;height:9px;border-radius:2px;background:var(--neon);box-shadow:0 0 8px var(--neon);opacity:0;animation:burst 1.2s cubic-bezier(.15,.7,.3,1) forwards}
.burst i:nth-child(3n){background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.burst i:nth-child(4n){background:#d4ff3a}
@keyframes burst{0%{opacity:1;transform:rotate(var(--a)) translateY(0)}100%{opacity:0;transform:rotate(var(--a)) translateY(calc(var(--d) * -1))}}
.pr-card{margin:12px 0 0;padding:12px 14px;border-radius:14px;border:1px solid var(--neon-d);background:rgba(57,255,136,.06);display:grid;gap:4px;font-size:14px}
.pr-card b{color:var(--neon);font-weight:600}
.sum-ex{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line)}
.sum-ex span{font-size:14px}
.sum-ex small{grid-column:1;font-family:var(--mono);font-size:11px;color:var(--muted2)}
.sum-ex b{grid-row:1/3;grid-column:2;align-self:center;font-family:var(--mono);font-size:13px;color:var(--muted);font-weight:500}
.sum-ex b.up{color:var(--neon)}.sum-ex b.dn{color:var(--warn)}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.rpe button{height:42px;border-radius:8px;border:1px solid var(--line2);font-family:var(--mono);font-size:13px;color:var(--muted);border-bottom:3px solid var(--rc)}
.rpe button.on{background:var(--rc);border-color:var(--rc);color:#050505;font-weight:700;box-shadow:0 0 14px color-mix(in srgb,var(--rc) 50%,transparent)}
.rpe-l{font-size:13px;color:var(--muted);margin:8px 0 12px;min-height:18px}
/* tělo a fotky */
.gal h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);margin:16px 0 8px;font-weight:400}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph{position:relative;display:block;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#111;border:1px solid var(--line);padding:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:6px;bottom:5px;font-family:var(--mono);font-size:9.5px;color:#fff;text-shadow:0 1px 4px #000}
.ph.sel{outline:2px solid var(--neon);outline-offset:2px}
.ph .num{left:auto;right:6px;top:6px;bottom:auto;background:var(--neon);color:#03170a;border-radius:6px;padding:1px 6px;text-shadow:none;font-weight:700;font-size:11px}
.ph.add{display:grid;place-items:center;font-size:22px;color:var(--muted);border-style:dashed;cursor:pointer}
.thumbs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.thumbs .ph{width:68px;flex:none}
.thumbs.mini{margin-top:8px}.thumbs.mini .ph{width:44px;border-radius:8px}
.viewer{position:relative;margin:12px 0;border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--line)}
.viewer img{width:100%;display:block;max-height:66dvh;object-fit:contain}
.pv-load{position:absolute;left:10px;bottom:8px;font-family:var(--mono);font-size:10px;color:var(--muted);background:rgba(0,0,0,.6);padding:3px 7px;border-radius:6px}
.cmp{position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;margin:12px 0 8px;touch-action:none;background:#000;user-select:none;-webkit-user-select:none;cursor:ew-resize}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.cmp .ca{position:absolute;inset:0}
.cmp-line{position:absolute;top:0;bottom:0;width:2px;background:var(--neon);box-shadow:0 0 12px var(--neon);transform:translateX(-1px);pointer-events:none}
.cmp-line::after{content:"⇆";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:var(--neon);color:#03170a;display:grid;place-items:center;font-weight:700;box-shadow:0 0 16px rgba(57,255,136,.6)}
.cl{position:absolute;top:10px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;background:rgba(0,0,0,.65);padding:4px 7px;border-radius:6px;pointer-events:none}
.cl.l{left:10px}.cl.r{right:10px}
.cmpr{padding:0;accent-color:var(--neon);height:28px;border:0;background:none}
.bwrows .row{padding:4px 0;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12.5px}
.bwrows .row:last-child{border-bottom:0}
label.btn{cursor:pointer}
/* library */
.lib{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.lib-it{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 8px 10px;text-align:left;display:flex;flex-direction:column;gap:6px}
.lib-it:active{border-color:var(--neon-d)}
.lib-it svg.fig{width:100%;height:auto;aspect-ratio:220/192;background:#080808;border-radius:10px}
.lib-it b{font-family:var(--display);font-weight:500;font-size:14.5px;line-height:1.2;padding:0 4px}
.lib-it span{font-family:var(--mono);font-size:10px;color:var(--muted2);padding:0 4px;letter-spacing:.06em}
.search{position:relative;margin-bottom:10px}
.search input{padding-left:36px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted2)}

/* figures */
svg.fig .floor{stroke:#1e1e1e;stroke-width:2}
svg.fig .prop{stroke:#3a3a3a;stroke-width:4;stroke-linecap:round;fill:none}
svg.fig .propf{fill:#1a1a1a;stroke:#3a3a3a;stroke-width:2}
svg.fig .b{stroke:var(--neon);stroke-width:6;stroke-linecap:round;fill:none}
svg.fig .far .b{stroke:var(--neon-d)}
svg.fig .hd{fill:#050505;stroke:var(--neon);stroke-width:5}
svg.fig .glow{filter:drop-shadow(0 0 4px rgba(57,255,136,.55))}
svg.fig .eq{stroke:#d7d7d7;stroke-width:3;fill:#050505;stroke-linecap:round}
svg.fig .eqh{fill:#d7d7d7}
svg.fig .cable{stroke:#6a6a6a;stroke-width:1.5;stroke-dasharray:3 3}
svg.fig .pul{fill:#050505;stroke:#6a6a6a;stroke-width:2}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92dvh;overflow:auto;background:#090909;border-top:1px solid var(--line2);border-radius:22px 22px 0 0;transform:translateY(102%);transition:transform .26s cubic-bezier(.2,.8,.2,1);padding:10px 16px calc(24px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.sheet.on{transform:none}
.sheet .in{max-width:560px;margin:0 auto}
.grab{width:42px;height:4px;border-radius:4px;background:#2a2a2a;margin:2px auto 12px}
.sheet h3{font-family:var(--display);font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.pick-list{display:grid;gap:6px;margin-top:10px}
.pick{display:flex;align-items:center;gap:12px;padding:8px;border:1px solid var(--line);border-radius:14px;text-align:left;background:var(--panel)}
.pick svg.fig{width:64px;height:56px;flex:none;background:#080808;border-radius:9px}
.pick b{display:block;font-weight:500;font-size:15px}
.pick span{font-family:var(--mono);font-size:10.5px;color:var(--muted2)}
.big-fig{background:#070707;border:1px solid var(--line);border-radius:18px;padding:6px;margin:12px 0}
.big-fig svg{width:100%;height:auto;display:block}
.mmap svg{width:100%;height:auto;display:block}
.tips{display:grid;gap:8px;margin-top:4px}
.tips li{list-style:none;display:flex;gap:10px;font-size:14px;color:#cfcfcf}
.tips li::before{content:"›";color:var(--neon);font-family:var(--mono);font-weight:700}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mtag{font-family:var(--mono);font-size:10.5px;padding:4px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--muted)}
.mtag.p{border-color:var(--neon-d);color:var(--neon)}

/* charts */
.chart{position:relative;width:100%;touch-action:pan-y}
.chart svg{display:block;width:100%}
.chart .ax{font-family:var(--mono);font-size:10px;fill:var(--muted2)}
.chart .grid{stroke:#191919;stroke-width:1}
.chart .ln{fill:none;stroke:var(--neon);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 5px rgba(57,255,136,.5))}
.chart .pt{fill:var(--bg);stroke:var(--neon);stroke-width:2}
.chart .pt.f{fill:var(--neon)}
.chart .xh{stroke:#3a3a3a;stroke-width:1}
.tt{position:absolute;pointer-events:none;background:#0f0f0f;border:1px solid var(--line2);border-radius:10px;padding:7px 10px;font-size:12px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-10px;box-shadow:0 8px 24px rgba(0,0,0,.6);z-index:2}
.tt b{font-family:var(--display);font-size:15px;color:var(--text)}
.tt span{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.mult{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mult .card{padding:10px 10px 8px}
.mult .hdr{display:flex;justify-content:space-between;align-items:baseline}
.mult .hdr b{font-size:13.5px;font-weight:500}
.mult .hdr span{font-family:var(--mono);font-size:10.5px;color:var(--muted2)}
.mult .big{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.1}
.mult .big small{font-family:var(--mono);font-size:10px;color:var(--muted2);font-weight:400;margin-left:4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2);text-align:left;font-weight:400;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl td.r,.tbl th.r{text-align:right}
.pr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.pr:last-child{border-bottom:0}
.pr .nm{flex:1;font-size:14px}
.pr .v{font-family:var(--display);font-weight:600;font-size:16px}
.pr .d{font-family:var(--mono);font-size:10.5px;color:var(--muted2);width:54px;text-align:right}

/* history */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;justify-content:start}
.heat i{width:14px;height:14px;border-radius:3px;background:#141414;display:block}
.heat i.l1{background:rgba(57,255,136,.25)}.heat i.l2{background:rgba(57,255,136,.5)}.heat i.l3{background:rgba(57,255,136,.78)}.heat i.l4{background:var(--neon);box-shadow:0 0 6px rgba(57,255,136,.6)}
.heat i.today{outline:1px solid var(--muted)}
.heat-leg{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;color:var(--muted2);margin-top:8px}
.heat-leg i{width:10px;height:10px;border-radius:2px;display:block}
.hist-it{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.hist-it>button{width:100%;text-align:left;padding:12px 14px;display:flex;gap:12px;align-items:center}
.hist-it .dt{width:44px;flex:none;text-align:center}
.hist-it .dt b{display:block;font-family:var(--display);font-size:22px;font-weight:600;line-height:1}
.hist-it .dt span{font-family:var(--mono);font-size:10px;color:var(--muted2);text-transform:uppercase}
.hist-it .sm{flex:1;min-width:0}
.hist-it .sm b{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-it .sm span{font-family:var(--mono);font-size:10.5px;color:var(--muted2)}
.hist-body{padding:0 14px 12px;border-top:1px solid var(--line)}
.hist-ex{padding:10px 0;border-bottom:1px solid var(--line)}
.hist-ex b{font-weight:500;font-size:14px}
.hist-ex div{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:3px;line-height:1.7}
.f-mark{color:var(--warn)}

/* rest timer */
.rest{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 10px);z-index:25;max-width:536px;margin:0 auto;background:#0d0d0d;border:1px solid var(--neon-d);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.7),0 0 24px rgba(57,255,136,.12);overflow:hidden}
.rest .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--neon);box-shadow:0 0 10px var(--neon)}
.rest .t{font-family:var(--display);font-size:28px;font-weight:600;color:var(--neon);min-width:76px;letter-spacing:-.02em}
.rest .l{line-height:1.3;flex:1;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.rest.done{border-color:var(--warn);animation:pulse .8s ease-in-out 3}
.rest.done .t{color:var(--warn)}
@keyframes pulse{50%{box-shadow:0 0 30px rgba(255,166,48,.5)}}

/* toast */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-140%);z-index:60;background:#0f0f0f;border:1px solid var(--neon-d);border-radius:12px;padding:10px 16px;font-size:13.5px;max-width:calc(100% - 32px);transition:transform .25s;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.toast.on{transform:translate(-50%,0)}

/* lock */
.lock{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;max-width:420px;margin:0 auto;padding:32px 20px calc(32px + env(safe-area-inset-bottom))}
.lock .hero{margin-bottom:26px}
.lock .hero svg.fig{width:150px;height:auto;margin:0 0 6px -14px}
.lock h1{font-family:var(--display);font-size:44px;font-weight:600;letter-spacing:-.04em;line-height:1}
.lock h1 .d{color:var(--neon);text-shadow:0 0 18px var(--neon)}
.lock p.sub{color:var(--muted);margin-top:8px;font-size:14px}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.field .help{font-size:12px;color:var(--muted2)}
.check{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);margin:4px 0 16px}
.check input{width:18px;height:18px;accent-color:var(--neon)}
.err-msg{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
.empty{color:var(--muted2);text-align:center;padding:28px 10px;font-size:14px}
.note{font-size:12.5px;color:var(--muted2)}
.how{display:grid;gap:10px;font-size:13.5px;color:#cfcfcf}
.how b{color:var(--text)}
.auth-links{display:flex;justify-content:space-between;gap:8px;margin-top:10px}
.ok-msg{color:var(--neon);font-size:13.5px;margin-top:8px}
.steps{display:grid;gap:10px;margin:0 0 14px;padding-left:20px;font-size:13.5px;color:#cfcfcf}
.steps li::marker{color:var(--neon);font-family:var(--mono)}
.steps b{color:var(--text)}
pre.code{font-variant-ligatures:none;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:10px;font-family:var(--mono);font-size:10.5px;line-height:1.5;overflow:auto;color:#bdbdbd;margin-top:6px}
textarea{min-height:120px;font-family:var(--mono);font-size:12px}
#rest-l{text-transform:none;letter-spacing:.02em;font-size:11.5px;color:var(--text)}
</style>
</head>
<body>

</div>

<!-- APLIKACE -->

  <button data-view="body"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M7.5 9a6.5 6.5 0 0 1 9 0l-2.6 3.2a2.4 2.4 0 0 0-3.8 0z"/></svg>Tělo</button>
</div></nav>

<div class="rest hidden" id="rest">
  <div class="bar" id="rest-bar"></div>
  <div class="t" id="rest-t">0:00</div>

</div>

<div class="sheet-bg" id="sheet-bg"></div>

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const now = () => Date.now();
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const fmt = (n, d = 1) => n == null ? '–' : String(+(+n).toFixed(d)).replace('.', ',');
const fmtInt = n => Math.round(n).toLocaleString('cs-CZ');
const DAY = 864e5;
const pl = (n, a, b, c) => `${n} ${n === 1 ? a : n >= 2 && n <= 4 ? b : c}`;
const dShort = d => new Date(d).toLocaleDateString('cs-CZ', { day: 'numeric', month: 'numeric' });
const dLong = d => new Date(d).toLocaleDateString('cs-CZ', { weekday: 'long', day: 'numeric', month: 'long' });
const localISO = (t = now()) => { const d = new Date(t); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
const startOfDay = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const startOfWeek = t => { const d = new Date(startOfDay(t)); const wd = (d.getDay() + 6) % 7; return d.getTime() - wd * DAY; };
const ls = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} }, del(k) { try { localStorage.removeItem(k); } catch {} } };

function blank() { return { v: 1, w: [], cx: [], notes: [], photos: [], body: [], set: setDefaults(), setU: 0 }; }
const getNote = id => ((S.notes || []).find(n => n.id === id) || {}).t || '';
function setNote(id, t) { S.notes = S.notes || []; let n = S.notes.find(x => x.id === id); if (!n) { n = { id }; S.notes.push(n); } n.t = t; n.u = now(); dirty.notes.add(id); commit(); }
function allEx() { return [...EX, ...(S ? S.cx.filter(c => !c.del) : [])]; }
function getEx(id) { return allEx().find(e => e.id === id) || (S && S.cx.find(c => c.id === id)) || { id, n: 'Neznámý cvik', g: 'Core', eq: 'bw', lo: 8, hi: 12, m: [], m2: [] }; }
function incOf(ex) { return ex.inc ?? (S.set.inc && S.set.inc[ex.eq]) ?? EQ[ex.eq]?.inc ?? 2.5; }
function unitOf(ex) { return ex.unit === 's' ? 's' : ex.unit === 'm' ? 'm' : 'opak.'; }
const unitHead = ex => ({ s: 'sek.', m: 'metry' })[ex.unit] || 'opak.';
const isBW = ex => ex.eq === 'bw' || ex.eq === 'cardio';
function liveWorkouts() { return S.w.filter(w => !w.del); }
function openWorkout() { return liveWorkouts().filter(w => w.open).sort((a, b) => b.d.localeCompare(a.d))[0] || null; }
function doneWorkouts() { return liveWorkouts().filter(w => !w.open).sort((a, b) => b.d.localeCompare(a.d)); }
function touch(w) { w.u = now(); dirty.w.add(w.id); }
const rirOf = s => s.q == null ? 2 : s.q;

const DIFF = [

/* ═══════════════════════════════════════════════════════════════

function sessions(exId, excludeId) {

   – váhu přidat, až zvládneš horní hranici s rezervou (≈ 1–2 opakování navíc), krok 2–10 % (ACSM 2009)
   – horní hranice dosažená až v selhání se musí potvrdit dalším tréninkem
   – selhání není nutné: hypertrofie roste blíž k selhání, síla skoro nezávisle (Refalo 2023, Robinson 2024)

  if (!H.length) return { kind: 'new', w: null, r: lo, n: 3, head: `${lo}–${hi} ${u}`, txt: `První záznam. Zvol váhu, se kterou dáš ${lo}–${hi} ${u} a zbudou ti 2–3 v rezervě.` };

  let n = Math.max(2, Math.min(6, last.length));

  const prevHit = prevTop.length > 0 && Math.min(...prevTop.map(s => s.r)) >= hi;

    if (minR >= hi && (!fails || prevHit)) return out('up', inc, lo, `Všechny série na ${hi}+ ${u} → přidej zátěž ${fmt(inc, 2)} kg (opasek, vesta, jednoručka).`);
    if (minR >= hi) return out('hold', 0, hi, `${hi} ${u} jsi dal, ale do selhání – potvrď to ještě jednou s rezervou, pak přidáme zátěž.`);

  }

  const need = hi + (big ? 2 : 0);

    if (fails && !prevHit) return out('hold', W, hi, `${hi} ${u} jsi dal, ale na selhání. Potvrď to ještě jednou s rezervou aspoň 1 opakování – pak přidáme váhu.`);
    return out('up', W + inc, lo, `Horní hranici jsi zvládl${fails ? ' už podruhé' : ' s rezervou'} → přidej ${fmt(inc, 2)} kg (+${Math.round(inc / W * 100)} %) a začni od ${lo} ${u}.`);
  }

}

function mountProg() {
  const el = $('#chart'); if (!el) return;
  const ex = getEx(ui.progEx);
  const H = sessions(ex.id).slice().reverse();
  const m = ui.progMetric;
  const pts = H.map(h => {
    const f = h.sets.some(s => s.q === 0);
    const x = new Date(h.d).getTime();
    if (m === 'e1') return { x, y: bestE1(h.sets), f, tip: h.sets.length + ' sérií' };
    if (m === 'top') { const t = h.sets.reduce((a, s) => s.w > a.w || (s.w === a.w && s.r > a.r) ? s : a, h.sets[0]); return { x, y: t.w, f, tip: `× ${t.r}` }; }
    if (m === 'vol') return { x, y: h.sets.reduce((a, s) => a + s.w * s.r, 0), f, tip: h.sets.length + ' sérií' };
    if (m === 'reps') return { x, y: Math.max(...h.sets.map(s => s.r)), f };
    return { x, y: h.sets.reduce((a, s) => a + s.r, 0), f, tip: h.sets.length + ' sérií' };
  }).filter(p => p.y > 0);
  lineChart(el, pts, m === 'reps' || m === 'tot' ? unitOf(ex) : 'kg');
}

const HOWTO = `<div class="card how">
  <p><b>Dvojitá progrese.</b> V rozsahu opakování nejdřív přidáváš opakování, váhu až nad horní hranicí. Přidávat opakování i váhu vede k podobnému růstu svalů (Plotkin a kol., 2022).</p>
  <p><b>Kdy přidat váhu.</b> Až všechny série zvládneš na horní hranici s rezervou – zhruba 1–2 opakování navíc. Krok 2–10 % (ACSM, 2009). Když by krok byl víc než 10 % (malé jednoručky), aplikace chce nejdřív o 2 opakování víc.</p>
  <p><b>Ne každý trénink.</b> Když horní hranici dáš až v selhání, musíš ji potvrdit ještě jednou. Po slabším dni (−5 % a víc) se nepřidává. U pokročilých jsou přírůstky pomalejší – to je normální.</p>
  <p><b>Náročnost série.</b> Po každé sérii vybereš, jak byla těžká: Lehká (4+ opakování v rezervě), Střední (3), Těžká (2), Na hraně (1), Selhání. Z toho se počítá odhad 1RM a plánuje přetížení – lehké série posunou váhu rychleji, série na hraně a v selhání ji drží. Odhad rezervy je u zkušenějších přesnější a nejlepší je těsně u selhání (Zourdos a kol., 2016).</p>
  <p><b>Selhání není nutné.</b> Pro růst svalů pomáhá končit blízko selhání, samotné selhání přidá jen málo; síla na blízkosti k selhání skoro nezávisí (Refalo a kol., 2023; Robinson a kol., 2024). Proto cíl RIR 1–2 u těžkých cviků.</p>
  <p><b>Stagnace.</b> Tři tréninky bez zlepšení a se selháním = lehčí týden (~90 % váhy, o sérii méně), ne pauza – úplná týdenní pauza v jedné studii mírně snížila nárůst síly (Coleman a kol., 2024; Bell a kol., 2023).</p>
  <p><b>Objem.</b> Víc sérií týdně = víc růstu, s klesajícím přínosem (Pelland a kol., 2024). Orientačně 10–20 sérií na partii týdně.</p>
  <p class="note"><a href="https://peerj.com/articles/14142" target="_blank" rel="noopener">Plotkin 2022</a> · <a href="https://pubmed.ncbi.nlm.nih.gov/19204579/" target="_blank" rel="noopener">ACSM 2009</a> · <a href="https://openrepository.aut.ac.nz/items/78679612-6ff4-4d00-95d1-7920d072a760" target="_blank" rel="noopener">Refalo 2023</a> · <a href="https://doi.org/10.1007/s40279-024-02069-2" target="_blank" rel="noopener">Robinson 2024</a> · <a href="https://pubmed.ncbi.nlm.nih.gov/38274324/" target="_blank" rel="noopener">Coleman 2024</a> · <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511399/" target="_blank" rel="noopener">Bell 2023</a> · <a href="https://sportrxiv.org/index.php/server/preprint/view/460" target="_blank" rel="noopener">Pelland 2024</a></p>
</div>`;

function startWorkout(exId) {
  const w = { id: uid(), d: localISO(), open: true, it: [], u: now() };
  S.w.push(w); touch(w);
  if (exId) w.it.push({ ex: exId, s: newSetsFor(getEx(exId), w) });
  view = 'train'; commit(true); keepAwake(); scrollTo(0, 0);
}
function finishWorkout() {
  const w = openWorkout(); if (!w) return;
  const prev = {};
  w.it.forEach(i => { prev[i.ex] = Math.max(0, ...sessions(i.ex, w.id).map(h => bestE1(h.sets))); });
  w.it.forEach(i => { i.s = doneSets(i); });
  w.it = w.it.filter(i => i.s.length);
  if (!w.it.length) { if (!confirm('Žádná série není odškrtnutá. Zahodit trénink?')) { return; } w.del = true; touch(w); commit(true); return; }
  w.open = false; w.end = Math.max(now(), new Date(w.d).getTime()); touch(w);
  const prs = w.it.filter(i => prev[i.ex] > 0 && bestE1(i.s) > prev[i.ex]).map(i => ({ n: getEx(i.ex).n, e: bestE1(i.s), p: prev[i.ex] }));
  restEnd = 0; ui.rate = null; $('#rest').classList.add('hidden');
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  commit(true); flush();
  summarySheet(w.id, prs);
  vib(prs.length ? [40, 60, 40, 60, 80] : 20);
}

/* ═══════════════════════════════════════════════════════════════

const RULES = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /users/{uid}/{document=**} {
      allow read, write: if request.auth != null && request.auth.uid == uid;
    }
    match /usernames/{name} {
      allow get: if true;
      allow list, update, delete: if false;
      allow create: if request.auth != null
        && request.resource.data.uid == request.auth.uid
        && request.resource.data.email == request.auth.token.email;
    }
  }
}`;
let authMode = 'login';
function authHtml(msg = '', ok = '') {
  const err = `<div class="err-msg" id="a-err">${esc(msg)}</div>${ok ? `<div class="ok-msg">${ok}</div>` : ''}`;
  if (!fbConfig()) return `<h2 class="sec" style="margin-top:0">Jednorázové nastavení</h2>
    <ol class="steps">
      <li>Na <a href="https://console.firebase.google.com/" target="_blank" rel="noopener">console.firebase.google.com</a> založ projekt (Analytics nepotřebuješ).</li>
      <li><b>Build → Authentication → Get started</b> → zapni <b>Email/Password</b>.</li>
      <li>V <b>Authentication → Settings → Authorized domains</b> přidej <span class="mono">vladaczech.github.io</span>.</li>
      <li><b>Build → Firestore Database → Create database</b> (lokace eur3) a v záložce <b>Rules</b> vlož pravidla níže a dej Publish.</li>
      <li><b>Project settings → Your apps → Web (&lt;/&gt;)</b> → zaregistruj aplikaci a zkopíruj <span class="mono">firebaseConfig</span> sem.</li>
    </ol>
    <pre class="code" id="rules">${esc(RULES)}</pre>
    <button class="btn sm" type="button" data-auth="copyrules" style="margin:8px 0 18px">Kopírovat pravidla</button>
    <form id="auth-form" data-mode="setup">
      <div class="field"><label for="a-cfg">firebaseConfig</label><textarea id="a-cfg" placeholder="const firebaseConfig = { apiKey: &quot;…&quot;, authDomain: &quot;…&quot;, projectId: &quot;…&quot;, … };"></textarea></div>
      <button class="btn p big wide" type="submit">Uložit a pokračovat</button>${err}
    </form>`;
  if (authMode === 'register') return `<form id="auth-form" data-mode="register" autocomplete="on">
      <div class="field"><label for="a-user">Jméno</label><input id="a-user" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="např. vlada" required></div>
      <div class="field"><label for="a-email">E-mail</label><input id="a-email" name="email" type="email" autocomplete="email" placeholder="pro obnovu hesla" required></div>
      <div class="field"><label for="a-pw">Heslo</label><input id="a-pw" name="password" type="password" autocomplete="new-password" minlength="6" placeholder="aspoň 6 znaků" required></div>
      <div class="field"><label for="a-pw2">Heslo znovu</label><input id="a-pw2" type="password" autocomplete="new-password" minlength="6" required></div>
      <button class="btn p big wide" type="submit">Vytvořit účet</button>${err}
      <div class="auth-links"><button type="button" class="btn ghost sm" data-auth="login">← Mám účet</button></div>
    </form>`;
  if (authMode === 'reset') return `<form id="auth-form" data-mode="reset" autocomplete="on">
      <p class="note" style="margin-bottom:12px">Pošleme ti e-mail s odkazem, přes který si nastavíš nové heslo.</p>
      <div class="field"><label for="a-user">Jméno nebo e-mail</label><input id="a-user" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></div>
      <button class="btn p big wide" type="submit">Poslat odkaz</button>${err}
      <div class="auth-links"><button type="button" class="btn ghost sm" data-auth="login">← Zpět na přihlášení</button></div>
    </form>`;
  return `<form id="auth-form" data-mode="login" autocomplete="on">
      <div class="field"><label for="a-user">Jméno</label><input id="a-user" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="jméno nebo e-mail" required></div>
      <div class="field"><label for="a-pw">Heslo</label><input id="a-pw" name="password" type="password" autocomplete="current-password" required></div>
      <label class="check"><input type="checkbox" id="a-rem" checked> Zůstat přihlášen</label>
      <button class="btn p big wide" type="submit">Přihlásit</button>${err}
      <div class="auth-links"><button type="button" class="btn ghost sm" data-auth="reset">Zapomenuté heslo?</button><button type="button" class="btn ghost sm" data-auth="register">Vytvořit účet</button></div>
    </form>`;
}

document.addEventListener('submit', async e => {

(function init() {
  requestAnimationFrame(animLoop);
  const cfg = fbConfig();
  if (!window.firebase) { showLock('Nepodařilo se načíst Firebase – jsi online?'); return; }
  if (!cfg) { showLock(); return; }
  try {
    firebase.initializeApp(cfg);
    auth = firebase.auth(); auth.languageCode = 'cs';
    db = firebase.firestore();
    db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
  } catch (e) { ls.del(K_FB); showLock('Chybná konfigurace Firebase: ' + e.message); return; }
  showLoading();
  auth.onAuthStateChanged(u => {
    unsubs.forEach(f => f()); unsubs = [];
    if (u) { USER = u; S = blank(); subscribe(); }
    else { USER = null; PROFILE = null; S = null; closeSheet(); restEnd = 0; authMode = 'login'; showLock(); }
  });
})();
