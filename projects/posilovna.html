function startWorkout(exId) {
  const w = { id: uid(), d: localISO(), open: true, it: [], u: now() };
  S.w.push(w); touch(w);
  if (exId) w.it.push({ ex: exId, s: newSetsFor(getEx(exId), w) });
  view = 'train'; commit(true); keepAwake(); scrollTo(0, 0);
}
function finishWorkout() {
  const w = openWorkout(); if (!w) return;
  const prev = {};
  w.it.forEach(i => { prev[i.ex] = Math.max(0, ...sessions(i.ex, w.id).map(h => bestE1(h.sets))); });
  w.it.forEach(i => { if (isCardio(getEx(i.ex))) cdAutoSave(i); delete i.t0; delete i.acc; delete i.sp; i.s = doneSets(i); });
  w.it = w.it.filter(i => i.s.length);
  if (!w.it.length) { if (!confirm('Žádná série není odškrtnutá. Zahodit trénink?')) { return; } w.del = true; touch(w); commit(true); return; }
  w.open = false; w.end = Math.max(now(), new Date(w.d).getTime()); delete w.orig; touch(w);
  const prs = w.it.filter(i => prev[i.ex] > 0 && bestE1(i.s) > prev[i.ex]).map(i => ({ n: getEx(i.ex).n, e: bestE1(i.s), p: prev[i.ex] }));
  restEnd = 0; ui.rate = null; $('#rest').classList.add('hidden');
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  commit(true); flush();
  summarySheet(w.id, prs);
  vib(prs.length ? [40, 60, 40, 60, 80] : 20);
}
const RPE_L = ['', 'Skoro nic', 'Velmi lehké', 'Lehké', 'Lehké až střední', 'Střední', 'Střední až těžké', 'Těžké', 'Velmi těžké', 'Skoro maximum', 'Maximum'];
const rpeColor = v => v <= 4 ? '#5cf2c2' : v <= 6 ? '#39ff88' : v === 7 ? '#d4ff3a' : v === 8 ? '#ffa630' : '#ff4d6d';
const rpeLabel = v => v ? `<b style="color:${rpeColor(v)}">${v}/10 · ${RPE_L[v]}</b>${v >= 9 ? ' – příští návrh tréninku bude o sérii kratší, pokud přijde do 36 hodin.' : ''}` : 'Celkový pocit z tréninku (RPE 1–10). Pomáhá plánovat další zátěž.';
function summarySheet(wid, prs = []) {
  const w = S.w.find(x => x.id === wid); if (!w) return;
  const dur = Math.max(1, Math.round((w.end - new Date(w.d).getTime()) / 60000));
  const sets = w.it.reduce((a, i) => a + i.s.length, 0), vol = w.it.reduce((a, i) => a + i.s.reduce((b, x) => b + x.w * x.r, 0), 0);
  const rows = w.it.map(it => {
    const ex = getEx(it.ex), e = bestE1(it.s), prev = sessions(ex.id, w.id)[0], pe = prev ? bestE1(prev.sets) : 0;
    const pct = pe && e ? (e / pe - 1) * 100 : null;
    return `<div class="sum-ex"><span>${esc(ex.n)}</span><small>${it.s.map(x => setTxt(x, ex)).join(' · ')}</small><b class="${pct > .5 ? 'up' : pct < -.5 ? 'dn' : ''}">${pct == null ? (prev ? '=' : 'nový') : (pct > 0 ? '+' : '') + fmt(pct, 1) + ' %'}</b></div>`;
  }).join('');

    ${prs.length ? `<div class="pr-card">${prs.map(x => `<div>🔥 <b>${esc(x.n)}</b> – odhad 1RM ${fmt(x.e, 1)} kg <span class="muted">(+${fmt(x.e - x.p, 1)})</span></div>`).join('')}</div>` : ''}

});

// Bez přibližování dvěma prsty: Android to řídí viewport (user-scalable=no), iOS ho ignoruje, proto se gesto ruší tady

// Pojistka proti přiblížení dvojitým klepnutím (iOS občas ignoruje touch-action, typicky u spodní lišty):
// druhé klepnutí do 350 ms nepustíme k prohlížeči a klik vyvoláme sami – rychlé klepání tak dál funguje
let lastTap = 0, tapStart = null;
document.addEventListener('touchstart', e => { const p = e.touches[0]; tapStart = e.touches.length === 1 ? { x: p.clientX, y: p.clientY, t: e.timeStamp } : null; }, { passive: true });
document.addEventListener('touchend', e => {
  const p = e.changedTouches[0], st = tapStart; tapStart = null;
  // jen opravdové klepnutí (bez posunu prstu), ne konec swipu při scrollování
  const isTap = st && p && Math.hypot(p.clientX - st.x, p.clientY - st.y) < 10 && e.timeStamp - st.t < 300;
  if (!isTap) { lastTap = 0; return; }
  const el = e.target;
  if (e.timeStamp - lastTap < 350 && !(el.closest && el.closest('input,textarea,select,[contenteditable],.cmp'))) {
    e.preventDefault();
    el.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window, clientX: p.clientX, clientY: p.clientY }));
  }
  lastTap = e.timeStamp;
}, { passive: false });

const RULES = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    // správce = dokument admins/{uid}, který jde založit jen ve Firebase konzoli
    function isAdmin() {
      return request.auth != null
        && exists(/databases/$(database)/documents/admins/$(request.auth.uid));
    }
    match /users/{uid}/{document=**} {
      allow read, write: if request.auth != null && request.auth.uid == uid;
    }
    // správce čte jen profil, tréninky a vlastní cviky – fotky, poznámky ani váhu ne
    match /users/{uid} {
      allow read: if isAdmin();
    }
    match /users/{uid}/workouts/{id} {
      allow read: if isAdmin();
    }
    match /users/{uid}/cx/{id} {
      allow read: if isAdmin();
    }
    match /admins/{uid} {
      allow get: if request.auth != null && request.auth.uid == uid;
    }
    // hlášení: každý přihlášený může poslat (pod svým uid), číst a označovat je jen správce
    match /reports/{id} {
      allow create: if request.auth != null && request.resource.data.uid == request.auth.uid;
      allow read, update, delete: if isAdmin();
    }
    match /reportPhotos/{id} {
      allow create: if request.auth != null && request.resource.data.uid == request.auth.uid;
      allow read, delete: if isAdmin();
    }
    match /usernames/{name} {
      allow get: if true;
      allow list, update, delete: if false;
      allow create: if request.auth != null
        && request.resource.data.uid == request.auth.uid
        && request.resource.data.email == request.auth.token.email;
    }
  }
}`;
let authMode = 'login';
function authHtml(msg = '', ok = '') {
  const err = `<div class="err-msg" id="a-err">${esc(msg)}</div>${ok ? `<div class="ok-msg">${ok}</div>` : ''}`;
  if (!fbConfig()) return `<h2 class="sec" style="margin-top:0">Jednorázové nastavení</h2>
    <ol class="steps">
      <li>Na <a href="https://console.firebase.google.com/" target="_blank" rel="noopener">console.firebase.google.com</a> založ projekt (Analytics nepotřebuješ).</li>
      <li><b>Build → Authentication → Get started</b> → zapni <b>Email/Password</b>.</li>
      <li>V <b>Authentication → Settings → Authorized domains</b> přidej <span class="mono">vladacech.cz</span>.</li>
      <li><b>Build → Firestore Database → Create database</b> (lokace eur3) a v záložce <b>Rules</b> vlož pravidla níže a dej Publish.</li>
      <li><b>Project settings → Your apps → Web (&lt;/&gt;)</b> → zaregistruj aplikaci a zkopíruj <span class="mono">firebaseConfig</span> sem.</li>
    </ol>
    <pre class="code" id="rules">${esc(RULES)}</pre>
    <button class="btn sm" type="button" data-auth="copyrules" style="margin:8px 0 18px">Kopírovat pravidla</button>
    <form id="auth-form" data-mode="setup">
      <div class="field"><label for="a-cfg">firebaseConfig</label><textarea id="a-cfg" placeholder="const firebaseConfig = { apiKey: &quot;…&quot;, authDomain: &quot;…&quot;, projectId: &quot;…&quot;, … };"></textarea></div>
      <button class="btn p big wide" type="submit">Uložit a pokračovat</button>${err}
    </form>`;
  if (authMode === 'register') return `<form id="auth-form" data-mode="register" autocomplete="on">
      <div class="field"><label for="a-user">Jméno</label><input id="a-user" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="např. vlada" required></div>
      <div class="field"><label for="a-email">E-mail</label><input id="a-email" name="email" type="email" autocomplete="email" placeholder="pro obnovu hesla" required></div>
      <div class="field"><label for="a-pw">Heslo</label><input id="a-pw" name="password" type="password" autocomplete="new-password" minlength="6" placeholder="aspoň 6 znaků" required></div>
      <div class="field"><label for="a-pw2">Heslo znovu</label><input id="a-pw2" type="password" autocomplete="new-password" minlength="6" required></div>
      <button class="btn p big wide" type="submit">Vytvořit účet</button>${err}
      <p class="note" style="margin-top:10px">Správce aplikace uvidí tvé tréninky kvůli celkovému přehledu. Fotky, poznámky a tělesnou váhu ne.</p>
      <div class="auth-links"><button type="button" class="btn ghost sm" data-auth="login">← Mám účet</button></div>
    </form>`;
  if (authMode === 'reset') return `<form id="auth-form" data-mode="reset" autocomplete="on">
      <p class="note" style="margin-bottom:12px">Pošleme ti e-mail s odkazem, přes který si nastavíš nové heslo.</p>
      <div class="field"><label for="a-user">Jméno nebo e-mail</label><input id="a-user" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></div>
      <button class="btn p big wide" type="submit">Poslat odkaz</button>${err}
      <div class="auth-links"><button type="button" class="btn ghost sm" data-auth="login">← Zpět na přihlášení</button></div>
    </form>`;
  return `<form id="auth-form" data-mode="login" autocomplete="on">
      <div class="field"><label for="a-user">Jméno</label><input id="a-user" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="jméno nebo e-mail" required></div>
      <div class="field"><label for="a-pw">Heslo</label><input id="a-pw" name="password" type="password" autocomplete="current-password" required></div>
      <label class="check"><input type="checkbox" id="a-rem" checked> Zůstat přihlášen</label>
      <button class="btn p big wide" type="submit">Přihlásit</button>${err}
      <div class="auth-links"><button type="button" class="btn ghost sm" data-auth="reset">Zapomenuté heslo?</button><button type="button" class="btn ghost sm" data-auth="register">Vytvořit účet</button></div>
    </form>`;
}
function renderAuth(msg, ok) { $('#auth').innerHTML = authHtml(msg, ok); }
function showLock(msg = '') {
  $('#app').classList.add('hidden'); $('#nav').classList.add('hidden'); $('#rest').classList.add('hidden');
  $('#lock').classList.remove('hidden');
  if (!$('#lock-fig').firstChild) $('#lock-fig').innerHTML = figSvg(EX.find(e => e.id === 'squat'));

}
function showLoading(t = 'Načítám…') { showLock(); $('#auth').innerHTML = `<p class="mono muted" style="font-size:12px;letter-spacing:.1em">${esc(t)}</p>`; }
function showApp() {
  $('#lock').classList.add('hidden'); $('#app').classList.remove('hidden'); $('#nav').classList.remove('hidden');
  syncStatus(navigator.onLine ? 'ok' : 'off');
  render(); keepAwake();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-auth]'); if (!b) return;
  if (b.dataset.auth === 'copyrules') { navigator.clipboard?.writeText(RULES).then(() => toast('Pravidla zkopírována')).catch(() => {}); return; }
  const u = $('#a-user') && $('#a-user').value;
  authMode = b.dataset.auth; renderAuth();
  if (u && $('#a-user')) $('#a-user').value = u;
  $('#auth input')?.focus();

document.addEventListener('submit', async e => {
  if (e.target.id !== 'auth-form') return;
  e.preventDefault();
  const f = e.target, mode = f.dataset.mode, btn = $('button[type=submit]', f), err = $('#a-err');
  const label = btn.textContent; btn.disabled = true; btn.textContent = '…'; err.textContent = '';
  try {
    if (mode === 'setup') {
      const txt = $('#a-cfg').value, cfg = {};
      for (const m of txt.matchAll(/["']?(\w+)["']?\s*:\s*["']([^"']+)["']/g)) cfg[m[1]] = m[2];
      if (!cfg.apiKey || !cfg.projectId || !cfg.appId) throw new Error('V textu chybí apiKey, projectId nebo appId – zkopíruj celý firebaseConfig.');
      ls.set(K_FB, JSON.stringify(cfg)); location.reload(); return;
    }
    if (mode === 'login') {
      await auth.setPersistence($('#a-rem').checked ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION);
      const email = await emailFor($('#a-user').value);
      await auth.signInWithEmailAndPassword(email, $('#a-pw').value);
      showLoading();
    } else if (mode === 'register') {
      if ($('#a-pw').value !== $('#a-pw2').value) throw new Error('Hesla se neshodují.');
      await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
      await register($('#a-user').value, $('#a-email').value, $('#a-pw').value);
      showLoading();
    } else if (mode === 'reset') {
      const email = await emailFor($('#a-user').value);
      await auth.sendPasswordResetEmail(email);
      renderAuth('', `Odkaz na obnovu hesla odešel na <b>${esc(maskEmail(email))}</b>. Zkontroluj i spam, pak se přihlas novým heslem.`);
      return;
    }
  } catch (er) {
    const m = er.code ? fbErr(er) : er.message;
    if ($('#a-err')) $('#a-err').textContent = m; else renderAuth(m);
  } finally { if (btn.isConnected) { btn.disabled = false; btn.textContent = label; } }
});

(function init() {
  requestAnimationFrame(animLoop);
  const cfg = fbConfig();
  if (!window.firebase) { showLock('Nepodařilo se načíst Firebase – jsi online?'); return; }
  if (!cfg) { showLock(); return; }
  try {
    firebase.initializeApp(cfg);
    auth = firebase.auth(); auth.languageCode = 'cs';
    db = firebase.firestore();
    db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
  } catch (e) { ls.del(K_FB); showLock('Chybná konfigurace Firebase: ' + e.message); return; }
  showLoading();
  auth.onAuthStateChanged(u => {
    unsubs.forEach(f => f()); unsubs = [];
    if (u) { USER = u; S = blank(); subscribe(); }
    else { USER = null; PROFILE = null; S = null; IS_ADMIN = false; ADM.users = null; ADM.sel = null; $('#btn-adm').classList.add('hidden'); closeSheet(); restEnd = 0; authMode = 'login'; showLock(); }
  });
})();
