<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<link rel="apple-touch-icon" id="ico-apple" href="./posilovna-icons/posilovna-neon-180.png">
<link rel="icon" id="ico-png" type="image/png" sizes="192x192" href="./posilovna-icons/posilovna-neon-192.png">
<link rel="manifest" id="ico-mf" href="./posilovna-icons/posilovna-neon.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Posilovna">
<title>Posilovna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050505;--panel:#0b0b0b;--panel2:#111;--line:#1b1b1b;--line2:#292929;
  --text:#ececec;--muted:#8d8d8d;--muted2:#5c5c5c;
  --neon:#39ff88;--neon-rgb:57,255,136;--neon-d:#1d7d46;--neon-dd:#1d3a28;--on-neon:#03170a;--neon-g:rgba(var(--neon-rgb),.12);
  --warn:#ffa630;--bad:#ff4d6d;--cyan:#3ee6ff;--acc2:#3ee6ff;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;--sans:'Inter',system-ui,sans-serif;--display:'Space Grotesk','Inter',sans-serif;
  --nav:62px;--r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{background:var(--bg);color-scheme:dark}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45;min-height:100dvh;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(700px 420px at 90% -10%,rgba(var(--neon-rgb),.08),transparent 65%);z-index:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:16px;outline:none;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--neon);box-shadow:0 0 0 3px var(--neon-g)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
a{color:var(--neon)}
.hidden{display:none!important}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 16px calc(var(--nav) + env(safe-area-inset-bottom) + 96px)}
header.top{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 0 12px;background:linear-gradient(var(--bg) 70%,transparent)}
.brand{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);flex:1}
.brand b{color:var(--neon);text-shadow:0 0 10px rgba(var(--neon-rgb),.7);font-weight:700}
.cursor{color:var(--neon);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sync{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;color:var(--muted2);letter-spacing:.06em}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted2);flex:none}
.dot.ok{background:var(--neon);box-shadow:0 0 8px var(--neon)}
.dot.pend{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.dot.err{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted)}
.icon-btn:active{border-color:var(--neon);color:var(--neon)}
.icon-btn.on{color:var(--neon);border-color:var(--neon-d)}
.kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--neon)}
h1.title{font-family:var(--display);font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1.02;margin:6px 0 18px}
h1.title .d{color:var(--neon);text-shadow:0 0 16px var(--neon)}
h2.sec{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;display:flex;align-items:center;gap:10px}
h2.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:grid;gap:10px}
.row{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);font-family:var(--mono);font-size:12.5px;letter-spacing:.04em;color:var(--text);white-space:nowrap}
.btn:active{border-color:var(--neon);color:var(--neon)}
.btn.p{background:var(--neon);border-color:var(--neon);color:var(--on-neon);font-weight:700;box-shadow:0 0 22px rgba(var(--neon-rgb),.25)}
.btn.p:active{color:var(--on-neon);filter:brightness(1.1)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad);border-color:rgba(255,77,109,.35)}
.btn.wide{width:100%}
.btn.big{min-height:58px;font-size:14px;border-radius:16px}
.btn.sm{min-height:34px;padding:0 12px;font-size:11.5px;border-radius:10px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 -16px;padding:0 16px 2px}
.chips::-webkit-scrollbar{display:none}
.chips.wrapc{flex-wrap:wrap;margin:0;padding:0;overflow:visible}
.chip{flex:none;padding:7px 12px;border-radius:999px;border:1px solid var(--line2);font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.chip.on{color:var(--on-neon);background:var(--neon);border-color:var(--neon);font-weight:700}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.seg button.on{background:#1a1a1a;color:var(--neon);box-shadow:inset 0 0 0 1px var(--neon-d)}

/* nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav)}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2)}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--neon)}
nav button.on svg{filter:drop-shadow(0 0 6px rgba(var(--neon-rgb),.8))}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .v{font-family:var(--display);font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.stat .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);margin-top:4px}
.recency{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rec{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.rec b{font-weight:500;font-size:13.5px}
.rec span{font-family:var(--mono);font-size:11px;color:var(--muted2)}
.rec.due{border-color:var(--neon-d)}
.rec.due span{color:var(--neon)}

/* workout */
.wo-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px}
.wo-head .timer{font-family:var(--display);font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1;color:var(--neon);text-shadow:0 0 18px rgba(var(--neon-rgb),.45)}
.wo-head input{width:auto;flex:1;font-size:13px;padding:8px 10px;font-family:var(--mono);color:var(--muted)}
.exc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.exc-h{display:flex;align-items:center;gap:10px}
.exc-h .fig-mini{width:54px;height:48px;flex:none;border-radius:10px;background:#080808;border:1px solid var(--line)}
.exc-h .nm{flex:1;min-width:0}
.exc-h .nm b{display:block;font-family:var(--display);font-weight:500;font-size:17px;line-height:1.2}
.exc-h .nm span{font-family:var(--mono);font-size:10.5px;color:var(--muted2);letter-spacing:.06em}
.reco{margin-top:10px;border-radius:12px;padding:10px 12px;background:rgba(var(--neon-rgb),.05);border:1px solid rgba(var(--neon-rgb),.18)}
.reco .rt{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.reco .rt .k{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--neon)}
.reco .rt b{font-family:var(--display);font-size:18px;font-weight:600}
.reco p{font-size:12.5px;color:var(--muted);margin-top:3px}
.reco.down{background:rgba(255,166,48,.06);border-color:rgba(255,166,48,.25)}
.reco.down .rt .k{color:var(--warn)}
.reco.new{background:var(--panel2);border-color:var(--line2)}
.reco.new .rt .k{color:var(--muted)}
.last{font-family:var(--mono);font-size:11px;color:var(--muted2);margin-top:8px}
.sets{margin-top:10px;display:grid;gap:6px}
.set-h,.set{display:grid;grid-template-columns:20px minmax(54px,1fr) minmax(46px,.8fr) auto 42px;gap:6px;align-items:center}
.sets.nokg .set-h,.sets.nokg .set{grid-template-columns:20px minmax(80px,1fr) auto 42px}
.kgb{margin-left:auto;flex:0 0 auto!important;font-size:11px;color:var(--muted)}
.set-h{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2)}
.set .n{font-family:var(--mono);font-size:12px;color:var(--muted2);text-align:center}
.set input{padding:9px 6px;text-align:center;font-family:var(--mono);font-size:16px;border-radius:9px}
.set:not(.ok) input{color:var(--muted)}
.chk{width:42px;height:38px;border-radius:9px;border:1px solid var(--line2);display:grid;place-items:center;color:var(--muted2)}
.set.ok .chk{background:var(--neon);border-color:var(--neon);color:var(--on-neon);box-shadow:0 0 14px rgba(var(--neon-rgb),.35)}
.set.ok .n{color:var(--neon)}
.set-actions{display:flex;gap:6px;margin-top:8px}
.set-actions .btn{flex:1}
.chg{font-size:12.5px;color:var(--muted);margin-top:4px;font-family:var(--mono)}
.chg span{color:var(--muted2)}
.chg b{color:var(--neon);font-weight:500}
.reco.down .chg b{color:var(--warn)}
.xnote{margin-top:8px;font-size:13px;color:#d9d9d9;padding:8px 10px;border-left:2px solid var(--neon-d);background:var(--panel2);border-radius:0 8px 8px 0}
.xnote span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2)}
.ctabs{display:flex;gap:6px;margin-top:8px}
.ctabs button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--muted)}
.ctabs button.on{color:var(--neon);border-color:var(--neon-d);background:rgba(var(--neon-rgb),.05)}
.cpanel{margin-top:8px;padding:10px;border-radius:12px;background:#080808;border:1px solid var(--line)}
.exc textarea,.cpanel textarea{min-height:56px;font-family:var(--sans);font-size:15px}
.xh-list{display:grid}
.xh{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.xh:last-child{border-bottom:0}
.xh-d{width:46px;flex:none;font-family:var(--mono);font-size:12px;color:var(--text)}
.xh-d span{display:block;font-size:10px;color:var(--muted2)}
.xh-b{flex:1;min-width:0}
.xh-s{font-family:var(--mono);font-size:13px;line-height:1.5;word-break:break-word}
.xh-m{font-family:var(--mono);font-size:10.5px;color:var(--muted2);margin-top:2px}
.xh-m .up{color:var(--neon)}.xh-m .dn{color:var(--warn)}.xh-m .eqm{color:var(--muted)}
.xh-n{font-size:12.5px;color:var(--muted);font-style:italic;margin-top:3px}
.legend-rir{font-size:11px;color:var(--muted2);margin-top:8px;font-family:var(--mono)}

/* náročnost série */
.set-h,.set{grid-template-columns:22px minmax(48px,1fr) minmax(42px,.8fr) 76px 42px}
.diff{height:38px;border-radius:9px;border:1px dashed var(--line2);font-family:var(--mono);font-size:10px;letter-spacing:.02em;color:var(--muted2);padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .15s}
.diff.on{border:1px solid var(--dc);color:var(--dc);background:color-mix(in srgb,var(--dc) 11%,transparent);font-weight:700}
.diff.open{border-style:solid;border-color:var(--text);color:var(--text)}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:0 0 4px;animation:pop .18s ease-out}
.rate button{position:relative;overflow:hidden;border:1px solid var(--line2);border-radius:10px;padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;background:#0d0d0d}
.rate button::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--dc);box-shadow:0 0 8px var(--dc)}
.rate button b{font-size:11.5px;font-weight:600;color:var(--text);white-space:nowrap}
.rate button span{font-family:var(--mono);font-size:8.5px;color:var(--muted2);line-height:1.2;text-align:center}
.rate button.on{border-color:var(--dc);background:color-mix(in srgb,var(--dc) 14%,transparent)}
.rate button:active{transform:scale(.96)}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}}
.prb{display:inline-block;font-size:8.5px;color:var(--on-neon);background:var(--neon);padding:2px 3px;border-radius:4px;font-family:var(--mono);box-shadow:0 0 10px rgba(var(--neon-rgb),.7);animation:pop .3s ease-out}
.qd{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--dc);margin-left:3px;vertical-align:middle;box-shadow:0 0 5px var(--dc)}
.dq{font-family:var(--mono);font-size:11px;color:var(--dc)}
/* kotouče, rozcvičení */
.plates{display:flex;align-items:center;gap:3px;flex-wrap:wrap;margin-top:8px;font-family:var(--mono);font-size:10.5px;color:var(--muted2)}
.plates>span{margin-right:4px}
.plates em{font-style:normal;margin-left:6px}
.pl{display:inline-grid;place-items:center;width:20px;border-radius:3px;font-size:8px;font-weight:700;color:#0a0a0a;font-style:normal}
.p25{height:34px;background:#e2463b}.p20{height:30px;background:#3d8bff}.p15{height:26px;background:#f2d23a}.p10{height:22px;background:#37c871}.p5{height:18px;background:#e8e8e8}.p2_5{height:15px;background:#8a8a8a}.p1_25{height:12px;background:#5d5d5d;color:#ddd}
.plates .bar{width:26px;height:4px;background:#9a9a9a;border-radius:2px}
.warm{margin-top:10px;font-size:12px;color:var(--muted2)}
.warm summary{cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);list-style:none}
.warm summary::-webkit-details-marker{display:none}
.warm summary::before{content:"▸ ";color:var(--neon)}
.warm[open] summary::before{content:"▾ "}
.warm div{font-family:var(--mono);font-size:12.5px;color:var(--text);margin:6px 0 2px}
/* menu, toast */
.menu{display:grid;gap:6px;margin-top:14px}
.menu button{text-align:left;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.menu button:active{border-color:var(--neon-d)}
.menu b{display:block;font-weight:500;font-size:15px}
.menu span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.menu .danger b{color:var(--bad)}
.t-undo{margin-left:14px;color:var(--neon);font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;padding:4px 2px;font-weight:700}
/* týdenní cíl */
.goal{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.ringw{position:relative;width:84px;height:84px;flex:none}
.ring{width:84px;height:84px;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:#191919;stroke-width:7}
.ring .prg{fill:none;stroke:var(--neon);stroke-width:7;stroke-linecap:round;filter:drop-shadow(0 0 5px rgba(var(--neon-rgb),.6));transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring-t{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring-t b{display:block;font-family:var(--display);font-size:27px;font-weight:600;line-height:1}
.ring-t span{font-family:var(--mono);font-size:10px;color:var(--muted2)}
.goal-r{flex:1;min-width:0}
.goal-r>b{display:block;font-family:var(--display);font-size:19px;font-weight:600;margin:3px 0 8px}
.days{display:flex;gap:4px;margin-bottom:7px}
.days i{flex:1;text-align:center;font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--muted2);padding:4px 0;border-radius:6px;background:#121212}
.days i.on{background:var(--neon);color:var(--on-neon);font-weight:700;box-shadow:0 0 8px rgba(var(--neon-rgb),.35)}
.days i.today{outline:1px solid var(--muted2);outline-offset:1px}
/* shrnutí */
.sum-hero{position:relative}
.sum-hero h3 .d{color:var(--neon);text-shadow:0 0 16px var(--neon)}
.burst{position:absolute;right:60px;top:26px;width:0;height:0;pointer-events:none}
.burst i{position:absolute;width:5px;height:9px;border-radius:2px;background:var(--neon);box-shadow:0 0 8px var(--neon);opacity:0;animation:burst 1.2s cubic-bezier(.15,.7,.3,1) forwards}
.burst i:nth-child(3n){background:var(--acc2);box-shadow:0 0 8px var(--acc2)}
.burst i:nth-child(4n){background:#d4ff3a}
@keyframes burst{0%{opacity:1;transform:rotate(var(--a)) translateY(0)}100%{opacity:0;transform:rotate(var(--a)) translateY(calc(var(--d) * -1))}}
.pr-card{margin:12px 0 0;padding:12px 14px;border-radius:14px;border:1px solid var(--neon-d);background:rgba(var(--neon-rgb),.06);display:grid;gap:4px;font-size:14px}
.pr-card b{color:var(--neon);font-weight:600}
.sum-ex{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line)}
.sum-ex span{font-size:14px}
.sum-ex small{grid-column:1;font-family:var(--mono);font-size:11px;color:var(--muted2)}
.sum-ex b{grid-row:1/3;grid-column:2;align-self:center;font-family:var(--mono);font-size:13px;color:var(--muted);font-weight:500}
.sum-ex b.up{color:var(--neon)}.sum-ex b.dn{color:var(--warn)}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.rpe button{height:42px;border-radius:8px;border:1px solid var(--line2);font-family:var(--mono);font-size:13px;color:var(--muted);border-bottom:3px solid var(--rc)}
.rpe button.on{background:var(--rc);border-color:var(--rc);color:#050505;font-weight:700;box-shadow:0 0 14px color-mix(in srgb,var(--rc) 50%,transparent)}
.rpe-l{font-size:13px;color:var(--muted);margin:8px 0 12px;min-height:18px}
/* tělo a fotky */
.gal h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);margin:16px 0 8px;font-weight:400}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph{position:relative;display:block;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#111;border:1px solid var(--line);padding:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:6px;bottom:5px;font-family:var(--mono);font-size:9.5px;color:#fff;text-shadow:0 1px 4px #000}
.ph.sel{outline:2px solid var(--neon);outline-offset:2px}
.ph .num{left:auto;right:6px;top:6px;bottom:auto;background:var(--neon);color:var(--on-neon);border-radius:6px;padding:1px 6px;text-shadow:none;font-weight:700;font-size:11px}
.ph.add{display:grid;place-items:center;font-size:22px;color:var(--muted);border-style:dashed;cursor:pointer}
.thumbs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.thumbs .ph{width:68px;flex:none}
.thumbs.mini{margin-top:8px}.thumbs.mini .ph{width:44px;border-radius:8px}
.viewer{position:relative;margin:12px 0;border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--line)}
.viewer img{width:100%;display:block;max-height:66dvh;object-fit:contain}
.pv-load{position:absolute;left:10px;bottom:8px;font-family:var(--mono);font-size:10px;color:var(--muted);background:rgba(0,0,0,.6);padding:3px 7px;border-radius:6px}
.cmp{position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;margin:12px 0 8px;touch-action:none;background:#000;user-select:none;-webkit-user-select:none;cursor:ew-resize}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.cmp .ca{position:absolute;inset:0}
.cmp-line{position:absolute;top:0;bottom:0;width:2px;background:var(--neon);box-shadow:0 0 12px var(--neon);transform:translateX(-1px);pointer-events:none}
.cmp-line::after{content:"⇆";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:var(--neon);color:var(--on-neon);display:grid;place-items:center;font-weight:700;box-shadow:0 0 16px rgba(var(--neon-rgb),.6)}
.cl{position:absolute;top:10px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;background:rgba(0,0,0,.65);padding:4px 7px;border-radius:6px;pointer-events:none}
.cl.l{left:10px}.cl.r{right:10px}
.cmpr{padding:0;accent-color:var(--neon);height:28px;border:0;background:none}
.bwrows .row{padding:4px 0;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12.5px}
.bwrows .row:last-child{border-bottom:0}
label.btn{cursor:pointer}
/* library */
.lib{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.lib-it{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 8px 10px;text-align:left;display:flex;flex-direction:column;gap:6px}
.lib-it:active{border-color:var(--neon-d)}
.lib-it svg.fig{width:100%;height:auto;aspect-ratio:220/192;background:#080808;border-radius:10px}
.lib-it b{font-family:var(--display);font-weight:500;font-size:14.5px;line-height:1.2;padding:0 4px}
.lib-it span{font-family:var(--mono);font-size:10px;color:var(--muted2);padding:0 4px;letter-spacing:.06em}
.search{position:relative;margin-bottom:10px}
.search input{padding-left:36px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted2)}

/* figures */
svg.fig .floor{stroke:#1e1e1e;stroke-width:2}
svg.fig .prop{stroke:#3a3a3a;stroke-width:4;stroke-linecap:round;fill:none}
svg.fig .arr{stroke:var(--neon);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none;opacity:.5;animation:arrp 1.4s ease-in-out infinite}
@keyframes arrp{0%,100%{opacity:.25}50%{opacity:.75}}
svg.fig .propf{fill:#1a1a1a;stroke:#3a3a3a;stroke-width:2}
svg.fig .b{stroke:var(--neon);stroke-width:6;stroke-linecap:round;fill:none}
svg.fig .far .b{stroke:var(--neon-d)}
svg.fig .hd{fill:var(--bg);stroke:var(--neon);stroke-width:5}
svg.fig .glow{filter:drop-shadow(0 0 4px rgba(var(--neon-rgb),.55))}
svg.fig .eq{stroke:#d7d7d7;stroke-width:3;fill:var(--bg);stroke-linecap:round}
svg.fig .eqh{fill:#d7d7d7}
svg.fig .cable{stroke:#6a6a6a;stroke-width:1.5;stroke-dasharray:3 3}
svg.fig .pul{fill:var(--bg);stroke:#6a6a6a;stroke-width:2}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92dvh;overflow:auto;background:#090909;border-top:1px solid var(--line2);border-radius:22px 22px 0 0;transform:translateY(102%);transition:transform .26s cubic-bezier(.2,.8,.2,1);padding:10px 16px calc(24px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.sheet.on{transform:none}
.sheet .in{max-width:560px;margin:0 auto}
.grab{width:42px;height:4px;border-radius:4px;background:#2a2a2a;margin:2px auto 12px}
.sheet h3{font-family:var(--display);font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.pick-list{display:grid;gap:6px;margin-top:10px}
.pick{display:flex;align-items:center;gap:12px;padding:8px;border:1px solid var(--line);border-radius:14px;text-align:left;background:var(--panel)}
.pick svg.fig{width:64px;height:56px;flex:none;background:#080808;border-radius:9px}
.pick b{display:block;font-weight:500;font-size:15px}
.pick span{font-family:var(--mono);font-size:10.5px;color:var(--muted2)}
.big-fig{background:#070707;border:1px solid var(--line);border-radius:18px;padding:6px;margin:12px 0}
.big-fig svg{width:100%;height:auto;display:block}
.mmap svg{width:100%;height:auto;display:block}
.tips{display:grid;gap:8px;margin-top:4px}
.tips li{list-style:none;display:flex;gap:10px;font-size:14px;color:#cfcfcf}
.tips li::before{content:"›";color:var(--neon);font-family:var(--mono);font-weight:700}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mtag{font-family:var(--mono);font-size:10.5px;padding:4px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--muted)}
.mtag.p{border-color:var(--neon-d);color:var(--neon)}

/* charts */
.chart{position:relative;width:100%;touch-action:pan-y}
.chart .bar{fill:var(--neon-d)}.chart .bar.now{fill:var(--neon)}.chart .hov{fill:rgba(255,255,255,.04)}
.adm-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-6px 0 14px;font-size:11px}
.stats .v small.live-dot{font-family:var(--mono);font-size:10px;color:var(--on-neon);background:var(--neon);border-radius:99px;padding:1px 6px;margin-left:6px;vertical-align:middle;box-shadow:0 0 10px rgba(var(--neon-rgb),.6)}
.adm-u,.adm-p{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.adm-u{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.adm-u:active{border-color:var(--neon-d)}
.adm-p{padding:9px 0;border-bottom:1px solid var(--line)}.adm-p:last-of-type{border-bottom:0}
.adm-av{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:600;color:var(--neon);border:1px solid var(--neon-d);background:var(--neon-g)}
.adm-av.live{border-color:var(--neon);box-shadow:0 0 12px rgba(var(--neon-rgb),.55)}
.adm-n{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.adm-n b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adm-n>span{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.adm-n em{font-style:normal;color:var(--neon)}
.spk{width:60px;height:20px;flex:none;display:block}.spk .on{fill:var(--neon-d)}.spk .now{fill:var(--neon)}.spk .off{fill:var(--line2)}
.adm-ch{font-family:var(--mono);font-size:12px;min-width:56px;text-align:right;color:var(--muted)}
.adm-ch.up{color:var(--text)}.adm-ch.up::before{content:'▲ ';color:var(--neon);font-size:9px}
.adm-ch.down{color:var(--text)}.adm-ch.down::before{content:'▼ ';color:#ff4d6d;font-size:9px}
.icon-btn{position:relative}.icon-btn.dot::after{content:'';position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--bg)}
.badge-n{font-family:var(--mono);font-size:10px;letter-spacing:0;color:#fff;background:var(--bad);border-radius:99px;padding:1px 7px}
.rep{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.rep.done{opacity:.6}
.rep-h{display:flex;align-items:center;gap:10px}
.rep-t{font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.rep-k{font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:6px;border:1px solid var(--line2);color:var(--muted);vertical-align:2px;margin-left:4px}
.rep-k.k-bug{color:var(--bad);border-color:rgba(255,77,109,.4)}.rep-k.k-idea{color:var(--neon);border-color:var(--neon-d)}
.rep-ctx summary,.rep-old summary{font-family:var(--mono);font-size:11px;color:var(--muted);cursor:pointer}
.rep-ctx div{display:flex;flex-direction:column;gap:3px;margin-top:6px;font-family:var(--mono);font-size:10.5px;color:var(--muted);word-break:break-all}
.rep-ctx b{color:var(--muted2);font-weight:400;margin-right:4px}
.rep-ph span{position:absolute;left:0;right:0;bottom:0;font-family:var(--mono);font-size:9px;background:rgba(0,0,0,.65);color:#fff;padding:2px;text-align:center}
/* ── Průvodce ── */
html.tour-on,html.tour-on body{overflow:hidden}
.tour{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 14px);max-width:600px;margin:0 auto;box-shadow:0 0 0 100vmax var(--bg)}
.tour-top{display:flex;align-items:center;gap:8px}
.tour-blocks{flex:1;min-width:0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tour-blocks button{flex:none;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2);padding:7px 9px;border-radius:99px;border:1px solid transparent;transition:color .2s,border-color .2s,background .2s}
.tour-blocks button.done{color:var(--muted)}
.tour-blocks button.on{color:var(--neon);border-color:var(--neon-d);background:rgba(var(--neon-rgb),.07)}
.tour-prog{display:flex;gap:3px;margin:10px 0 12px}
.tour-prog i{flex:1;height:3px;border-radius:2px;background:var(--line2);position:relative;overflow:hidden}
.tour-prog i.gap{margin-left:7px}
.tour-prog i.done{background:var(--neon-d)}
.tour-prog i.on::after{content:'';position:absolute;inset:0;background:var(--neon);box-shadow:0 0 8px var(--neon);transform-origin:left;animation:tprog .45s ease-out both}
@keyframes tprog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.tour-stage{flex:1;min-height:250px;position:relative;overflow:hidden;border-radius:20px;border:1px solid var(--line);background:radial-gradient(420px 260px at 80% 0%,rgba(var(--neon-rgb),.09),transparent 70%),var(--panel)}
.tour-stage::after{content:'';position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(transparent,var(--panel));pointer-events:none}
.tv{position:absolute;inset:0;padding:16px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:10px}
.tv.top{justify-content:flex-start}
.tv.r{animation:tvR .4s cubic-bezier(.2,.8,.2,1)}.tv.l{animation:tvL .4s cubic-bezier(.2,.8,.2,1)}
@keyframes tvR{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes tvL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.tour-txt{padding:16px 2px 12px}
.tour-txt.r,.tour-txt.l{animation:tin .45s .06s cubic-bezier(.2,.8,.2,1) both}
.tour-txt h2{font-family:var(--display);font-size:27px;font-weight:600;letter-spacing:-.02em;line-height:1.08;margin:7px 0 8px}
.tour-txt p{font-size:14.5px;color:var(--muted);line-height:1.5;min-height:4.5em}
.tour-nav{display:flex;gap:8px}
.tour-nav .btn{flex:1;min-height:48px}.tour-nav .btn[data-tour="prev"]{flex:0 0 52px;font-size:20px}.tour-nav .btn.p{flex:1.5}
.tour-nav .btn:disabled{opacity:.3}
.t-in{opacity:0;animation:tin .5s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i,0) * 90ms)}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.t-hero{display:flex;justify-content:center}.t-hero svg{width:min(100%,330px);height:auto}.t-hero.sm svg{width:min(70%,220px)}
.t-tag{text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--neon);text-shadow:0 0 12px rgba(var(--neon-rgb),.6)}
.t-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.t-tile{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:3px;color:var(--neon)}
.t-tile svg{filter:drop-shadow(0 0 6px rgba(var(--neon-rgb),.6));margin-bottom:4px}
.t-tile b{color:var(--text);font-size:14px;font-weight:600}.t-tile span{font-family:var(--mono);font-size:10px;color:var(--muted2)}
.t-sc .goal{margin-bottom:10px}
.t-plan{display:flex;flex-direction:column;gap:6px}
.t-pi{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:5px 10px 5px 5px}
.t-pi svg{width:46px;height:40px;flex:none;border-radius:8px;background:var(--bg)}.t-pi b{flex:1;font-size:13.5px;font-weight:500}.t-pi span{font-family:var(--mono);font-size:11px;color:var(--neon)}
.t-press{transform:scale(.95);filter:brightness(1.25)}
.t-scale{transform:scale(.9);transform-origin:top center;margin-bottom:-10%}
.t-tap{box-shadow:0 0 0 3px rgba(var(--neon-rgb),.55)!important;transition:box-shadow .15s}
.t-diff{display:flex;flex-direction:column;gap:7px}
.t-dr{display:grid;grid-template-columns:6px 82px 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;transition:border-color .25s,background .25s,transform .25s}
.t-dr i{grid-row:1/3;width:6px;height:100%;border-radius:3px;background:var(--dc);box-shadow:0 0 8px var(--dc)}
.t-dr b{font-size:14px;font-weight:600}.t-dr span{font-family:var(--mono);font-size:10.5px;color:var(--muted2)}
.t-dr em{grid-column:3;grid-row:1/3;text-align:right;font-style:normal;font-size:12px;color:var(--muted)}
.t-dr.hl{border-color:var(--dc);background:color-mix(in srgb,var(--dc) 10%,transparent);transform:scale(1.02)}
.tv .t-rest{position:relative;left:auto;right:auto;bottom:auto;margin:0;z-index:auto}
.t-mini .t-menu{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.t-mi{padding:9px 12px;border-radius:10px;border:1px solid var(--line);font-size:13.5px;transition:all .2s}
.t-mi.hl{border-color:var(--neon-d);color:var(--neon);background:rgba(var(--neon-rgb),.06)}
.t-lad{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.t-lr{display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.t-lr span{font-family:var(--mono);font-size:10px;color:var(--muted2)}.t-lr b{font-family:var(--mono);font-size:12px;font-weight:500;white-space:nowrap}.t-lr em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--neon)}
.t-lr.up{border-color:var(--neon);box-shadow:0 0 14px rgba(var(--neon-rgb),.25)}.t-lr.up b{color:var(--neon)}
.t-mm svg{width:100%;max-height:150px}
.t-cmp{aspect-ratio:auto;height:100%;max-height:100%;margin:0}
.t-ca{animation:tca 4.5s ease-in-out infinite}
.t-cl{animation:tcl 4.5s ease-in-out infinite}
@keyframes tca{0%,100%{clip-path:inset(0 75% 0 0)}50%{clip-path:inset(0 25% 0 0)}}
@keyframes tcl{0%,100%{left:25%}50%{left:75%}}
.t-th{grid-template-columns:repeat(4,1fr)}.t-th .th{padding:6px}.t-th .th-sw{height:34px}.t-th .th-n{font-size:9.5px}
.t-steps{display:flex;align-items:center;justify-content:center;gap:6px}
.t-st{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);width:96px;text-align:center;color:var(--muted);transition:all .25s}
.t-st b{font-size:11.5px;font-weight:500;color:var(--text)}
.t-st img{width:46px;height:46px;border-radius:11px}
.t-st.hl{border-color:var(--neon);color:var(--neon);transform:translateY(-4px);box-shadow:0 8px 24px rgba(var(--neon-rgb),.18)}
.t-ar{color:var(--muted2);font-family:var(--mono)}
.t-phone{align-self:center;width:200px;height:300px;border-radius:30px;border:2px solid var(--line2);background:var(--bg);padding:14px 12px;display:flex;align-items:flex-end;animation:tshake 3s ease-in-out infinite}
.t-ph-in{width:100%;background:#090909;border:1px solid var(--line2);border-radius:16px;padding:12px;font-size:12px}
.t-ph-in b{font-family:var(--display);font-size:15px;display:block;margin-top:3px}
.t-ph-in .chip{font-size:10px;padding:4px 9px}
.t-ta{border:1px solid var(--line2);border-radius:9px;padding:8px;color:var(--muted);font-size:11.5px;min-height:46px}
@keyframes tshake{0%,55%,100%{transform:none}60%{transform:rotate(-7deg)}65%{transform:rotate(7deg)}70%{transform:rotate(-6deg)}75%{transform:rotate(5deg)}80%{transform:rotate(-2deg)}85%{transform:none}}
.t-banner{display:flex;align-items:center;gap:12px;margin-bottom:14px;border-color:var(--neon-d);background:rgba(var(--neon-rgb),.05)}
.t-banner .grow{flex:1;min-width:0}.t-banner b{display:block;font-size:14.5px}.t-banner span{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.tv,.t-in,.tour-txt,.t-ca,.t-cl,.t-phone{animation:none!important;opacity:1}}
.don{border-color:var(--neon-d);background:radial-gradient(320px 160px at 100% 0%,rgba(var(--neon-rgb),.08),transparent 70%),var(--panel)}
.don-t{font-size:14px;line-height:1.55;color:var(--text)}.don-t .d{color:var(--neon)}
.don-acc{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:10px 12px}
.don-acc>div{flex:1;min-width:0;display:flex;flex-direction:column}
.don-acc b{font-family:var(--mono);font-size:17px;letter-spacing:.04em;font-weight:500;user-select:all;-webkit-user-select:all}
.don-qr{background:#fff;border-radius:18px;padding:14px;max-width:300px;margin:0 auto;box-shadow:0 0 0 1px var(--line2),0 0 30px rgba(var(--neon-rgb),.15)}
.don-qr img{display:block;width:100%;height:auto;image-rendering:pixelated}
/* ── Mapa svalů ── */
.mm .seg{margin-bottom:10px}
.mm-figs{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:330px;margin:0 auto}
.mm-figs>div{min-height:120px}
.mm-figs .rbh polygon{transition:fill .3s;stroke:var(--bg);stroke-width:.35}
.mm-leg{display:flex;justify-content:center;gap:12px;font-family:var(--mono);font-size:10px;color:var(--muted2);margin:8px 0 4px}
.mm-leg span{display:flex;align-items:center;gap:5px}.mm-leg i{width:10px;height:10px;border-radius:3px;display:block}
.mm-info{font-size:13px;color:var(--muted);text-align:center;min-height:2.6em;padding:6px 4px;line-height:1.45}.mm-info b{color:var(--text)}
.mm-sum{font-family:var(--mono);font-size:11px;color:var(--muted);margin:6px 0 8px}.mm-sum b{color:var(--text)}
.mm-list{display:flex;flex-direction:column;gap:2px}
.mm-r{display:grid;grid-template-columns:minmax(0,1fr) 34% 34px 66px;align-items:center;gap:8px;padding:5px 6px;border-radius:8px;text-align:left}
.mm-r.sel{background:var(--panel2)}
.mm-n{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mm-bar{position:relative;height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
.mm-bar .zone{position:absolute;top:0;bottom:0;background:rgba(var(--neon-rgb),.12)}
.mm-bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--neon-d)}
.mm-r.ok .fill,.mm-r.hi .fill{background:var(--neon);box-shadow:0 0 6px rgba(var(--neon-rgb),.5)}
.mm-v{font-family:var(--mono);font-size:11px;text-align:right}
.mm-s{font-family:var(--mono);font-size:10px;color:var(--muted2);text-align:right;white-space:nowrap}
.mm-r.ok .mm-s{color:var(--neon)}.mm-r.hi .mm-s{color:var(--warn)}
/* ── Sdílení ── */
.share-prev{margin-top:12px;border-radius:16px;overflow:hidden;border:1px solid var(--line2);background:var(--bg);min-height:200px;display:grid;place-items:center}
.share-prev{position:relative}.share-prev img{width:100%;display:block}.share-prev img:not([src]){display:none}
.share-prev .empty{display:none}.share-prev.busy .empty{display:block;position:absolute}.share-prev.busy img[src]{opacity:.45}
.seg-l{flex:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:8px 6px;border-radius:9px;font-family:var(--mono);font-size:11px;color:var(--neon)}
.sh-ctl{display:flex;flex-direction:column;gap:8px;margin-top:12px}.sh-ctl .chips{margin:0}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
/* ── Plynulé přechody ── */
header.top{view-transition-name:hdr}nav.bottom{view-transition-name:nav}
::view-transition-old(root){animation:vt-out .16s ease-in both}
::view-transition-new(root){animation:vt-in .3s cubic-bezier(.2,.8,.2,1) both}
html[data-vt="back"]{--vtd:-1}
@keyframes vt-out{to{opacity:0;transform:translateX(calc(var(--vtd,1) * -16px))}}
@keyframes vt-in{from{opacity:0;transform:translateX(calc(var(--vtd,1) * 22px))}}
/* ── Kardio na čas ── */
.cd-last{margin-top:10px;font-family:var(--mono);font-size:12px;color:var(--text)}.cd-last span{color:var(--muted2);margin-right:6px}.cd-last i{font-style:normal;color:var(--muted)}
.cd-clock{margin-top:12px;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 12px;border-radius:14px;border:1px solid var(--line2);background:var(--panel2)}
.cd-clock.run{border-color:var(--neon-d);background:rgba(var(--neon-rgb),.05)}
.cd-t{font-family:var(--display);font-size:54px;font-weight:600;letter-spacing:-.03em;line-height:1;color:var(--text)}
.cd-clock.run .cd-t{color:var(--neon);text-shadow:0 0 22px rgba(var(--neon-rgb),.55)}
.cd-btns{display:flex;gap:8px;width:100%}.cd-btns .btn{flex:1}
.cd-segs{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.cd-seg{display:flex;align-items:center;gap:6px}.cd-seg .n{width:18px;font-family:var(--mono);font-size:12px;color:var(--muted2);text-align:center}
.cd-seg.ok .n{color:var(--neon)}
.cd-f{flex:1;min-width:0;position:relative}.cd-f input{padding:14px 6px 4px;text-align:center;font-family:var(--mono);font-size:16px;border-radius:9px}
.cd-f span{position:absolute;left:0;right:0;top:3px;text-align:center;font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);pointer-events:none}
.cd-x{width:34px;height:34px;flex:none;font-size:12px}
.cd-sum{margin-top:10px;font-family:var(--mono);font-size:12px;color:var(--muted)}.cd-sum b{color:var(--neon);font-weight:500}
/* ── Návrh tréninku ── */
.gen-tog{margin-top:10px;justify-content:center;position:relative}.gen-tog .chev{position:absolute;right:16px;color:var(--muted)}
.gen-tog.on{border-color:var(--neon-d);color:var(--neon)}
.gen-box{margin-top:10px;animation:tin .3s cubic-bezier(.2,.8,.2,1)}
/* ── Potvrzovací okno ── */
.dlg-bg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .2s}
.dlg-bg.on{opacity:1;pointer-events:auto}
.dlg{width:100%;max-width:360px;background:#0d0d0d;border:1px solid rgba(255,77,109,.35);border-radius:22px;padding:22px 18px 16px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 40px rgba(255,77,109,.08);transform:scale(.94);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.dlg-bg.on .dlg{transform:none}
.dlg.ok{border-color:var(--neon-d);box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 40px rgba(var(--neon-rgb),.1)}
.dlg.ok .dlg-ico{color:var(--neon);background:rgba(var(--neon-rgb),.1);border-color:var(--neon-d)}
.dlg .warn-t{color:var(--warn)}
.dlg-ico{width:54px;height:54px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;color:var(--bad);background:rgba(255,77,109,.1);border:1px solid rgba(255,77,109,.35)}
.dlg h3{font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:-.01em}
.dlg p{font-size:14px;color:var(--muted);line-height:1.5;margin:8px 0 18px}.dlg p b{color:var(--text)}
.dlg-btns{display:flex;flex-direction:column;gap:8px}
.btn.danger-f{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:700}
.btn.danger-f:disabled{background:rgba(255,77,109,.18);border-color:rgba(255,77,109,.35);color:rgba(255,255,255,.6)}
/* ── Editor obrázku ── */
.sh-stage{position:relative;margin-top:12px;border-radius:16px;overflow:hidden;border:1px solid var(--line2);background:#000}
.ig-g{position:absolute;left:0;right:0;pointer-events:none;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(135deg,rgba(255,77,109,.16) 0 8px,rgba(255,77,109,.06) 8px 16px);border:0 dashed rgba(255,77,109,.7)}
.ig-g.top{top:0;border-bottom-width:1.5px}.ig-g.bot{bottom:0;border-top-width:1.5px}
.ig-g span{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:#fff;background:rgba(0,0,0,.55);padding:3px 7px;border-radius:6px}
#sh-cv{display:block;width:100%;height:auto;touch-action:none;cursor:grab}
.sh-lab{margin-top:14px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}.sh-lab span{text-transform:none;letter-spacing:0;color:var(--muted2)}
.sh-layers{margin-top:8px}
.sh-layers .chip.ed{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--text)}
.sh-layers .chip.sh-ph{border-style:dashed}
.sh-ed{margin-top:10px;gap:10px}
.sh-ed-h{display:flex;align-items:center;justify-content:space-between;gap:10px}.sh-ed-h b{font-family:var(--display);font-size:16px}
.sh-rg{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.sh-rg input{padding:0;height:28px;border:0;background:none;accent-color:var(--neon)}
.sh-cols{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:32px;height:32px;border-radius:50%;background:var(--sw);border:2px solid rgba(255,255,255,.18);display:grid;place-items:center;font-size:13px;color:#0b0b0b;position:relative;overflow:hidden}
.sw.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--text)}
.sw-pick{background:conic-gradient(#ff4d6d,#ffd23a,#39ff88,#38c6ff,#b98cff,#ff4d6d)}
.sw-pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;padding:0;border:0}
/* ── Hlavička tréninku ── */
.wo-tools{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.wo-head .wo-dt{flex:0 1 auto;width:154px;min-width:0;height:38px;padding:6px 8px;font-size:11.5px;font-family:var(--mono);color:var(--muted);border-radius:10px}
.wo-head .wo-dt::-webkit-date-and-time-value{text-align:center}
.mot-btn{color:var(--neon);border-color:var(--neon-d);box-shadow:0 0 14px rgba(var(--neon-rgb),.18)}
.wo-date{display:flex;gap:8px;margin:-4px 0 14px;animation:tin .25s ease-out}.wo-date input{flex:1;font-family:var(--mono);font-size:14px}
.mot-rb{color:var(--neon);padding:0 10px}
/* ── Motivace ── */
.mot{position:fixed;inset:0;z-index:65;background:#000;animation:tin .25s ease-out}
.mot-feed{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.mot-feed::-webkit-scrollbar{display:none}
.mot-s{position:relative;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:radial-gradient(500px 400px at 70% 20%,rgba(var(--neon-rgb),.25),transparent 70%),#050505}
.mot-s img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mot-s.noimg img{display:none}
.mot-s::after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0) 22%,rgba(0,0,0,0) 45%,rgba(0,0,0,.88) 78%,#000);pointer-events:none}
.mot-c{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:0 22px calc(env(safe-area-inset-bottom) + 110px)}
.mot-n{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.02em;color:#fff;line-height:1.05}
.mot-t{display:inline-block;margin-top:8px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--on-neon);background:var(--neon);padding:4px 9px;border-radius:7px}
.mot-q{margin-top:16px;font-family:var(--display);font-size:25px;font-weight:600;line-height:1.25;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.mot-cr{display:block;margin-top:14px;font-family:var(--mono);font-size:9.5px;color:rgba(255,255,255,.55);text-decoration:none}
.mot-hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 70px);z-index:2;text-align:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6);animation:motb 1.6s ease-in-out infinite}
@keyframes motb{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.mot-top{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 16px 0}
.mot-x{margin-left:auto;background:rgba(0,0,0,.45);border-color:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.mot-rest{display:none;position:relative;overflow:hidden;align-items:baseline;gap:10px;padding:9px 16px 11px;border-radius:14px;background:rgba(0,0,0,.55);border:1px solid var(--neon-d);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.mot-rest.on{display:flex}
.mot-rl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.mot-rest b{font-family:var(--display);font-size:26px;font-weight:600;color:var(--neon);text-shadow:0 0 14px rgba(var(--neon-rgb),.6)}
.mot-rest i{position:absolute;left:0;bottom:0;height:3px;background:var(--neon);box-shadow:0 0 8px var(--neon);transition:width 1s linear}
.mot-go{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 22px);z-index:5;display:flex;justify-content:center}
.mot-go .btn{min-height:52px;padding:0 24px}
.mot-back{background:rgba(0,0,0,.5);border-color:rgba(255,255,255,.25);color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.mot-go.on .mot-gob{width:100%;font-size:17px;min-height:60px;animation:motp 1.1s ease-in-out infinite;box-shadow:0 0 30px rgba(var(--neon-rgb),.55)}
@keyframes motp{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@media (prefers-reduced-motion: reduce){.mot-hint,.mot-go.on .mot-gob{animation:none}}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.th{display:flex;flex-direction:column;align-items:stretch;gap:7px;padding:8px;border-radius:14px;border:1px solid var(--line);background:var(--tb);text-align:left;transition:border-color .2s,box-shadow .2s}
.th.on{border-color:var(--ta);box-shadow:0 0 0 1px var(--ta),0 0 18px rgba(var(--tr),.25)}
.th-sw{position:relative;display:block;height:46px;border-radius:9px;background:var(--tp);border:1px solid var(--tl);overflow:hidden}
.th-sw i{position:absolute;left:8px;top:9px;width:34%;height:6px;border-radius:3px;background:var(--ta);box-shadow:0 0 10px rgba(var(--tr),.8)}
.th-sw b{position:absolute;left:8px;bottom:9px;width:56%;height:5px;border-radius:3px;background:var(--td)}
.th-sw em{position:absolute;right:8px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;border:2.5px solid var(--ta);box-shadow:0 0 8px rgba(var(--tr),.7)}
.th-n{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:6px}
.th.on .th-n{color:var(--text)}.th.on .th-n::after{content:'✓';color:var(--ta);margin-left:auto}
.hb{display:flex;flex-direction:column;gap:12px}
.hb-r{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:5px 10px}
.hb-l{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-v i{font-style:normal;color:var(--muted2)}
.hb-t{grid-column:1/-1;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}.hb-t span{display:block;height:100%;background:var(--neon-d);border-radius:4px}
.hb-r:first-child .hb-t span{background:var(--neon)}
.hb-v{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right}
.chart svg{display:block;width:100%}
.chart .ax{font-family:var(--mono);font-size:10px;fill:var(--muted2)}
.chart .grid{stroke:#191919;stroke-width:1}
.chart .ln{fill:none;stroke:var(--neon);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 5px rgba(var(--neon-rgb),.5))}
.chart .pt{fill:var(--bg);stroke:var(--neon);stroke-width:2}
.chart .pt.f{fill:var(--neon)}
.chart .xh{stroke:#3a3a3a;stroke-width:1}
.tt{position:absolute;pointer-events:none;background:#0f0f0f;border:1px solid var(--line2);border-radius:10px;padding:7px 10px;font-size:12px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-10px;box-shadow:0 8px 24px rgba(0,0,0,.6);z-index:2}
.tt b{font-family:var(--display);font-size:15px;color:var(--text)}
.tt span{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.mult{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mult .card{padding:10px 10px 8px}
.mult .hdr{display:flex;justify-content:space-between;align-items:baseline}
.mult .hdr b{font-size:13.5px;font-weight:500}
.mult .hdr span{font-family:var(--mono);font-size:10.5px;color:var(--muted2)}
.mult .big{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.1}
.mult .big small{font-family:var(--mono);font-size:10px;color:var(--muted2);font-weight:400;margin-left:4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2);text-align:left;font-weight:400;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl td.r,.tbl th.r{text-align:right}
.pr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.pr:last-child{border-bottom:0}
.pr .nm{flex:1;font-size:14px}
.pr .v{font-family:var(--display);font-weight:600;font-size:16px}
.pr .d{font-family:var(--mono);font-size:10.5px;color:var(--muted2);width:54px;text-align:right}

/* history */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;justify-content:start}
.heat i{width:14px;height:14px;border-radius:3px;background:#141414;display:block}
.heat i.l1{background:rgba(var(--neon-rgb),.25)}.heat i.l2{background:rgba(var(--neon-rgb),.5)}.heat i.l3{background:rgba(var(--neon-rgb),.78)}.heat i.l4{background:var(--neon);box-shadow:0 0 6px rgba(var(--neon-rgb),.6)}
.heat i.today{outline:1px solid var(--muted)}
.heat-leg{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;color:var(--muted2);margin-top:8px}
.heat-leg i{width:10px;height:10px;border-radius:2px;display:block}
.hist-it{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.hist-it>button{width:100%;text-align:left;padding:12px 14px;display:flex;gap:12px;align-items:center}
.hist-it .dt{width:44px;flex:none;text-align:center}
.hist-it .dt b{display:block;font-family:var(--display);font-size:22px;font-weight:600;line-height:1}
.hist-it .dt span{font-family:var(--mono);font-size:10px;color:var(--muted2);text-transform:uppercase}
.hist-it .sm{flex:1;min-width:0}
.hist-it .sm b{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-it .sm span{font-family:var(--mono);font-size:10.5px;color:var(--muted2)}
.hist-body{padding:0 14px 12px;border-top:1px solid var(--line)}
.hist-ex{padding:10px 0;border-bottom:1px solid var(--line)}
.hist-ex b{font-weight:500;font-size:14px}
.hist-ex div{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:3px;line-height:1.7}
.f-mark{color:var(--warn)}

/* rest timer */
.rest{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 10px);z-index:25;max-width:536px;margin:0 auto;background:#0d0d0d;border:1px solid var(--neon-d);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.7),0 0 24px rgba(var(--neon-rgb),.12);overflow:hidden}
.rest .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--neon);box-shadow:0 0 10px var(--neon)}
.rest .t{font-family:var(--display);font-size:28px;font-weight:600;color:var(--neon);min-width:76px;letter-spacing:-.02em}
.rest .l{line-height:1.3;flex:1;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.rest.done{border-color:var(--warn);animation:pulse .8s ease-in-out 3}
.rest.done .t{color:var(--warn)}
@keyframes pulse{50%{box-shadow:0 0 30px rgba(255,166,48,.5)}}

/* toast */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-140%);z-index:60;background:#0f0f0f;border:1px solid var(--neon-d);border-radius:12px;padding:10px 16px;font-size:13.5px;max-width:calc(100% - 32px);transition:transform .25s;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.toast.on{transform:translate(-50%,0)}

/* lock */
.lock{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;max-width:420px;margin:0 auto;padding:32px 20px calc(32px + env(safe-area-inset-bottom))}
.lock .hero{margin-bottom:26px}
.lock .hero svg.fig{width:150px;height:auto;margin:0 0 6px -14px}
.lock h1{font-family:var(--display);font-size:44px;font-weight:600;letter-spacing:-.04em;line-height:1}
.lock h1 .d{color:var(--neon);text-shadow:0 0 18px var(--neon)}
.lock p.sub{color:var(--muted);margin-top:8px;font-size:14px}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.field .help{font-size:12px;color:var(--muted2)}
.check{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);margin:4px 0 16px}
.check input{width:18px;height:18px;accent-color:var(--neon)}
.err-msg{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
.empty{color:var(--muted2);text-align:center;padding:28px 10px;font-size:14px}
.note{font-size:12.5px;color:var(--muted2)}
.how{display:grid;gap:10px;font-size:13.5px;color:#cfcfcf}
.how b{color:var(--text)}
.auth-links{display:flex;justify-content:space-between;gap:8px;margin-top:10px}
.ok-msg{color:var(--neon);font-size:13.5px;margin-top:8px}
.steps{display:grid;gap:10px;margin:0 0 14px;padding-left:20px;font-size:13.5px;color:#cfcfcf}
.steps li::marker{color:var(--neon);font-family:var(--mono)}
.steps b{color:var(--text)}
pre.code{font-variant-ligatures:none;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:10px;font-family:var(--mono);font-size:10.5px;line-height:1.5;overflow:auto;color:#bdbdbd;margin-top:6px}
textarea{min-height:120px;font-family:var(--mono);font-size:12px}
#rest-l{text-transform:none;letter-spacing:.02em;font-size:11.5px;color:var(--text)}
</style>

/* ═══════════════════════════════════════════════════════════════
   DOPORUČENÍ – dvojitá progrese s ohledem na selhání (RIR)

function sessions(exId, excludeId) {

   – horní hranice dosažená až v selhání se musí potvrdit dalším tréninkem
   – selhání není nutné: hypertrofie roste blíž k selhání, síla skoro nezávisle (Refalo 2023, Robinson 2024)

function recommend(ex, excludeId) {
  if (isCardio(ex)) {
    const h = sessions(ex.id, excludeId)[0], tot = h ? h.sets.reduce((a, x) => a + x.r, 0) : 0;
    return h ? { kind: 'hold', w: 0, r: 0, n: 0, head: `Minule ${mmss(tot)}`, txt: 'Pro zlepšení vydrž o 1–2 minuty déle, nebo přidej trochu rychlosti či sklonu – vždy jen jedno.' }
             : { kind: 'new', w: 0, r: 0, n: 0, head: rangeTxt(ex), txt: 'Spusť stopky a jdi. Rychlost můžeš doplnit potom – je nepovinná.' };
  }

  const inc = incOf(ex), lo = ex.lo, hi = ex.hi, u = unitOf(ex), timed = ex.unit === 's';
  const heavy = lo <= 6;

  if (!H.length) return { kind: 'new', w: null, r: lo, n: 3, head: `${lo}–${hi} ${u}`, txt: `První záznam. Zvol váhu, se kterou dáš ${lo}–${hi} ${u} a zbudou ti 2–3 v rezervě.` };
  const last = H[0].sets;

  const top = last.filter(s => s.w === W);
  const reps = top.map(s => s.r), minR = Math.min(...reps), maxR = Math.max(...reps);
  const fails = top.filter(s => s.q === 0).length;
  const avgQ = top.reduce((a, s) => a + rirOf(s), 0) / top.length;
  let n = Math.max(2, Math.min(6, last.length));
  const out = (kind, w, r, txt) => ({ kind, w, r: Math.round(r), n, head: (w > 0 ? `${fmt(w, 2)} kg × ` : (ex.eq === 'bw' ? 'vlastní váha × ' : '')) + `${Math.round(r)} ${u}`, txt: (txt + (kind !== 'down' ? ' ' + rirNote : '')).replace(/\.\./g, '.'), last: H[0] });
  const prevTop = H[1] ? H[1].sets.filter(s => s.w === W) : [];
  const prevHit = prevTop.length > 0 && Math.min(...prevTop.map(s => s.r)) >= hi;

  // Vlastní váha / trenažér bez zátěže – progrese přes opakování / čas

    if (minR >= hi && (!fails || prevHit)) return out('up', inc, lo, `Všechny série na ${hi}+ ${u} → přidej zátěž ${fmt(inc, 2)} kg (opasek, vesta, jednoručka).`);
    if (minR >= hi) return out('hold', 0, hi, `${hi} ${u} jsi dal, ale do selhání – potvrď to ještě jednou s rezervou, pak přidáme zátěž.`);
    if (fails && minR < lo) return out('hold', 0, lo, `Pod rozsahem a do selhání – drž a cíl ${lo} ${u}.`);
    return out('reps', 0, Math.min(hi, minR + 1), 'Přidej 1 opakování v nejslabší sérii.');
  }

  // Stagnace: 3 tréninky bez zlepšení a se selháním → lehčí týden (ne pauza)
  if (H.length >= 3 && fails) {
    const [a, b, c] = H.slice(0, 3).map(h => bestE1(h.sets));
    if (a <= Math.max(b, c) * 1.005 && b <= c * 1.01) {
      const w = Math.max(inc, roundTo(W * 0.9, inc, 'floor'));
      n = Math.max(2, n - 1);
      return out('down', w, Math.min(hi, lo + 2), `Tři tréninky bez zlepšení a končíš v selhání → lehčí týden: ~90 % (${fmt(w, 2)} kg), o sérii méně a 2–3 opakování v rezervě. Pauza úplně se nevyplácí – trénuj dál, jen lehčeji. Pak zase nahoru.`);
    }

  if (H[1]) {

    if (e1 > 0 && e0 < e1 * 0.95) return out('hold', W, Math.min(hi, Math.max(lo, minR + 1)), `Minule o ${Math.round((1 - e0 / e1) * 100)} % slabší než předtím – to se stává. Nepřidávej, zopakuj stejnou váhu.`);
  }

  const need = hi + (big ? 2 : 0);

    return out('up', W + inc, lo, `Horní hranici jsi zvládl${fails ? ' už podruhé' : ' s rezervou'} → přidej ${fmt(inc, 2)} kg (+${Math.round(inc / W * 100)} %) a začni od ${lo} ${u}.`);
  }

      }

  }

  if (avgQ >= 3 && !fails) {
    if (H.length <= 2 && maxR >= Math.round((lo + hi) / 2) && !big) return out('up', W + inc, lo, `Šlo to moc snadno (rezerva 3+) a jsi teprve v začátcích → přidej ${fmt(inc, 2)} kg, ať najdeš pracovní váhu.`);
    return out('reps', W, Math.min(hi, minR + 2), 'Velká rezerva → +2 opakování v každé sérii.');
  }
  if (fails >= Math.ceil(top.length / 2) || top[0].q === 0) {
    return out('hold', W, Math.min(hi, minR + 1), `Většina sérií do selhání → drž ${fmt(W, 2)} kg, cíl ${Math.min(hi, minR + 1)} ${u} v nejslabší sérii a nech 1 v rezervě.`);
  }
  return out('reps', W, Math.min(hi, minR + 1), `Přidej 1 opakování. Až dáš ${need} ${u} ve všech sériích, přidá se váha.`);
}

function render() {
  if (S) applyTheme(S.set.theme);
  $$('nav button').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  $('#btn-set').classList.toggle('on', view === 'set');
  $('#btn-adm').classList.toggle('on', view === 'admin');
  if (view === 'admin' && !IS_ADMIN) view = 'train';
  if (view === 'admin' && !ADM.users && !ADM.loading && !ADM.err) { loadAdmin(); return; }
  const m = $('#main');
  m.innerHTML = ({ train: vTrain, lib: vLib, hist: vHist, prog: vProg, body: vBody, set: vSet, admin: vAdmin })[view]();
  if (view === 'admin') mountAdmin();
  if (view === 'prog') mountProg();
  if (view === 'body') mountBody();
  if (view === 'train') tickTimers();
}

let IS_ADMIN = false;
const ADM = { at: 0, users: null, reports: null, loading: false, err: '', sel: null, open: null };
async function checkAdmin() {
  try { IS_ADMIN = !!(USER && db && (await db.collection('admins').doc(USER.uid).get()).exists); } catch { IS_ADMIN = false; }

    ADM.users = await Promise.all(us.docs.map(async d => {
      const v = d.data();
      const [w, cx] = await Promise.all([d.ref.collection('workouts').get(), d.ref.collection('cx').get()]);
      return {
        uid: d.id, name: v.name || v.username || 'Bez jména', username: v.username || '', created: v.created || 0,
        goal: (v.set && v.set.goal) || 3,

async function sendReport() {

  if (!REP.text && !REP.photos.length) { toast('Napiš pár slov nebo přidej fotku.'); $('#rep-t')?.focus(); return; }

  const id = uid(), name = (PROFILE && PROFILE.name) || USER.displayName || '';

  // offline Firestore zápis podrží a odešle později – na potvrzení serveru čekáme max. 10 s
  let saved = 'err';
  try { saved = await Promise.race([batch.commit().then(() => 'ok'), new Promise(r => setTimeout(() => r('queued'), 10000))]); }

  closeSheet(); vib([10, 40, 10]);

// Zatřesení: 3 prudké změny zrychlení během ~1 s; po otevření 3 s pauza
let lastAcc = null, shakeHits = [], shakeAt = 0, motionAsked = false;
addEventListener('devicemotion', e => {
  if (!USER || !shakeOn() || sheetKind || document.hidden) { lastAcc = null; return; }
  const a = e.accelerationIncludingGravity; if (!a || a.x == null) return;
  if (lastAcc) {
    const d = Math.abs(a.x - lastAcc.x) + Math.abs(a.y - lastAcc.y) + Math.abs(a.z - lastAcc.z), t = e.timeStamp;
    if (d > 26) {
      shakeHits = shakeHits.filter(x => t - x < 1000); shakeHits.push(t);
      if (shakeHits.length >= 3 && t - shakeAt > 3000) { shakeAt = t; shakeHits = []; vib([15, 30, 15]); reportSheet(); }
    }
  }
  lastAcc = { x: a.x, y: a.y, z: a.z };
});

   PRŮVODCE APLIKACÍ – prezentace po blocích na ukázkových datech.

let DEMO = null;
const TOUR = { i: 0, timers: [], open: false };
function demoState() {
  const st = blank(); st.set = setDefaults({ ...(S ? S.set : {}), goal: 3, bar: 20 });
  const T = now();
  // dvojitá progrese v rozsahu cviku: spodní → horní hranice opakování, pak + váha a znovu od spodní
  const ladder = (id, w0, inc, n) => { const { lo, hi } = getEx(id), out = []; let w = w0, r = lo; for (let k = 0; k < n; k++) { out.push([w, r]); if (++r > hi) { r = lo; w += inc; } } return out; };
  const plan = { A: [['bench', 60, 2.5], ['row', 50, 2.5], ['latraise', 8, 1]], B: [['squat', 80, 2.5], ['rdl', 70, 2.5], ['legext', 40, 5]] };
  const lad = {}; for (const g of 'AB') for (const [id, w0, inc] of plan[g]) lad[id] = ladder(id, w0, inc, 14);
  // realistický rozvrh: 10 týdnů, většinou Po/St/Pá, občas vynechaný den
  const days = [];
  for (let wk = 9; wk >= 0; wk--) for (const d of [0, 2, 4]) { const t = startOfWeek(T) - wk * 7 * DAY + d * DAY + 17.5 * 3600e3; if (t < T - 3 * 3600e3 && (wk * 3 + d) % 7 !== 3) days.push(t); }
  const NS = days.length;
  for (let k = NS - 1; k >= 0; k--) {
    const t = days[NS - 1 - k], n = Math.floor((NS - 1 - k) / 2), g = k % 2 ? 'B' : 'A';
    const it = plan[g].map(([id]) => { const [w, r] = lad[id][n]; return { ex: id, s: [0, 1, 2].map(j => ({ w, r: Math.max(6, r - (j === 2 ? 1 : 0)), q: j === 2 ? 1 : 2, ok: true })) }; });
    st.w.push({ id: 'demo' + k, d: localISO(t), it, rpe: 7 + (k % 3 === 0 ? 1 : 0), end: t + 62 * 60e3, u: t });
  }
  for (let k = 0; k < 22; k++) { const t = T - (60 - k * 2.8) * DAY; st.body.push({ id: 'db' + k, d: localISO(t).slice(0, 10), kg: +(82.6 - k * .11 + Math.sin(k * 1.7) * .35).toFixed(1), u: t }); }

  return st;
}

/* ── Historie ── */
function histItem(w, expandable = true) {
  const t = new Date(w.d);
  const exs = w.it.filter(i => doneSets(i).length);
  const sets = exs.reduce((a, i) => a + doneSets(i).length, 0);
  const vol = exs.reduce((a, i) => a + doneSets(i).reduce((b, s) => b + s.w * s.r, 0), 0);
  const dur = w.end ? Math.round((w.end - new Date(w.d).getTime()) / 60000) : null;
  const open = ui.histOpen === w.id;
  const groups = wName(w);
  return `<div class="hist-it"><button data-act="${expandable ? 'histtog' : 'gohist'}" data-id="${w.id}">
      <div class="dt"><b>${t.getDate()}</b><span>${t.toLocaleDateString('cs-CZ', { month: 'short' })}</span></div>
      <div class="sm"><b>${esc(groups || 'Bez cviků')}</b><span>${pl(exs.length, 'cvik', 'cviky', 'cviků')} · ${pl(sets, 'série', 'série', 'sérií')} · ${fmtInt(vol)} kg${dur && dur > 0 && dur < 600 ? ` · ${dur} min` : ''}${w.rpe ? ` · <span style="color:${rpeColor(w.rpe)}">RPE ${w.rpe}</span>` : ''}</span></div>
      <span class="mono muted" style="font-size:12px">${open ? '−' : '+'}</span></button>
    ${open ? `<div class="hist-body">${exs.map(i => { const ex = getEx(i.ex); return `<div class="hist-ex"><b>${esc(ex.n)}</b><div>${doneSets(i).map(s => isCardio(ex) ? cdTxt(s, ex) : `${s.w > 0 ? fmt(s.w, 2) + ' kg × ' : ''}${s.r}${ex.unit ? ' ' + ex.unit : ''}${s.q != null ? ` <span class="dq" style="--dc:${diffOf(s.q).c}">${diffOf(s.q).l}</span>` : ''}`).join('<br>')}${i.note ? `<br><i class="muted">„${esc(i.note)}“</i>` : ''}</div></div>`; }).join('')}
      ${w.note ? `<p class="note" style="margin-top:8px">${esc(w.note)}</p>` : ''}
      <div class="row" style="margin-top:12px"><button class="btn sm wide" data-act="share" data-id="${w.id}">Sdílet obrázek</button><button class="btn sm wide" data-act="repeat" data-id="${w.id}">↻ Zopakovat</button></div>
      <div class="row" style="margin-top:8px"><button class="btn sm wide" data-act="editw" data-id="${w.id}">Upravit</button><button class="btn sm danger wide" data-act="delw" data-id="${w.id}">Smazat</button></div></div>` : ''}</div>`;
}
function vHist() {
  const ws = doneWorkouts();
  const weeks = 17, start = startOfWeek(now()) - (weeks - 1) * 7 * DAY;
  const byDay = {};
  ws.forEach(w => { const k = startOfDay(new Date(w.d).getTime()); byDay[k] = (byDay[k] || 0) + w.it.reduce((a, i) => a + doneSets(i).length, 0); });
  const today = startOfDay(now());
  let cells = '';
  for (let i = 0; i < weeks * 7; i++) {
    const t = start + i * DAY; const d = new Date(t); d.setHours(0, 0, 0, 0); const k = d.getTime();
    const v = byDay[k] || 0; const lv = v === 0 ? '' : v < 8 ? 'l1' : v < 15 ? 'l2' : v < 22 ? 'l3' : 'l4';
    cells += k > today ? '<i style="background:transparent"></i>' : `<i class="${lv} ${k === today ? 'today' : ''}" title="${dShort(k)}: ${v} sérií"></i>`;
  }
  const total = ws.length, last30 = ws.filter(w => now() - new Date(w.d).getTime() < 30 * DAY).length;
  return `<div class="kicker">${pl(total, 'trénink', 'tréninky', 'tréninků')} celkem · ${last30} za 30 dní</div><h1 class="title">Historie<span class="d">.</span></h1>
    <div class="card"><div class="heat">${cells}</div>
    <div class="heat-leg">méně <i style="background:#141414"></i><i style="background:rgba(var(--neon-rgb),.25)"></i><i style="background:rgba(var(--neon-rgb),.5)"></i><i style="background:rgba(var(--neon-rgb),.78)"></i><i style="background:var(--neon)"></i> více sérií · posledních ${weeks} týdnů</div></div>
    <h2 class="sec">Tréninky</h2>
    ${ws.map(w => histItem(w)).join('') || '<div class="empty">Zatím žádný dokončený trénink.</div>'}`;
}

/* ── Progres ── */
function exWithData() {
  const ids = new Map();
  doneWorkouts().forEach(w => w.it.forEach(i => { if (doneSets(i).length) ids.set(i.ex, (ids.get(i.ex) || 0) + 1); }));
  return [...ids.entries()].sort((a, b) => b[1] - a[1]).map(([id]) => getEx(id));
}
function vProg() {
  const list = exWithData();
  if (!list.length) return `<h1 class="title">Progres<span class="d">.</span></h1><div class="empty">Až dokončíš první trénink, uvidíš tu grafy progresivního přetížení.</div><h2 class="sec">Jak funguje doporučení</h2>${HOWTO}`;
  if (!ui.progEx || !list.find(e => e.id === ui.progEx)) ui.progEx = list[0].id;
  const ex = getEx(ui.progEx), bw = isBW(ex) && sessions(ex.id).every(h => h.sets.every(s => !s.w));
  const metrics = bw ? [['reps', ex.unit === 't' ? 'Nejdelší úsek' : ex.unit === 's' ? 'Max výdrž' : ex.unit === 'm' ? 'Max metrů' : 'Max opak.'], ['tot', 'Celkem']] : [['e1', 'Odhad 1RM'], ['top', 'Top váha'], ['vol', 'Objem']];
  if (!metrics.find(m => m[0] === ui.progMetric)) ui.progMetric = metrics[0][0];
  const rc = recommend(ex);
  const H = sessions(ex.id).slice(0, 12);
  // týdenní série podle partie
  const ws0 = startOfWeek(now()), nW = 8;
  const labels = Array.from({ length: nW }, (_, i) => dShort(ws0 - (nW - 1 - i) * 7 * DAY));
  const per = Object.fromEntries(GROUPS.map(g => [g, Array(nW).fill(0)]));
  doneWorkouts().forEach(w => { const wi = nW - 1 - Math.round((ws0 - startOfWeek(new Date(w.d).getTime())) / (7 * DAY)); if (wi < 0 || wi >= nW) return; w.it.forEach(i => { const g = getEx(i.ex).g; per[g][wi] += doneSets(i).length; }); });
  // rekordy
  const prs = list.map(e => { let b = { v: 0, d: null, s: null }; sessions(e.id).forEach(h => h.sets.forEach(s => { const v = e1rm(s); if (v > b.v) b = { v, d: h.d, s }; })); return { e, ...b }; }).filter(p => p.v > 0).sort((a, b) => b.v - a.v);
  return `<div class="kicker">Progresivní přetížení</div><h1 class="title">Progres<span class="d">.</span></h1>
    ${vMuscles()}
    <h2 class="sec">Cvik</h2>
    <select data-f="progex" aria-label="Cvik">${list.map(e => `<option value="${e.id}" ${e.id === ex.id ? 'selected' : ''}>${esc(e.n)}</option>`).join('')}</select>
    <div class="seg" style="margin-top:10px">${metrics.map(([k, l]) => `<button class="${ui.progMetric === k ? 'on' : ''}" data-act="metric" data-m="${k}">${l}</button>`).join('')}</div>
    <div class="card" style="margin-top:10px;padding:10px 6px 4px"><div class="chart" id="chart"></div></div>
    <p class="note" style="margin-top:6px">${ui.progMetric === 'e1' ? 'Odhad 1RM = váha × (1 + (opakování + rezerva) / 30). Plný bod = trénink se selháním.' : ui.progMetric === 'vol' ? 'Objem = součet váha × opakování ve všech sériích.' : 'Plný bod = trénink se selháním.'}</p>
    <div style="margin-top:12px">${recoBox(rc, ex)}</div>
    <h2 class="sec">Tabulka</h2>
    <div class="card" style="padding:4px 12px"><table class="tbl"><thead><tr><th>Datum</th><th>Série</th><th class="r">${bw ? 'Max' : '1RM'}</th></tr></thead><tbody>
      ${H.map(h => `<tr><td class="mono">${dShort(h.d)}</td><td>${h.sets.map(s => `${s.w > 0 ? fmt(s.w, 2) + '×' : ''}${s.r}${s.q === 0 ? '<span class="f-mark">S</span>' : ''}`).join(' ')}</td><td class="r">${bw ? Math.max(...h.sets.map(s => s.r)) : fmt(bestE1(h.sets), 1)}</td></tr>`).join('')}
    </tbody></table></div>
    <h2 class="sec">Série týdně podle partie</h2>
    <p class="note" style="margin:-4px 0 10px">Pás = doporučených 10–20 pracovních sérií na partii za týden.</p>
    <div class="mult">${GROUPS.map(g => { const v = per[g]; const avg = v.slice(0, -1).reduce((a, b) => a + b, 0) / (nW - 1); return `<div class="card"><div class="hdr"><b>${g}</b><span>Ø ${fmt(avg, 1)}</span></div><div class="big">${v[nW - 1]}<small>sérií</small></div>${weekBars(v, labels)}</div>`; }).join('')}</div>
    ${prs.length ? `<h2 class="sec">Rekordy (odhad 1RM)</h2><div class="card" style="padding:2px 14px">${prs.slice(0, 12).map(p => `<div class="pr"><span class="nm">${esc(p.e.n)}</span><span class="v">${fmt(p.v, 1)} kg</span><span class="d">${dShort(p.d)}</span></div>`).join('')}</div>` : ''}
    <h2 class="sec">Jak funguje doporučení</h2>${HOWTO}`;
}
function mountProg() {
  mountMuscles();
  const el = $('#chart'); if (!el) return;
  const ex = getEx(ui.progEx);
  const H = sessions(ex.id).slice().reverse();
  const m = ui.progMetric;
  const pts = H.map(h => {
    const f = h.sets.some(s => s.q === 0);
    const x = new Date(h.d).getTime();
    if (m === 'e1') return { x, y: bestE1(h.sets), f, tip: h.sets.length + ' sérií' };
    if (m === 'top') { const t = h.sets.reduce((a, s) => s.w > a.w || (s.w === a.w && s.r > a.r) ? s : a, h.sets[0]); return { x, y: t.w, f, tip: `× ${t.r}` }; }
    if (m === 'vol') return { x, y: h.sets.reduce((a, s) => a + s.w * s.r, 0), f, tip: h.sets.length + ' sérií' };
    if (m === 'reps') return { x, y: Math.max(...h.sets.map(s => s.r)), f };
    return { x, y: h.sets.reduce((a, s) => a + s.r, 0), f, tip: h.sets.length + ' sérií' };
  }).filter(p => p.y > 0);
  if (isCardio(ex)) pts.forEach(p => { p.y = +(p.y / 60).toFixed(1); });
  lineChart(el, pts, m === 'reps' || m === 'tot' ? unitOf(ex) : 'kg');
}

const HOWTO = `<div class="card how">
  <p><b>Dvojitá progrese.</b> V rozsahu opakování nejdřív přidáváš opakování, váhu až nad horní hranicí. Přidávat opakování i váhu vede k podobnému růstu svalů (Plotkin a kol., 2022).</p>
  <p><b>Kdy přidat váhu.</b> Až všechny série zvládneš na horní hranici s rezervou – zhruba 1–2 opakování navíc. Krok 2–10 % (ACSM, 2009). Když by krok byl víc než 10 % (malé jednoručky), aplikace chce nejdřív o 2 opakování víc.</p>
  <p><b>Ne každý trénink.</b> Když horní hranici dáš až v selhání, musíš ji potvrdit ještě jednou. Po slabším dni (−5 % a víc) se nepřidává. U pokročilých jsou přírůstky pomalejší – to je normální.</p>
  <p><b>Náročnost série.</b> Po každé sérii vybereš, jak byla těžká: Lehká (4+ opakování v rezervě), Střední (3), Těžká (2), Na hraně (1), Selhání. Z toho se počítá odhad 1RM a plánuje přetížení – lehké série posunou váhu rychleji, série na hraně a v selhání ji drží. Odhad rezervy je u zkušenějších přesnější a nejlepší je těsně u selhání (Zourdos a kol., 2016).</p>
  <p><b>Selhání není nutné.</b> Pro růst svalů pomáhá končit blízko selhání, samotné selhání přidá jen málo; síla na blízkosti k selhání skoro nezávisí (Refalo a kol., 2023; Robinson a kol., 2024). Proto cíl RIR 1–2 u těžkých cviků.</p>
  <p><b>Stagnace.</b> Tři tréninky bez zlepšení a se selháním = lehčí týden (~90 % váhy, o sérii méně), ne pauza – úplná týdenní pauza v jedné studii mírně snížila nárůst síly (Coleman a kol., 2024; Bell a kol., 2023).</p>
  <p><b>Váha u jednoruček.</b> S jednou jednoručkou (přítah v opoře, výpony) zapisuj její váhu. Se dvěma (tlaky, bicepsový zdvih, upažování) zapisuj součet obou – 2 × 12 kg = 24 kg. Pod názvem cviku vždy vidíš, co se zapisuje.</p>
  <p><b>Objem.</b> Víc sérií týdně = víc růstu, s klesajícím přínosem (Pelland a kol., 2024). Orientačně 10–20 sérií na partii týdně.</p>
  <p class="note"><a href="https://peerj.com/articles/14142" target="_blank" rel="noopener">Plotkin 2022</a> · <a href="https://pubmed.ncbi.nlm.nih.gov/19204579/" target="_blank" rel="noopener">ACSM 2009</a> · <a href="https://openrepository.aut.ac.nz/items/78679612-6ff4-4d00-95d1-7920d072a760" target="_blank" rel="noopener">Refalo 2023</a> · <a href="https://doi.org/10.1007/s40279-024-02069-2" target="_blank" rel="noopener">Robinson 2024</a> · <a href="https://pubmed.ncbi.nlm.nih.gov/38274324/" target="_blank" rel="noopener">Coleman 2024</a> · <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511399/" target="_blank" rel="noopener">Bell 2023</a> · <a href="https://sportrxiv.org/index.php/server/preprint/view/460" target="_blank" rel="noopener">Pelland 2024</a></p>
</div>`;
/* ── Tělo: váha, fotky postavy, porovnání ── */
function vBody() {

  const base = B.filter(x => x.d <= localISO(now() - 30 * DAY).slice(0, 10)).pop() || B[0];
  const ch = last && base && base !== last ? last.kg - base.kg : null;
  const ph = livePhotos('body');
  const months = {}; ph.forEach(x => { const k = new Date(x.d).toLocaleDateString('cs-CZ', { month: 'long', year: 'numeric' }); (months[k] = months[k] || []).push(x); });
  return `<div class="kicker">Váha · fotky · proměna</div><h1 class="title">Tělo<span class="d">.</span></h1>
    <div class="card stack">
      <div class="row"><input id="bw" inputmode="decimal" placeholder="${last ? fmt(last.kg, 1) : 'Váha v kg'}" aria-label="Dnešní váha v kg" style="flex:1"><button class="btn p" data-act="bwsave">${last && last.d === today ? 'Přepsat dnešní' : 'Uložit váhu'}</button></div>

      ${B.length > 1 ? '<div class="chart" id="bwchart"></div>' : '<p class="note">Važ se ideálně ráno po probuzení – denní výkyvy jsou normální, důležitý je trend (Ø 7 dní).</p>'}
      ${B.length ? `<div class="bwrows">${B.slice(-4).reverse().map(x => `<div class="row"><span style="flex:1">${dShort(x.d)}</span><span>${fmt(x.kg, 1)} kg</span><button class="btn sm ghost" data-act="bwdel" data-id="${x.id}" aria-label="Smazat záznam">✕</button></div>`).join('')}</div>` : ''}

  } catch {}
}
